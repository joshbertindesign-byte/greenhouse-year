(function(){

<script>
'use strict';

// ---------------- rules ----------------

const PSH=['E.win','L.win','E.spr','L.spr','E.sum','L.sum','E.fall','L.fall'];

  kale:{name:'Kale',g:2,sell:[0,1,6,7],price:40,loss:.05,q:[8,18],color:'#6e7f96'},
  hydrangea:{name:'Hydrangea',g:3,sell:[3,4],price:88,loss:.07,q:[6,14],color:'#3d8bd6'}};
const GEN={vinca:1200,begonia:1500,geranium:1800,fern:2000,kale:2200,hydrangea:3500,poinsettia:4500};
const STARTERS=['pothos','petunia','mum'];

const SHOWC={orchid:{name:'Orchid',g:3,price:150,color:'#b8297f',care:['mist','mist','stake']},rose:{name:'Rose',g:2,price:120,color:'#c8202f',care:['prune','mist','prune']},peony:{name:'Peony',g:2,price:130,color:'#e0567f',care:['stake','prune','stake']},calla:{name:'Calla lily',g:2,price:110,color:'#a8954a',care:['mist','stake','mist']}};
for(const k in SHOWC){const C=SHOWC[k];CROPS[k]={name:C.name,g:C.g,sell:[0,1,2,3,4,5,6,7],price:C.price,loss:.05,q:[6,10],color:C.color,show:true};}
const SHOWS=[{p:1,n:'Winter Orchid Show',c:['orchid']},{p:2,n:'Early Spring Bloom',c:['calla','orchid']},{p:3,n:'Spring Flower Show',c:['peony','calla','rose']},{p:4,n:'Rose and Peony Gala',c:['rose','peony']},{p:5,n:'Summer Garden Party',c:['calla','rose']},{p:6,n:'Harvest Home Show',c:['orchid','calla']},{p:7,n:'Holiday Showcase',c:['orchid','rose']}];
const CARE={mist:'Mist',stake:'Stake',prune:'Deadhead'};
const plural=k=>CROPS[k].name==='Calla lily'?'Calla lilies':CROPS[k].name+'s';
const isShowCrop=k=>!!(CROPS[k]&&CROPS[k].show);
for(const k in CROPS)CROPS[k].cost=Math.round(CROPS[k].price*.3);
const CUST=['Red Dirt Landscaping','Caprock Home and Garden','Sunrise Grocery','Pecan Street Market','Windmill Hardware','Hillside Garden Center','Mesa Florist','Big Country Feed'];
const TIERS=[{n:'Lost',min:0,pm:.9,w:0,c:'#8a958d'},{n:'Wary',min:20,pm:.94,w:.5,c:'#c8402f'},{n:'Steady',min:40,pm:1,w:1,c:'#5d6b62'},{n:'Loyal',min:65,pm:1.06,w:1.6,c:'#2e7d4a'},{n:'Partner',min:85,pm:1.12,w:2.2,c:'#c98a00'}];
const PERK=['Sends no orders','Prices −6%, no contracts','Regular prices','Prices +6%, more orders','Prices +12%, the most orders'];

const BUMP_REP=10,CANCEL_REP=15;
const tierIx=r=>{let i=0;TIERS.forEach((t,k)=>{if(r>=t.min)i=k;});return i;};
const custR=n=>(S&&S.cust&&S.cust[n]?S.cust[n].r:50);
const tierOf=n=>TIERS[tierIx(custR(n))];
const short1=n=>n.split(' ')[0];
const initials=n=>n.split(' ').filter(w=>w!=='and').slice(0,2).map(w=>w[0]).join('');
const avgRep=()=>CUST.reduce((a,n)=>a+custR(n),0)/CUST.length;
function custRep(n,d,why){
  if(!S.cust||!S.cust[n]||!d)return 0;
  const c=S.cust[n],r0=c.r;if(d>0)d*=clamp((100-r0)/40,.15,1)*(catOn('max')?1.1:1)*(hasBuild('garden')?1.1:1);

  const t0=tierIx(r0),t1=tierIx(c.r);
  if(t1!==t0)toast(t1>t0?'good':'bad',`${n} is now ${TIERS[t1].n}: ${PERK[t1].toLowerCase()}`);
  return c.r-r0;
}
function tierDrops(ch){const agg={};ch.forEach(x=>agg[x.cust]=(agg[x.cust]||0)+x.d);const out=[];for(const n in agg){const r=custR(n),t0=tierIx(r),t1=tierIx(clamp(r+agg[n],0,100));if(t1<t0)out.push({n,from:TIERS[t0],to:TIERS[t1],ti:t1});}return out;}
function custAv(n,size){const i=CUST.indexOf(n);return`<span class="cav" style="width:${size}px;height:${size}px;background:${CCOL[i]||'#56606b'};font-size:${Math.round(size*.36)}px">${initials(n)}</span>`;}
const tierChip=n=>{const T=tierOf(n);return`<span class="tchip" style="background:${T.c}">${T.n}</span>`;};
function pickCust(contract){const l=CUST.map(n=>{const i=tierIx(custR(n));return{n,w:contract&&i<2?0:TIERS[i].w};}).filter(x=>x.w>0);return l.length?wpick(l).n:(contract?null:pick(CUST));}
function guardRep(ch,what,ok){
  const drops=tierDrops(ch);if(!drops.length||window.__quiet){ok();return;}
  modal(`<h2>${drops.length>1?'Customers will cool off':'A customer will cool off'}</h2><p>${esc(what)}</p><div class="roles">${drops.map(x=>`<div class="role">${custAv(x.n,44)}<div class="rn"><b>${esc(x.n)}</b><span>${x.from.n} → <b style="display:inline;color:var(--bad)">${x.to.n}</b>. ${PERK[x.ti]}.</span></div></div>`).join('')}</div><div class="ab2"><button class="btn" id="gNo" type="button">Keep them happy</button><button class="btn sun" id="gOk" type="button">Do it anyway</button></div>`);
  $('gNo').onclick=closeModal;$('gOk').onclick=()=>{closeModal();ok();};
}
const LETTERS='ABCDEFGH'.repeat(13);
const SLOT=[[0,0],[11,0],[0,9],[11,9]];
const HOUSES=Array.from({length:12},(_,h)=>({h,s:h%4,L:Math.floor(h/4),ox:SLOT[h%4][0],oy:SLOT[h%4][1]}));
const SH=12;HOUSES.push({h:SH,s:-1,L:0,ox:-11,oy:0,show:true});
const hasShow=()=>!!(S&&S.show);
const houseIds=()=>{const a=[...Array(S.floors).keys()];if(hasShow())a.push(SH);return a;};
const builtH=()=>houseIds().map(h=>HOUSES[h]);
const benchIds=()=>houseIds().flatMap(h=>[0,1,2,3,4,5,6,7].map(i=>h*8+i));
const hName=h=>h===SH?'Showcase house':floorName(h);
const FIELD_H=30;
const lvOf=h=>h===FIELD_H?0:HOUSES[h].L;
// ---------------- the tree field: long crops, grower-only care ----------------
const TREES={
  jmaple:{n:'Japanese maple',yrs:2,cash:3000,st:6,c:'#b8332a',note:'Quick to grow, fussy about pruning',prune:[1,5]},
  spruce:{n:'Blue spruce',yrs:3,cash:5000,st:9,c:'#5b8fa8',note:'Sturdy and easy: no pruning',prune:[]},
  magnolia:{n:'Magnolia',yrs:3,cash:6000,st:11,c:'#d0558f',note:'A late frost can hurt it',prune:[1],frost:1},
  rmaple:{n:'Red maple',yrs:4,cash:8500,st:15,c:'#d0582a',note:'Needs staking for its first two years',prune:[1],stake2:1},
  oak:{n:'Live oak',yrs:5,cash:13000,st:24,c:'#3f6a3a',note:'Slow, steady and valuable',prune:[1]}};
const TJOB={stake:{n:'Stake',w:1.6},prune:{n:'Prune',w:2.2},water:{n:'Water',w:1.2},borer:{n:'Treat',w:1.8},root:{n:'Root-prune',w:2.6},frost:{n:'Cover',w:1.2},storm:{n:'Re-stake',w:1.6},dig:{n:'Dig up',w:3}};
const TJOBL={stake:'stake and tie',prune:'prune',water:'water through the dry spell',borer:'treat for borers',root:'root-prune before the sale',frost:'cover against the late frost',storm:'re-stake after the storm',dig:'dig and wrap for the buyer'};
const fieldOpen=()=>!!S&&stage()>=FIELD_LV;
const fieldCap=()=>{let n=0;for(const [lv,k] of FIELD_CAP)if(stage()>=lv)n=k;return n;};
const spotXY=i=>({x:23+3*(i%3),y:1+3*Math.floor(i/3)});
const fieldRows=()=>Math.max(2,Math.ceil(fieldCap()/3));
const fieldY1=()=>1+3*(fieldRows()-1)+1.6;
const treesOf=()=>(S.field&&S.field.trees)||{};
const treeTot=t=>TREES[t.sp].yrs*8;
const treeReady=t=>t.age>=treeTot(t);
const treeSize=t=>{const f=t.age/treeTot(t);return f<.2?0:f<.5?1:f<.85?2:3;};
const treeVal=(t,k)=>{const T=TREES[t.sp],q=.4+.6*clamp(t.g,0,100)/100;return k==='cash'?Math.round(T.cash*q/50)*50:Math.max(1,Math.round(T.st*q));};
const treeWindow=()=>[2,3,6,7].includes(S.period);
const gradeL=g=>g>=90?'A':g>=75?'B':g>=55?'C':'D';
const treeAt=(x,y)=>{if(!fieldOpen())return false;for(const k in treesOf()){const p=spotXY(+k);if(p.x===x&&p.y===y)return true;}return false;};
function schedTreeJobs(c){
  if(!fieldOpen()||window.__quiet)return;
  if(S.ys.wx==null){S.ys.wx=1;S.ys.dry=rnd()<.4;S.ys.frost=rnd()<.3;S.ys.storm=rnd()<.15;}
  const storm=c===5&&S.ys.storm?Object.keys(treesOf()).sort(()=>rnd()-.5).slice(0,ri(1,3)).map(Number):[];
  for(const k in treesOf()){const t=treesOf()[k],T=TREES[t.sp],sp=+k,left=treeTot(t)-t.age;let job=null;
    if(t.sell)job='dig';
    else if(c===2&&T.frost&&S.ys.frost)job='frost';
    else if(storm.includes(sp))job='storm';

    else if(T.prune.includes(c)&&t.age>=4)job='prune';
    else if(c===4&&S.ys.dry&&t.age<16)job='water';
    else if(c===3&&rnd()<.08)job='borer';
    if(job)S.events.push({at:PSEC*(.05+rnd()*.35),k:'tree',spot:sp,job});
  }

function treeMiss(t){const tr=treesOf()[t.spot];if(!tr)return;const T=TREES[tr.sp];
  if(t.job==='dig'){toast('bad',`The buyer will come back for your ${T.n.toLowerCase()} next period`);return;}
  tr.g=Math.max(0,tr.g-15);if(t.job==='stake')tr.staked=(tr.staked||0)+1;if(t.job==='root')tr.rp=1;
  toast('bad',`Missed: ${TJOBL[t.job]} (${T.n.toLowerCase()}). Its grade dropped to ${gradeL(tr.g)}`);}
function treeDone(t){const tr=treesOf()[t.spot];if(!tr)return;const T=TREES[tr.sp],p=spotXY(t.spot);
  if(t.job==='stake')tr.staked=(tr.staked||0)+1;if(t.job==='root')tr.rp=1;
  if(t.job==='dig'){const v=treeVal(tr,tr.sell);if(tr.sell==='cash'){S.cash+=v;S.ys.rev+=v;S.ys.trees=(S.ys.trees||0)+v;floats.push({x:p.x+.5,y:p.y+.5,f:0,text:'+'+fmt(v),color:'#2e7d4a',t0:performance.now()});toast('cash',`Sold your ${T.n.toLowerCase()} to a landscaper for ${fmt(v)}`);}
    else{S.stars=(S.stars||0)+v;floats.push({x:p.x+.5,y:p.y+.5,f:0,text:`+${v} ★`,color:'#c98a00',t0:performance.now()});toast('good',`The county arboretum took your ${T.n.toLowerCase()}: ${v} ★`);}
    S.field.sold=(S.field.sold||0)+1;delete S.field.trees[t.spot];save();return;}
  floats.push({x:p.x+.5,y:p.y+.5,f:0,text:'✓',color:'#2e7d4a',t0:performance.now()});}
function drawField(){
  if(!fieldOpen()||viewF!==0)return;
  const y1=fieldY1(),q=(a,b,c,d,col,st)=>poly([P(a,b,0),P(c,b,0),P(c,d,0),P(a,d,0)],col,st);
  q(21.7,-.3,30.3,y1,'rgba(150,120,70,.16)');

function payday(){

  S.crew.forEach(r=>{r.owed=(r.owed||0)+r.wage;r.missed=(r.missed||0)+1;});

const upLv0=k=>(S.up&&S.up[k])||0;
const upkeep0=()=>OVERHEAD+FLOOR_OH*(S.floors-1)+(hasShow()?SHOW_OH:0);
function callAvail(c){const r=(S.calls||{})[c.id];if(c.lv*2-1>stage())return false;if(r){if(c.once&&r.ever)return false;if(c.cd&&r.y!=null&&S.year-r.y<c.cd)return false;if(r.y===S.year&&r.n>=(c.max||1))return false;}try{return !c.when||c.when();}catch(e){return false;}}
function ringPhone(){
  if(S.tasks.some(t=>t.type==='phone')||!CALLS.some(callAvail))return;
  const t=addTask({type:'phone',born:S.t,due:S.t+((S.office||1)>=2?25:15)});
  toast('phone','The phone is ringing',()=>{enqueue(t);jumpTo(0);});
}
function answerCall(){
  const L=CALLS.filter(callAvail);if(!L.length){toast('phone','They hung up');return;}
  let ctx=null,c=null;for(let k=0;k<6&&!ctx;k++){c=wpick(L.map(x=>({...x,w:(x.w||1)*(x.lv>=stage()-1?1.6:1)})));c=CALLS.find(x=>x.id===c.id);try{ctx=c.make();}catch(e){ctx=null;}}
  if(!ctx){toast('phone','They hung up');return;}
  S.calls=S.calls||{};const r=S.calls[c.id]||(S.calls[c.id]={});if(r.y!==S.year){r.y=S.year;r.n=0;}r.n++;r.ever=1;
  if(window.__quiet){const res=ctx.opts[ctx.opts.length-1].go();return;}
  modal(`<div class="call"><div class="ch">${ctx.av}<div><small>ON THE PHONE</small><b>${esc(ctx.who)}</b></div><span class="cring">${svgIcon('phone',34)}</span></div><p class="say">${ctx.say}</p>
    <div class="opts">${ctx.opts.map((o,i)=>`<button class="opt" type="button" data-co="${i}"${o.dis?' disabled':''}><b>${o.t}</b><span>${o.fx}${o.dis?' · not enough cash':''}</span></button>`).join('')}</div></div>`);
  $('mbox').querySelectorAll('[data-co]').forEach(b=>b.onclick=()=>{const o=ctx.opts[+b.dataset.co],res=o.go();closeModal();hud();traySig='';renderTray();
    if(res==='retire'){gameOver();return;}
    if(res==='board'){openSheet('orders');return;}
    if(sheetOpen())renderSheet();});
}
function drawPhone(H,now){
  const z=H.L*FH,ring=S.tasks.some(t=>t.type==='phone'),sh=ring?Math.sin(now/35)*1.6*sc:0,[X,Y]=P(H.ox+PHONE.x+.55,H.oy+.04,z+40),k=sc;
  cx.save();cx.translate(X+sh,Y);
  cx.fillStyle='#e9dfc6';cx.strokeStyle='#5d4a36';cx.lineWidth=1.4*k;rr(-6*k,-9*k,12*k,18*k,3*k);cx.fill();cx.stroke();
  cx.fillStyle='#2f3a44';rr(-7.5*k,-12*k,15*k,5*k,2.5*k);cx.fill();
  cx.fillStyle='#5d4a36';for(let i=0;i<3;i++)for(let j=0;j<3;j++){cx.beginPath();cx.arc((-3+j*3)*k,(-2+i*3)*k,.8*k,0,7);cx.fill();}
  if(ring){cx.strokeStyle='#e2552f';cx.lineWidth=2*k;const a=(now/600)%1;cx.globalAlpha=1-a;for(const [a0,a1] of [[-.35,.35],[Math.PI-.35,Math.PI+.35]]){cx.beginPath();cx.arc(0,-2*k,(13+a*9)*k,a0,a1);cx.stroke();}cx.globalAlpha=1;}
  cx.restore();
}

  if(!d.wageV){d.wageV=2;const NW={pot:190,water:145,pest:170,fix:130,load:190,prize:800},OW={pot:120,water:90,pest:105,fix:80,load:120,prize:600};(d.crew||[]).forEach(r=>{if(NW[r.role])r.wage=Math.round((r.wage||OW[r.role])*NW[r.role]/OW[r.role]/5)*5;});}
  if(!d.tips){d.tips={};const vet=d.hist.length>0||d.year>1;const m=k=>d.tips[k]=1;if(vet)['place','start','pot','queue','water','pest','fix','load','goal','phone'].forEach(m);if((d.crew||[]).length)m('crew');if(Object.values(d.up||{}).some(Boolean))m('up');if(d.floors>1)m('house');if(d.show)m('show');if((d.crew||[]).some(r=>r.role==='prize'))m('prize');if(d.home&&Object.keys(d.home).length)m('home');if((d.owned||[]).length>7)m('gen');}
  if(!d.homeV){d.homeV=1;d.cats=['anna'];d.stars=d.hist.reduce((a,r)=>a+(r.stars||0)+(r.met?3:0),0);d.home={};d.catHouse=1;d.office=1;}if(d.credit>0)d.loans.push({id:'L'+(d.nid++),orig:d.credit,left:d.credit});delete d.credit;delete d.negRun;d.loanAsk=d.loanAsk||'';(d.crew||[]).forEach(r=>{r.missed=r.missed||0;r.owed=r.owed||0;});d.broken=Array.from({length:13},(_,i)=>!!(d.broken&&d.broken[i]));d.dmgT=Array.from({length:13},(_,i)=>(d.dmgT&&d.dmgT[i])||0);if(!d.cust)d.cust=Object.fromEntries(CUST.map(n=>[n,{r:clamp(d.rep??50,0,100)}]));d.rep=CUST.reduce((a,n)=>a+d.cust[n].r,0)/CUST.length;d.owned=d.owned||['petunia','vinca','geranium','begonia','pothos','mum','poinsettia'];if(!Array.isArray(d.crew)){const old=d.crew||{};d.crew=[];let i=0;for(const k in old)for(let j=0;j<old[k];j++)d.crew.push({id:'s'+(d.nid++),name:NAMES[i++%NAMES.length],role:k,home:0,n:VET,wage:ROLES[k].cost});}return d;}}catch(e){}return null;}
function welcome(){
  modal(`<h2>Greenhouse Year</h2><p>One greenhouse, eight benches to start, eight periods a year.</p>
  <div class="steps">
  <div>${svgIcon('pop',40)}<span><b>Plan:</b> between periods, offers come up one at a time. Place each on the board or bin it. Bigger orders take more benches, slower crops take more periods.</span></div>
  <div>${svgIcon('pot',40)}<span><b>Work:</b> tap the big icons to queue jobs. A job's countdown stops once someone's on it.</span></div>
  <div>${svgIcon('load',40)}<span><b>Ship:</b> each order gets its own truck. They line up at one dock and only wait so long.</span></div>
  <div>${svgIcon('floor',40)}<span><b>Grow:</b> you start with three varieties. Buy genetics for more, hire crew and build more houses.</span></div>
  <div>${svgIcon('star',40)}<span><b>Homestead:</b> between years you head home to spend stars on clearing land, building and adopting cats.</span></div>
  <div>${trophySVG(40)}<span><b>Goals:</b> each year has a goal. Hit it to reach the next level and unlock new upgrades, varieties, houses and crew. At year end Best Homes and Gardens ranks the best nurseries out of five stars.</span></div></div>
  <button class="btn go" id="wGo" type="button">Let's go</button>`);
  $('wGo').onclick=()=>{S.welcomed=true;closeModal();if(!S.name)nameModal(true,()=>enterHome());else enterHome();};
}

// ---------------- loop ----------------
let lastT=performance.now(),uiT=0;
function frame(now){
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  const paused=sheetOpen()||!$('modal').hidden||tipBlocking();
  if(S.phase==='run'&&!paused){
    simStep(dt*speed*BASE_PACE);
    if((uiT+=dt)>.15){uiT=0;hud();}
  }
  if(S.phase==='run'&&sheetOpen())renderSheetLite();
  if(S.phase==='home')stepHome(dt);
  stepCats(dt);renderTray();renderRail();draw(now);tipsTick(dt);
  requestAnimationFrame(frame);
}
let lite='';
function renderSheetLite(){const sig=S.offers.map(o=>o.id).join(',');if(sig!==lite){lite=sig;if(tab==='orders')renderSheet();}}
addEventListener('resize',()=>{layout();renderFloors();if(sheetOpen())renderSheet();});
function boot(){
  S=load();
  if(!S){fresh();genOffers();}
  else if(S.phase==='run'){S.phase='plan';S.t=0;S.trucks=[];}
  prepArt();syncStaff();layout();hud();
  if(S.phase==='over'||S.lost)gameOver();
  else if(S.phase==='done')yearEnd();
  else if(!S.welcomed)welcome();
  else if(!S.name)nameModal(true,()=>S.phase==='home'?enterHome():openSheet());
  else if(S.phase==='home')enterHome();
  else openSheet();
  try{const gm=location.hash.match(/[#&]g=(.+)$/);if(gm){history.replaceState(null,'',location.pathname+location.search);const code=gm[1];if(S.welcomed&&S.name)setTimeout(()=>redeemGift(code),800);else{S.pendingGift=code;save();}}}catch(e){}
  requestAnimationFrame(frame);
  setTimeout(layout,300);
  try{const ios=/iPhone|iPad|iPod/.test(navigator.userAgent),standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
    if(ios&&!standalone&&!localStorage.getItem('gy8tip')){localStorage.setItem('gy8tip','1');setTimeout(()=>toast('good','Tip: to play full screen, tap ⋯ next to the address bar, then Share, then Add to Home Screen'),4000);}}catch(e){}
}
boot();
</script>
