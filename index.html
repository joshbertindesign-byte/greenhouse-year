<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Greenhouse Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16231b;--mute:#5d6b62;--paper:#fbfaf5;--line:#e4e0d3;--hud:#173426;--sun:#f2c230;--go:#2e7d4a;--bad:#c8402f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#79a95b;font-family:Outfit,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;background:var(--hud);color:#fff}
.when{min-width:0}
.when b{display:block;font-size:20px;font-weight:600;line-height:1.1;white-space:nowrap}
.yr{display:flex;gap:3px;margin-top:6px}
.yr i{display:block;width:22px;height:7px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.yr i b{display:block;height:100%;background:var(--sun)}
.stat{background:rgba(255,255,255,.09);border-radius:10px;padding:4px 10px;line-height:1.15}
.stat small{display:block;font-size:12px;opacity:.75}
.stat b{font-size:18px;font-weight:600}
.stat b.neg{color:#ffb4a6}
.sp{flex:1}
.hb{border:0;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:600;background:rgba(255,255,255,.14);color:#fff;display:inline-flex;align-items:center;gap:6px}
.hb.go{background:var(--sun);color:#2b2104}
.hb .n{background:#e2552f;color:#fff;border-radius:99px;font-size:13px;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 6px}
.hb .n:empty{display:none}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:#fff;padding:7px 12px;border-radius:9px;font-weight:600}
.seg button.on{background:rgba(255,255,255,.22)}
@media (max-width:600px){.hud{gap:6px 8px;padding:8px 10px}.when{flex:1 1 100%;display:flex;align-items:center;justify-content:space-between}.when b{font-size:18px}.yr{margin:0}.yr i{width:16px}.stat b{font-size:16px}.hb{padding:9px 13px;font-size:15px}}

.toasts{position:fixed;left:50%;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(94vw,460px)}
.toast{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 14px 8px 8px;font-size:17px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:tin .25s ease-out}
.toast.tap{pointer-events:auto;cursor:pointer;border:3px solid var(--sun)}
.toast .go{margin-left:auto;padding-left:10px;color:#8a6400;font-size:15px;white-space:nowrap}
.paused{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:#2b2104;border-radius:10px;padding:4px 10px;font-size:14px;font-weight:700}
.uprow{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:10px}
.uprow .rn{flex:1;min-width:0}.uprow .rn b{display:block;font-size:17px}.uprow .rn span{font-size:14px;color:var(--mute)}
.pips3{display:flex;gap:4px;margin-top:4px}.pips3 i{width:22px;height:8px;border-radius:4px;background:#e4e0d3}.pips3 i.on{background:var(--go)}
.uprow .btn{padding:10px 14px;font-size:15px;white-space:nowrap}
.toasts.low{left:8px;transform:none;width:calc(100vw - 96px);align-items:flex-start}
.toasts.low .toast{font-size:15px;padding:6px 12px 6px 6px}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.ic{display:inline-grid;place-items:center;border-radius:50%;flex:none}
.ic svg{display:block}

.tray{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(251,250,245,.96);border-top:3px solid #dcd6c3;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.lane{display:flex;align-items:center;gap:10px;min-height:74px}
.lane .who{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.04em}
.cards{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px 2px 4px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;width:78px;height:74px;border-radius:14px;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-top:2px}
.card.now{border-color:var(--go)}
.card.warn{border-color:#e7a321}
.card.hot{border-color:var(--bad)}
.card .lb{font-size:14px;font-weight:600;line-height:1}
.card .bar{position:absolute;left:8px;right:8px;bottom:5px;height:5px;border-radius:3px;background:#e9e5d8;overflow:hidden}
.card .bar i{display:block;height:100%;width:0;background:var(--go)}
.card .x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:#5d6b62;color:#fff;font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
.lane.h .card{width:66px;height:62px}
.empty{color:var(--mute);font-size:15px;padding:0 6px}

.sheet{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,820px);max-height:92vh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);padding:14px 14px calc(14px + env(safe-area-inset-bottom));animation:up .28s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
@media (min-width:860px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:22px;animation:none}}
.bhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.bhead h2{margin:0;font-size:22px;font-weight:700;flex:1;min-width:180px}
.bhead h2 small{display:block;font-size:14px;font-weight:400;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--mute)}
.pill .s2{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.pill .s2 button{border:0;background:#fff;padding:6px 10px;font-weight:600;font-size:14px}
.pill .s2 button.on{background:var(--hud);color:#fff}
.xbtn{border:2px solid var(--line);background:#fff;border-radius:12px;width:40px;height:40px;font-size:20px;line-height:1}
.rail{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;touch-action:pan-x;scrollbar-width:thin}
.tk{position:relative;flex:none;width:128px;border-radius:16px;background:#fff;border:3px solid var(--line);padding:8px 10px 10px;touch-action:pan-x;cursor:grab}
.tk.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--sun)}
.tk .crop{display:inline-block;color:#fff;font-weight:700;font-size:14px;border-radius:8px;padding:2px 8px}
.tk .q{font-size:30px;font-weight:700;line-height:1;margin:6px 0 2px}
.tk .q small{font-size:14px;font-weight:500;color:var(--mute)}
.tk .row2{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tk .due{font-size:14px;font-weight:600}
.tk .val{font-size:14px;color:var(--mute)}
.tk .shape{display:grid;gap:2px}
.tk .shape i{display:block;width:10px;height:10px;border-radius:2px}
.tk .tag{position:absolute;top:-10px;left:10px;background:var(--sun);color:#2b2104;font-size:12px;font-weight:700;border-radius:8px;padding:1px 7px}
.tk .dx{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:#8a958d;color:#fff;font-size:15px;line-height:1;padding:0;display:grid;place-items:center}
.norail{color:var(--mute);font-size:15px;padding:10px 4px 14px}
.board{position:relative;touch-action:none;margin:2px auto 0}
.board .cell{position:absolute;border-right:1px solid #e7e3d6;border-bottom:1px solid #e7e3d6;background:#fff}
.board .cell.past{background:repeating-linear-gradient(135deg,#f1eee5 0 6px,#e8e4d8 6px 12px)}
.board .cell.now{background:#fff8dc}
.board .band{position:absolute;background:rgba(242,194,48,.16);border-left:2px dashed #d8a91c;border-right:2px dashed #d8a91c;pointer-events:none}
.board .ch,.board .rh{position:absolute;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--mute)}
.board .ch.now{color:var(--ink)}
.board .rh{font-size:16px;color:var(--ink)}
.blk{position:absolute;border-radius:9px;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:2px;border:2px solid rgba(0,0,0,.18);overflow:hidden;white-space:nowrap;pointer-events:none}
.blk.done{opacity:.35}
.blk.mv{pointer-events:auto;cursor:grab;touch-action:none}
.blk.picked{box-shadow:0 0 0 3px var(--sun);z-index:2;overflow:visible}
.blk.lift{opacity:.25}
.blk .bi{display:grid;place-items:center;opacity:.9}
.blk .bt{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis}
.blk{padding:0 4px;justify-content:space-between}
.blk .rm{position:absolute;top:-11px;right:-11px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:#16231b;color:#fff;font-size:16px;line-height:1;padding:0;display:grid;place-items:center;pointer-events:auto}
.board .cell.ok{background:#dff3e2}
.blk .short{background:#fff;color:var(--bad);border-radius:6px;padding:0 5px}
.grow{display:inline-flex;gap:6px;margin-top:6px}.grow .btn{padding:8px 12px;font-size:15px}
.board .cell.no{background:#f8dcd6}
.board .ch b{background:var(--hud);color:#fff;border-radius:7px;padding:1px 8px;font-size:12px}
.blk.fail{background:repeating-linear-gradient(135deg,#9d958a 0 6px,#8b8378 6px 12px)!important}
.blk.ghost{border:3px dashed #fff;opacity:.85;box-shadow:0 0 0 3px var(--go)}
.blk.ghost.bad{box-shadow:0 0 0 3px var(--bad);opacity:.55}
.bfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.bfoot .hint{flex:1;min-width:200px;font-size:14px;color:var(--mute)}
.btn{border:0;border-radius:14px;padding:13px 20px;font-size:17px;font-weight:700;background:#ece8dc}
.btn.go{background:var(--go);color:#fff}
.btn.sun{background:var(--sun);color:#2b2104}
.drag{position:fixed;z-index:9;pointer-events:none;border-radius:10px;opacity:.9;border:3px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}

.modal{position:fixed;inset:0;z-index:10;background:rgba(10,25,16,.45);display:grid;place-items:center;padding:16px}
.mbox{background:var(--paper);border-radius:22px;max-width:520px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.mbox h2{margin:0 0 8px;font-size:24px}
.mbox p{font-size:16px;line-height:1.5;margin:0 0 12px;color:#33433a}
.steps{display:grid;gap:10px;margin:14px 0 18px}
.steps div{display:flex;gap:12px;align-items:center;font-size:16px;line-height:1.35}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:17px;margin:12px 0 18px}
.kv b{text-align:right}
.ask{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));width:min(94vw,460px);background:#fff;border-radius:18px;border:3px solid var(--sun);box-shadow:0 8px 24px rgba(0,0,0,.25);padding:12px 14px 16px;animation:tin .2s ease-out;overflow:hidden}
.ask .aq{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ask .aq b{display:block;font-size:18px}.ask .aq span{font-size:14px;color:var(--mute)}
.ask .ab{display:flex;gap:8px}.ask .ab .btn{flex:1;padding:12px 10px;font-size:16px}
.ask .at{position:absolute;left:0;right:0;bottom:0;height:5px;background:#eee}.ask .at i{display:block;height:100%;background:var(--sun)}
.cnt{font-weight:700}
.board .cell.past{background:#e4e0d4}
.board .cell.cur{background:#fff6d2}
.board .ch.gone{color:#aaa497}
.blk.tiny .b1{font-size:12px}.blk.tiny .b2{font-size:11px}.blk.tiny{padding:0 1px}
.blk.tiny .rm{width:18px;height:18px;font-size:12px;top:1px;right:1px}
.tk.locked{background:#f3f1ea;border-style:dashed;cursor:default}
.tk.locked .crop,.tk.locked .q,.tk.locked .due,.tk.locked .shape{opacity:.55}
.tk .unl{display:block;width:100%;margin-top:6px;border:0;border-radius:10px;background:var(--sun);color:#2b2104;font-weight:700;font-size:13px;padding:7px 4px}
.gens{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:10px}
.gen{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.gen .crop{display:inline-block;color:#fff;font-weight:700;font-size:14px;border-radius:8px;padding:2px 8px;flex:none}
.gen .gi{flex:1;font-size:13px;color:var(--mute);line-height:1.3}
.gen .btn{padding:8px 10px;font-size:14px}
.gen .ok{color:var(--go);font-size:14px}
.gen.own{background:#f4fbf5}
.fsel{display:flex;gap:4px;margin-top:6px}.fsel button{border:2px solid var(--line);background:#fff;border-radius:9px;padding:3px 9px;font-weight:600;font-size:13px}.fsel button.on{background:var(--hud);border-color:var(--hud);color:#fff}
.hires{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.hire{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.hire:disabled{opacity:.5}.hire b{display:block;font-size:15px}.hire small{font-size:13px;color:var(--mute)}
.rqb{display:flex;gap:6px}.rqb .btn{padding:9px 12px;font-size:15px}
.chip .fb{display:inline-block;background:var(--hud);color:#fff;border-radius:6px;font-size:11px;padding:0 5px;margin-left:2px;vertical-align:1px}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px 8px;overflow:visible;padding:8px 2px 10px;touch-action:auto}
.tk{width:auto;padding:6px 8px 8px;border-radius:14px;touch-action:none}
.tk .crop{font-size:11px;padding:1px 5px;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .q{font-size:24px;margin:4px 0 0}.tk .q small{font-size:12px}
.tk .due{font-size:13px}.tk .val{font-size:14px;font-weight:600;color:var(--ink)}
.tk .shape i{width:8px;height:8px}
.tk .dx{width:24px;height:24px;font-size:13px;top:-9px;right:-9px}
.tk .tag{font-size:11px;top:-9px}
.tk .unl{font-size:12px;padding:6px 2px;margin-top:4px}
.av{position:relative;flex:none;width:48px;height:48px;border:0;background:none;padding:0;display:grid;place-items:center}
.av .ring{position:absolute;inset:0;width:48px;height:48px;transform:rotate(-90deg)}
.av .rt{fill:#fff;stroke:#e4e0d3;stroke-width:4}
.av .rp{fill:none;stroke:var(--go);stroke-width:4;stroke-dasharray:144.5;stroke-dashoffset:144.5;stroke-linecap:round}
.av .ai{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;position:relative}
.av.idle .ai{filter:grayscale(.85);opacity:.55}
.av.walk .rt{stroke:#bfe3c8}
.av .af{position:absolute;right:-2px;bottom:-2px;background:var(--hud);color:#fff;border:2px solid #fff;border-radius:8px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 3px}
.av .az{position:absolute;left:50%;transform:translateX(-50%);top:-7px;background:#8a958d;color:#fff;border-radius:6px;font-size:10px;padding:0 4px;line-height:14px}
.lane.crew .cards{gap:5px;padding-top:8px}
.crewpop{position:fixed;z-index:7;width:300px;background:#fff;border-radius:16px;border:2px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.22);padding:10px 12px 12px}
.crewpop .cph{display:flex;align-items:center;gap:10px}.crewpop .cph>div{flex:1;min-width:0}
.crewpop .cph b{display:block;font-size:16px}.crewpop .cph span{font-size:13px;color:var(--mute)}
.crewpop .xbtn{width:34px;height:34px;font-size:17px}
.crewpop .cpt{font-size:14px;margin-top:8px;color:var(--mute)}.crewpop .cpt b{color:var(--ink)}
.vtog{display:flex;gap:0;margin:0 0 10px;border:2px solid var(--line);border-radius:12px;overflow:hidden;width:max-content}
.vtog button{border:0;background:#fff;padding:8px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.vtog button.on{background:var(--hud);color:#fff}
.vtog .n{background:#e2552f;color:#fff;border-radius:99px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 5px}
.tk.ct{grid-column:span 2;background:#f8f5ff;border-color:#cdbdf0}
.tk.ct .ctag{background:#6b4fc8;color:#fff}
.tk .cps{display:flex;gap:3px}.tk .cps i{display:block;width:12px;height:12px;border-radius:3px}
.tk.ct .due{font-size:13px}.tk.ct .val{font-size:14px}
.placing{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid;border-radius:16px;padding:10px 12px;margin-bottom:10px}
.placing>div{flex:1;min-width:0}.placing b{display:block;font-size:17px}.placing span{font-size:14px;color:var(--mute)}
.placing .btn{padding:10px 14px;font-size:15px}
.stat .cred{display:block;font-size:11px;color:#ffd59a;opacity:1}
.stat .cred:empty{display:none}
.oc{display:block;font-size:11px;font-weight:600;opacity:.8}
.credit{margin:12px 2px 0;font-size:14px;color:var(--mute);line-height:1.4}
.stmt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:10px;font-size:15px}
.stmt summary{cursor:pointer}.stmt .neg{color:var(--bad);font-weight:700}.stmt .pos{color:var(--go);font-weight:700}
.stmt .kv{margin:8px 0 2px;font-size:15px}
.tk .cal{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin:6px 0 4px}
.tk .cal b{font-size:9px;color:var(--mute);text-align:center;font-weight:600}
.tk .cal b.now{color:var(--ink)}
.tk .cal i{display:block;height:13px;border-radius:3px;background:#efece2;font-style:normal;font-size:9px;line-height:13px;color:#fff;text-align:center;font-weight:700}
.tk .cal i.past{background:#dcd8cc}
.tk .cropsrow{display:flex;gap:4px;flex-wrap:wrap}
.hb.gear{font-size:20px;padding:8px 12px}
.nowline{position:absolute;width:3px;background:#16231b;border-radius:2px;pointer-events:none;z-index:3;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.blk{flex-direction:column;justify-content:center;align-items:center;padding:0 3px}
.blk .bx{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0;max-width:100%;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.blk .b1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.blk .b2{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.blk .fut{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 5px,rgba(255,255,255,.35) 5px 10px);pointer-events:none}
.blk.st-plan{border:2px dashed rgba(255,255,255,.95);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 5px,rgba(255,255,255,.3) 5px 10px)}
.blk.st-grow,.blk.st-ready{border:2px solid rgba(0,0,0,.25)}
.blk.st-ready{box-shadow:inset 0 0 0 3px rgba(255,255,255,.85)}
.blk.st-done{background-color:#a8a294!important;opacity:.75}
.blk.st-fail{opacity:.75}
.blk .rm{top:2px;right:2px;width:22px;height:22px;font-size:14px;border:2px solid rgba(255,255,255,.9);background:rgba(22,35,27,.85);z-index:2}
.blk .short{background:#fff;color:var(--bad);border-radius:6px;padding:0 4px;text-shadow:none}
[hidden]{display:none!important}

// No pinch or double-tap zoom: on a phone it throws the whole layout off.
(function(){
  const stop=e=>e.preventDefault();
  ['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,stop,{passive:false}));
  document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault();},{passive:false});
  document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
  addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault();});
  // If a zoom slips through anyway, snap back to 1x.
  const vv=window.visualViewport;
  if(vv)vv.addEventListener('resize',()=>{if(vv.scale>1.01){const m=document.getElementById('vp'),c=m.content;m.content=c.replace('maximum-scale=1','maximum-scale=1.0001');setTimeout(()=>{m.content=c;},30);}});
})();

<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=Math.random,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)];
const fmt=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

// ---------------- rules ----------------
const PN=['Early winter','Late winter','Early spring','Late spring','Early summer','Late summer','Early fall','Late fall'];
const PSH=['E.win','L.win','E.spr','L.spr','E.sum','L.sum','E.fall','L.fall'];
const PSEC=60,CAP=10,OVERHEAD=330,FLOOR_OH=150,FLOOR_COST=[0,4000,5000,6000,8000,8500,9000,9500,11000,11500,12000,12500],MAXF=12,POT_BY=.5,TRUCK_WAIT=30,STAFF_SLOW=1.15;
const CROPS={
  petunia:{name:'Petunia',g:1,sell:[2,3,4],price:34,loss:.05,q:[8,20],color:'#c0428a'},
  vinca:{name:'Vinca',g:1,sell:[4,5,6],price:34,loss:.05,q:[8,20],color:'#7656d2'},

  pothos:{name:'Pothos',g:2,sell:[0,1,2,3,4,5,6,7],price:54,loss:.04,q:[6,16],color:'#8fb72e'},

  fern:{name:'Fern',g:2,sell:[1,2,3,4,5,6],price:48,loss:.04,q:[6,16],color:'#2e7d5b'},
  kale:{name:'Kale',g:2,sell:[0,1,6,7],price:40,loss:.05,q:[8,18],color:'#6e7f96'},
  hydrangea:{name:'Hydrangea',g:3,sell:[3,4],price:88,loss:.07,q:[6,14],color:'#3d8bd6'}};
const GEN={vinca:1200,begonia:1500,geranium:1800,fern:2000,kale:2200,hydrangea:3500,poinsettia:4500};
const STARTERS=['pothos','petunia','mum'];
const owns=k=>!S.owned||S.owned.includes(k);
for(const k in CROPS)CROPS[k].cost=Math.round(CROPS[k].price*.3);
const CUST=['Red Dirt Landscaping','Caprock Home and Garden','Sunrise Grocery','Pecan Street Market','Windmill Hardware','Hillside Garden Center','Mesa Florist','Big Country Feed'];
const TIERS=[{n:'Lost',min:0,pm:.9,w:0,c:'#8a958d'},{n:'Wary',min:20,pm:.94,w:.5,c:'#c8402f'},{n:'Steady',min:40,pm:1,w:1,c:'#5d6b62'},{n:'Loyal',min:65,pm:1.06,w:1.6,c:'#2e7d4a'},{n:'Partner',min:85,pm:1.12,w:2.2,c:'#c98a00'}];
const PERK=['Sends no orders','Prices −6%, no contracts','Regular prices','Prices +6%, more orders','Prices +12%, the most orders'];
const CCOL=['#b5532f','#7a4fb0','#d08a17','#3a7fc2','#56606b','#2e7d5b','#c2427f','#8a6a2c'];
const BUMP_REP=10,CANCEL_REP=15;
const tierIx=r=>{let i=0;TIERS.forEach((t,k)=>{if(r>=t.min)i=k;});return i;};
const custR=n=>(S&&S.cust&&S.cust[n]?S.cust[n].r:50);
const tierOf=n=>TIERS[tierIx(custR(n))];
const short1=n=>n.split(' ')[0];
const initials=n=>n.split(' ').filter(w=>w!=='and').slice(0,2).map(w=>w[0]).join('');
const avgRep=()=>CUST.reduce((a,n)=>a+custR(n),0)/CUST.length;
function custRep(n,d){
  if(!S.cust||!S.cust[n]||!d)return 0;
  const c=S.cust[n],r0=c.r;if(d>0)d*=clamp((100-r0)/40,.15,1);
  c.r=clamp(r0+d,0,100);S.rep=avgRep();
  const t0=tierIx(r0),t1=tierIx(c.r);
  if(t1!==t0)toast(t1>t0?'good':'bad',`${n} is now ${TIERS[t1].n}: ${PERK[t1].toLowerCase()}`);
  return c.r-r0;
}
function tierDrops(ch){const agg={};ch.forEach(x=>agg[x.cust]=(agg[x.cust]||0)+x.d);const out=[];for(const n in agg){const r=custR(n),t0=tierIx(r),t1=tierIx(clamp(r+agg[n],0,100));if(t1<t0)out.push({n,from:TIERS[t0],to:TIERS[t1],ti:t1});}return out;}
function custAv(n,size){const i=CUST.indexOf(n);return`<span class="cav" style="width:${size}px;height:${size}px;background:${CCOL[i]||'#56606b'};font-size:${Math.round(size*.36)}px">${initials(n)}</span>`;}
const tierChip=n=>{const T=tierOf(n);return`<span class="tchip" style="background:${T.c}">${T.n}</span>`;};
function pickCust(contract){const l=CUST.map(n=>{const i=tierIx(custR(n));return{n,w:contract&&i<2?0:TIERS[i].w};}).filter(x=>x.w>0);return l.length?wpick(l).n:(contract?null:pick(CUST));}
function guardRep(ch,what,ok){
  const drops=tierDrops(ch);if(!drops.length||window.__quiet){ok();return;}
  modal(`<h2>${drops.length>1?'Customers will cool off':'A customer will cool off'}</h2><p>${esc(what)}</p><div class="roles">${drops.map(x=>`<div class="role">${custAv(x.n,44)}<div class="rn"><b>${esc(x.n)}</b><span>${x.from.n} → <b style="display:inline;color:var(--bad)">${x.to.n}</b>. ${PERK[x.ti]}.</span></div></div>`).join('')}</div><div class="ab2"><button class="btn" id="gNo" type="button">Keep them happy</button><button class="btn sun" id="gOk" type="button">Do it anyway</button></div>`);
  $('gNo').onclick=closeModal;$('gOk').onclick=()=>{closeModal();ok();};
}
const LETTERS='ABCDEFGH'.repeat(12);
const SLOT=[[0,0],[11,0],[0,9],[11,9]];
const HOUSES=Array.from({length:12},(_,h)=>({h,s:h%4,L:Math.floor(h/4),ox:SLOT[h%4][0],oy:SLOT[h%4][1]}));
const lvOf=h=>HOUSES[h].L;
const LB=Array.from({length:8},(_,k)=>({x:k%2?5:1,y:[1,2,4,5][k>>1]}));
const BENCH=Array.from({length:96},(_,i)=>{const H=HOUSES[Math.floor(i/8)],b=LB[i%8];return{L:LETTERS[i],i,f:H.h,lv:H.L,x:b.x+H.ox,y:b.y+H.oy,ax:b.x+1+H.ox,ay:(b.y===1?0:b.y===5?6:3)+H.oy};});
const unitOf=h=>{const H=HOUSES[h];return{x:8+H.ox,y:3+H.oy,ax:7+H.ox,ay:3+H.oy};};
const liftOf=h=>{const H=HOUSES[h];return{x:H.ox,y:6+H.oy};};
const DOCK={x:4,y:-1,f:0,h:-1};
const levels=()=>Math.ceil(S.floors/4);
const benchName=i=>(S&&S.floors>1?(Math.floor(i/8)+1):'')+LETTERS[i];
const WORK={pot:1.8,water:1,pest:2,fix:3.2};
const ROLES={
  pot:{name:'Planter',does:'Pots new orders',cost:120},
  water:{name:'Waterer',does:'Waters thirsty benches',cost:90},
  pest:{name:'Applicator',does:'Sprays for pests',cost:105},
  fix:{name:'Mechanic',does:'Fixes heaters and fans',cost:80},

function piece(x){return x.oid!=null?{plot:x,crop:x.crop,h:x.rows.length,s:x.s,e:x.e}:{offer:x,crop:x.crop,h:need(x),s:startOf(x),e:dueOf(x)};}
function fitsP(pp,top){

  if(Math.floor(top/8)!==Math.floor((top+pp.h-1)/8))return false;
  for(let r=top;r<top+pp.h;r++)for(let c=pp.s;c<=pp.e;c++){const o=plotAt(r,c);if(o&&o!==pp.plot)return false;}
  return true;
}
const fits=(of,top)=>fitsP(piece(of),top);

function place(of,top){
  if(!owns(of.crop)||!fits(of,top))return false;

  for(let i=0;i<h;i++){rows.push(top+i);const f=Math.ceil(left/(h-i));flats.push(f);left-=f;}

function candidates(c,minS,maxP,pref){
  const out=[];

function mkOffer(cd,mult,fixed){const C=CROPS[cd.k],cust=pickCust(false),base=C.price*(mult||1)*tierOf(cust).pm*(.92+rnd()*.22),of={id:S.nid++,crop:cd.k,p:cd.p,qty:ri(C.q[0],C.q[1]),price:Math.round(base*(fixed?1:seasF(cd.k,cd.p))),cust};if(!fixed)of.base=base;return of;}
function candFlex(c){const out=[];for(const k in CROPS){const C=CROPS[k];for(let p=c+C.g-1;p<=Math.min(7,c+4);p++){const f=seasF(k,p);out.push({k,p,w:f>1.1?3:f>=1?2:1});}}return out;}
function wpick(list){const t=list.reduce((a,x)=>a+x.w,0);let r=rnd()*t;for(const x of list){r-=x.w;if(r<=0)return x;}return list[list.length-1];}
function genOffers(){
  const c=S.period;S.offers=[];genContracts();
  const cand=candFlex(c);if(!cand.length)return;
  const mine=cand.filter(x=>owns(x.k));
  const base=clamp(1+Math.floor(S.rep/35)+(rnd()<.5?1:0),2,5),n=Math.round(base*S.floors);
  const theirs=cand.filter(x=>!owns(x.k)),sure=mine.length?Math.min(n,Math.max(2,Math.ceil(n*.5))):0;
  for(let i=0;i<sure;i++)S.offers.push(mkOffer(wpick(mine)));
  const rest=theirs.length?n-sure+1:n-sure;
  for(let i=0;i<rest;i++)S.offers.push(mkOffer(wpick(theirs.length?theirs:cand)));
  for(let i=S.offers.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[S.offers[i],S.offers[j]]=[S.offers[j],S.offers[i]];}

const okAt=(k,p,c)=>{const C=CROPS[k];return p>=0&&p<=7&&C.sell.includes(p)&&p-C.g+1>=c;};
const cPrice=k=>Math.round(CROPS[k].price*1.1*(.95+rnd()*.15));
function makeContract(c){
  const cust=pickCust(true);if(!cust)return null;const tpm=tierOf(cust).pm;
  const keys=Object.keys(CROPS),cands={steady:[],alt:[],ramp:[],long:[],mix:[]};

    const run=(step,max)=>{const out=[];for(let p=p0;p<=7&&out.length<max&&okAt(k,p,c);p+=step)out.push(p);return out;};
    const a=run(1,4),b=run(2,4),l=run(1,6);

}

function addTask(t){t.id=S.nid++;t.born=t.born??S.t;S.tasks.push(t);return t;}
function dropTask(t){S.tasks=S.tasks.filter(x=>x!==t);S.queue=S.queue.filter(x=>x!==t);}
const taskF=t=>t.type==='load'?0:t.type==='fix'?t.f:BENCH[t.bench].f;
function workOf(t){const m=t.type==='pot'?[1,.75,.55][upLv('potter')]:t.type==='load'?[1,.7,.5][upLv('fork')]:t.type==='fix'?[1,.7,.5][upLv('heat')]:1;if(t.type==='load'){const pl=S.plots.find(p=>p.id===t.plot);return(1.2+(pl?orderOf(pl).qty:10)*.09)*m;}return(t.rows?WORK[t.type]*t.rows.length:WORK[t.type])*m;}
function taskLabel(t){
  if(t.type==='load'){const pl=S.plots.find(p=>p.id===t.plot);return'Load '+(pl?crop(pl.crop).name:'');}
  if(t.type==='fix')return'Fix '+unitName(S.period).toLowerCase()+(S.floors>1?' in '+(t.f+1):'');
  const nm=({pot:'Pot',water:'Water',pest:'Spray'})[t.type];
  if(t.rows)return nm+' '+benchName(t.rows[0])+(t.rows.length>1?'–'+LETTERS[t.rows[t.rows.length-1]]:'');
  return nm+' '+benchName(t.bench);
}
function target(t){
  if(t.type==='load')return DOCK;
  if(t.type==='fix'){const u=unitOf(t.f);return{x:u.ax,y:u.ay,f:lvOf(t.f),h:t.f};}
  const b=BENCH[t.bench];return{x:b.ax,y:b.ay,f:b.lv,h:b.f};
}
const engaged=t=>me.task===t||staff.some(w=>w.task===t);
function complete(t){
  const pl=t.plot!=null?S.plots.find(p=>p.id===t.plot):null;
  if(t.type==='pot'&&pl&&!pl.done){
    const late=Math.max(0,S.t-t.due)/PSEC*.8;let lost=0;
    pl.rows.forEach((r,k)=>{pl.potted[k]=true;pl.alive[k]=Math.round(pl.flats[k]*(1-late));lost+=pl.flats[k]-pl.alive[k];});
    const cost=pl.flats.reduce((a,b)=>a+b,0)*crop(pl.crop).cost;S.cash-=cost;S.ys.plugs+=cost;
    if(lost)float(BENCH[t.bench],`${lost} lost, potted late`,'#c8402f');
  }
  if(t.type==='fix'){S.broken[t.f]=false;toast('good',`${unitName(S.period)} running again${S.floors>1?' in house '+(t.f+1):''}`);}
  dropTask(t);
  if(t.type==='load'&&pl&&!pl.done)ship(pl,t.truck);
}

// ---------------- trucks and shipping ----------------
let ask=null;
const truckById=id=>S.trucks.find(k=>k.id===id);
function dockNext(){
  if(S.trucks.some(k=>k.state==='dock'))return;
  const k=S.trucks.filter(k=>k.state==='line').sort((a,b)=>a.arrived-b.arrived)[0];if(!k)return;
  k.state='dock';
  const pl=S.plots.find(p=>p.id===k.plot);
  if(!pl||pl.done){k.state='gone';dockNext();return;}
  addTask({type:'load',plot:pl.id,truck:k.id,born:k.arrived,due:k.deadline});
}
function truckLeaves(k,missed){
  k.state='gone';k.leftAt=performance.now();
  if(missed){
    const pl=S.plots.find(p=>p.id===k.plot);
    if(pl&&!pl.done){pl.done=true;pl.fail=true;orderOf(pl).status='failed';custRep(orderOf(pl).cust,-12);S.ys.failed++;const cid=orderOf(pl).contract;if(cid)contractFail(cid);
      S.tasks.filter(t=>t.plot===pl.id).forEach(dropTask);toast('bad',`${orderOf(pl).cust.split(' ')[0]}'s truck gave up waiting`);}
  }
  dockNext();
}
function ship(pl,truckId){
  const o=orderOf(pl);
  let short=o.qty-have(pl),borrowed=0;
  if(short>0)for(const q of S.plots){
    if(short<=0)break;if(q===pl||q.done||q.crop!==pl.crop||!q.potted.some(Boolean)||prog(q)<1)continue;
    let sur=have(q)-orderOf(q).qty;
    for(let k=q.rows.length-1;k>=0&&sur>0&&short>0;k--){const n=Math.min(sur,short,q.alive[k]);q.alive[k]-=n;sur-=n;short-=n;borrowed+=n;}
  }
  if(borrowed){pl.alive[0]+=borrowed;float(BENCH[pl.rows[0]],`+${borrowed} from other benches`,'#2e7d4a');}
  pl.done=true;
  S.tasks.filter(t=>t.plot===pl.id).forEach(dropTask);
  if(short>0&&!window.__quiet){askBuy(pl,short,truckId);return;}
  finishShip(pl,window.__buyIn?short:0,truckId);
}
function finishShip(pl,bought,truckId){
  const o=orderOf(pl),C=crop(pl.crop),alive=have(pl)+bought,sent=Math.min(alive,o.qty),extra=alive-sent;
  const pm=1+.1*upLv('pots'),buyCost=bought*Math.round(C.price*1.2),rev=Math.round(sent*o.price*pm),clear=extra*Math.round(o.price*.35*pm);
  S.cash+=rev+clear-buyCost;S.ys.rev+=rev+clear;S.ys.buy+=buyCost;o.status='shipped';o.sent=sent;if(o.contract)contractShipped(o.contract);
  const k=truckById(truckId),waited=k&&k.arrived!=null?(S.t-k.arrived)-((k.deadline-k.arrived)-TRUCK_WAIT):0,slow=waited>TRUCK_WAIT*.5;
  if(sent>=o.qty){if(!bought&&!pl.hurt&&!slow)custRep(o.cust,2);if(slow)custRep(o.cust,-1);S.ys.full++;toast('cash',`${sent} ${C.name.toLowerCase()} shipped${slow?' (kept them waiting)':''}, +${fmt(rev+clear-buyCost)}`);}
  else{custRep(o.cust,-shortRep(sent,o.qty));S.ys.short++;toast('bad',`Short: ${sent} of ${o.qty} ${C.name.toLowerCase()}, +${fmt(rev+clear)}`);}
  if(k&&k.state!=='gone')truckLeaves(k,false);
}
const shortRep=(sent,qty)=>Math.round(2+8*(1-sent/qty));
let askQ=[];
function askBuy(pl,short,truckId){
  if(ask){askQ.push([pl,short,truckId]);return;}
  const o=orderOf(pl),C=crop(pl.crop),cost=short*Math.round(C.price*1.2),sent=Math.min(have(pl),o.qty),d=-shortRep(sent,o.qty),drop=tierDrops([{cust:o.cust,d}])[0];
  ask={pl,short,truckId};
  modal(`<h2>${esc(short1(o.cust))}'s truck is ${short} short</h2>
    <div class="role">${custAv(o.cust,44)}<div class="rn"><b>${esc(o.cust)} ${tierChip(o.cust)}</b><span>Ordered ${o.qty} ${C.name.toLowerCase()}. You have ${sent} ready.</span></div></div>
    <div class="opts"><button class="opt" id="askBuy" type="button"><b>Buy in ${short} flat${short>1?'s':''} · ${fmt(cost)}</b><span>Ships full. No reputation change.</span></button>
    <button class="opt" id="askShort" type="button"><b>Ship ${sent} of ${o.qty}</b><span>Paid for ${sent} · ${d} reputation with ${esc(short1(o.cust))}</span>${drop?`<em>Drops them to ${drop.to.n}: ${PERK[drop.ti].toLowerCase()}</em>`:''}</button></div>`);
  $('askBuy').onclick=()=>resolveAsk(short);$('askShort').onclick=()=>resolveAsk(0);
}
function resolveAsk(bought){if(!ask)return;const a=ask;ask=null;closeModal();finishShip(a.pl,bought,a.truckId);hud();if(askQ.length)askBuy(...askQ.shift());}

// ---------------- crew ----------------
function syncStaff(){
  staff=staff.filter(w=>S.crew.some(r=>r.id===w.id));
  for(const r of S.crew){if(r.home>=S.floors)r.home=0;let w=staff.find(x=>x.id===r.id);if(!w){const hh=r.role==='load'?0:r.home,H=HOUSES[hh];w=mkWorker(r.id,r.role,H.ox+1.5+staff.length%7,H.oy+6.5);w.f=H.L;staff.push(w);}w.rec=r;}
}
function hire(role){
  const used=S.crew.map(r=>r.name),name=NAMES.find(n=>!used.includes(n))||('Hand '+(S.crew.length+1));
  S.crew.push({id:'s'+S.nid++,name,role,home:role==='load'?0:clamp(viewF*4,0,S.floors-1),n:0,wage:ROLES[role].cost});syncStaff();
}
function fireCrew(id){const r=S.crew.find(x=>x.id===id);S.crew=S.crew.filter(x=>x.id!==id);const w=staff.find(x=>x.id===id);if(w&&w.task)w.task=null;syncStaff();return r;}
function setHome(id,f){const r=S.crew.find(x=>x.id===id),w=staff.find(x=>x.id===id);if(!r||r.role==='load')return;r.home=clamp(f,0,S.floors-1);if(w&&w.task&&!(w.work>0)){w.task=null;w.path=[];w.leg=null;}}
function staffPick(w){
  if(w.task)return;
  const home=w.rec?w.rec.home:0;
  const t=S.tasks.filter(t=>t.type===w.role&&(t.type==='load'||taskF(t)===home)&&!S.queue.includes(t)&&!engaged(t)&&(t.type!=='load'||truckById(t.truck)?.state==='dock'))
    .sort((a,b)=>(a.due??999)-(b.due??999))[0];
  if(t)assign(w,t);
}

// ---------------- workers ----------------
const PROPS=[{k:'soil',x:8,y:0},{k:'hose',x:0,y:0},{k:'potter',x:8,y:6}];
const boomT={};
const inLB=(lx,ly)=>LB.some(b=>ly===b.y&&lx>=b.x&&lx<b.x+3);
function walkableL(x,y,L){
  const h=houseAtXY(x,y,L);
  if(h>=0){const H=HOUSES[h],lx=x-H.ox,ly=y-H.oy;if(lx===8&&ly===3)return false;if(PROPS.some(p=>p.x===lx&&p.y===ly&&upLv(p.k)))return false;return!inLB(lx,ly);}
  if(L>0)return false;
  if(x===6&&y===-1&&upLv('fork'))return false;
  return x>=-1&&x<=20&&y>=-1&&y<=16;
}
const walkable=(x,y)=>walkableL(x,y,0);
function stepOK(x,y,nx,ny,L){
  const a=houseAtXY(x,y,L),b=houseAtXY(nx,ny,L);if(a===b)return true;
  if(a>=0&&b>=0)return false;
  const h=a>=0?a:b,H=HOUSES[h],ix=a>=0?x:nx,iy=a>=0?y:ny,ox=a>=0?nx:x,oy=a>=0?ny:y;
  return H.L===0&&ix-H.ox===4&&iy-H.oy===0&&ox-H.ox===4&&oy-H.oy===-1;
}
function route(fx,fy,tx,ty,L){
  L=L||0;const k=(x,y)=>x+','+y,prev={},q=[[fx,fy]];prev[k(fx,fy)]=null;
  while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty)break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(k(nx,ny) in prev||!walkableL(nx,ny,L)||!stepOK(x,y,nx,ny,L))continue;prev[k(nx,ny)]=[x,y];q.push([nx,ny]);}}
  if(!(k(tx,ty) in prev))return[];
  const out=[];let c=[tx,ty];while(c){out.unshift({x:c[0]+.5,y:c[1]+.5});c=prev[k(c[0],c[1])];}
  out.shift();return out;
}
function goPlan(w,tg){
  const fx=Math.floor(w.x),fy=Math.floor(w.y),L=w.f,cur=houseAtXY(fx,fy,L);
  if(L===tg.f&&(L===0||cur===tg.h)){w.leg=null;w.path=route(fx,fy,tg.x,tg.y,L);return;}
  let lh,to;
  if(L>0){lh=cur<0?L*4:cur;to=HOUSES[tg.h>=0?tg.h:0].s===HOUSES[lh].s?tg.f:0;}
  else{lh=HOUSES[tg.h].s;to=tg.f;}
  const lf=liftOf(lh);w.leg='lift';w.liftTo=to;w.ride=0;w.path=route(fx,fy,lf.x,lf.y,L);
}
function plan(w){goPlan(w,target(w.task));}
const homeSpot=w=>{const hh=w.rec&&w.role!=='load'?w.rec.home:0,H=HOUSES[hh];return{x:H.ox+(w.role==='load'?4:2),y:H.oy+(w.role==='load'?0:3),f:H.L,h:hh};};
function moveAlong(w,dt,slow){const n=w.path[0],dx=n.x-w.x,dy=n.y-w.y,d=Math.hypot(dx,dy),sp=4/slow*dt;if(d>.01)w.face=dx+dy>=0?'front':'back';if(d<=sp){w.x=n.x;w.y=n.y;w.path.shift();}else{w.x+=dx/d*sp;w.y+=dy/d*sp;}}
function assign(w,t){w.task=t;w.work=0;w.ride=0;plan(w);}
function stepWorker(w,dt,slow){
  if(w.task&&!S.tasks.includes(w.task)){w.task=null;w.work=0;w.path=[];w.leg=null;}
  if(!w.task){
    if(w===me){while(S.queue.length&&!S.tasks.includes(S.queue[0]))S.queue.shift();if(!S.queue.length)return;assign(w,S.queue[0]);}
    else{
      staffPick(w);
      if(!w.task){
        if(w.path.length){moveAlong(w,dt,slow);return;}
        if(w.leg==='lift'){w.ride+=dt;if(w.ride>=1.1){w.f=w.liftTo;w.ride=0;w.leg=null;}return;}
        const hs=homeSpot(w);
        if(w.f!==hs.f||houseAtXY(Math.floor(w.x),Math.floor(w.y),w.f)!==hs.h){goPlan(w,hs);if(w.leg!=='lift')w.leg='home';}
        return;
      }
    }
  }
  if(w.path.length){moveAlong(w,dt,slow);return;}
  if(w.leg==='lift'){w.ride+=dt;if(w.ride>=1.1){w.f=w.liftTo;w.ride=0;plan(w);}return;}
  if(w.task.type==='load'&&truckById(w.task.truck)?.state!=='dock')return;
  w.work+=dt;
  if(w.work>=workOf(w.task)*slow){const t=w.task;w.task=null;w.work=0;complete(t);}
}
function enqueue(t){
  const holder=staff.find(w=>w.task===t);
  if(holder){if(holder.work>0){toast('good',`${ROLES[holder.role].name} is already on it`);return;}holder.task=null;holder.path=[];}
  if(S.queue.includes(t)){S.queue=[t,...S.queue.filter(x=>x!==t)];if(me.task&&me.task!==t){me.task=null;me.path=[];me.work=0;}return;}
  if(t.type==='load'){const i=me.task&&S.queue[0]===me.task?1:0;let j=i;while(j<S.queue.length&&S.queue[j].type==='load')j++;S.queue.splice(j,0,t);return;}
  S.queue.push(t);
}

// ---------------- period flow ----------------
function startPeriod(){
  const c=S.period;S.phase='run';S.t=0;S.events=[];S.tasks=[];S.queue=[];S.trucks=[];
  S.broken=Array(12).fill(false);S.dmgT=Array(12).fill(0);me.task=null;me.path=[];
  syncStaff();staff.forEach(w=>{w.task=null;w.path=[];});
  S.offers=S.offers.filter(o=>o.popup&&startOf(o)>c);
  const cc=crewCost();S.cash-=upkeep()+cc;S.ys.overhead+=upkeep();S.ys.crew+=cc;
  S.plots.filter(pl=>pl.s===c&&!pl.done).forEach(pl=>addTask({type:'pot',plot:pl.id,bench:pl.rows[Math.floor((pl.rows.length-1)/2)],rows:pl.rows.slice(),born:0,due:PSEC*POT_BY}));
  S.plots.filter(pl=>pl.e===c&&!pl.done).forEach(pl=>{const at=PSEC*(.14+rnd()*.36);S.trucks.push({id:S.nid++,plot:pl.id,at,state:'coming'});S.events.push({at,k:'truck',plot:pl.id});});
  const thirst=[.5,.55,.75,.85,1,1,.75,.55][c];
  S.plots.filter(pl=>!pl.done&&pl.s<=c&&pl.e>=c).forEach(pl=>{if(rnd()<thirst)S.events.push({at:PSEC*(.12+rnd()*.7),k:'thirst',plot:pl.id});});
  const pest=[.3,.35,.5,.6,.7,.7,.5,.35][c];
  const bugF=[1,.6,.35][upLv('bugs')],brk=.35*((c>=4&&c<=5)?[1,.6,.35][upLv('vents')]:[1,.65,.4][upLv('heat')]);
  for(let f=0;f<S.floors;f++){
    if(rnd()<pest*bugF)S.events.push({at:PSEC*(.1+rnd()*.6),k:'pest',f});
    if(rnd()<pest*.45*bugF)S.events.push({at:PSEC*(.3+rnd()*.5),k:'pest',f});
    if(rnd()<brk)S.events.push({at:PSEC*(.08+rnd()*.6),k:'break',f});
  }
  if(c>=2&&c<=5&&rnd()<.6)S.events.push({at:PSEC*(.15+rnd()*.3),k:'popup'});
  S.events.sort((a,b)=>a.at-b.at);
  closeSheet();hud();
}
function fire(e){
  const c=S.period;
  if(e.k==='truck'){
    const k=S.trucks.find(k=>k.plot===e.plot);if(!k)return;
    k.state='line';k.arrived=S.t;k.deadline=S.t+TRUCK_WAIT;k.x=-14;
    const waiting=S.trucks.filter(k=>k.state==='line'||k.state==='dock').length;
    toast('load',waiting>1?`Truck arrived, ${waiting} in line`:'Truck at the dock');
    dockNext();
  }
  if(e.k==='thirst'){const pl=S.plots.find(p=>p.id===e.plot);if(pl&&!pl.done&&pl.potted.some(Boolean)&&rnd()<[0,.35,.6][upLv('boom')]){boomT[plotF(pl)]=performance.now();float(BENCH[pl.rows[0]],'Boom watered','#2a78d0');return;}if(pl&&!pl.done&&pl.potted.some(Boolean)&&!S.tasks.some(t=>t.type==='water'&&t.plot===pl.id))addTask({type:'water',plot:pl.id,bench:pl.rows[Math.floor((pl.rows.length-1)/2)],rows:pl.rows.slice(),due:S.t+18*(1+.25*upLv('hose'))});}
  if(e.k==='pest'){
    const opts=[];S.plots.filter(pl=>!pl.done&&pl.s<=c&&plotF(pl)===e.f).forEach(pl=>pl.rows.forEach((r,k)=>{if(pl.potted[k]&&!S.tasks.some(t=>t.type==='pest'&&t.bench===r))opts.push([pl,r]);}));
    if(opts.length){const [pl,r]=pick(opts);addTask({type:'pest',bench:r,plot:pl.id,due:S.t+24});toast('pest',`Pests on bench ${benchName(r)}`);}
  }
  if(e.k==='break'&&!S.broken[e.f]){S.broken[e.f]=true;S.dmgT[e.f]=0;addTask({type:'fix',f:e.f,due:S.t+20});toast('fix',`${unitName(c)} down${S.floors>1?' in house '+(e.f+1):''}`);}
  if(e.k==='popup')genPopup();
}
function hurt(pl,r,frac,min){const k=pl.rows.indexOf(r);if(k<0||!pl.potted[k])return 0;const n=Math.min(pl.alive[k],Math.max(min||0,Math.round(pl.alive[k]*frac)));pl.alive[k]-=n;return n;}
function tick(dt){
  // engaged jobs stop counting down
  for(const w of [me,...staff])if(w.task&&w.task.due!=null){w.task.due+=dt;w.task.born+=dt;if(w.task.type==='load'){const k=truckById(w.task.truck);if(k)k.deadline=w.task.due;}}
  S.t+=dt;
  while(S.events.length&&S.events[0].at<=S.t)fire(S.events.shift());
  for(const k of S.trucks)if((k.state==='line'||k.state==='dock')&&S.t>=k.deadline&&!(ask&&ask.truckId===k.id))truckLeaves(k,true);
  for(const t of S.tasks.slice()){
    if(t.type==='water'&&S.t>=t.due){const pl=S.plots.find(p=>p.id===t.plot);if(pl){let n=0;pl.rows.forEach(r=>n+=hurt(pl,r,.25*(1-.2*upLv('soil')),1));if(n)pl.hurt=1;if(n)float(BENCH[t.bench],`${n} wilted`,'#c8402f');}dropTask(t);}
    if(t.type==='pest'&&S.t>=t.due){
      const pl=S.plots.find(p=>p.id===t.plot);if(pl){const n=hurt(pl,t.bench,.25*(1-.2*upLv('soil')),1);if(n)pl.hurt=1;if(n)float(BENCH[t.bench],`${n} lost to pests`,'#c8402f');}
      t.born=S.t;t.due=S.t+24;
      const f=BENCH[t.bench].f;
      const nb=S.plots.filter(p=>!p.done&&plotF(p)===f).flatMap(p=>p.rows.filter((r,k)=>p.potted[k]&&Math.abs(r-t.bench)<=2&&r!==t.bench&&!S.tasks.some(x=>x.type==='pest'&&x.bench===r)).map(r=>[p,r]));
      if(nb.length&&rnd()<[1,.6,.35][upLv('bugs')]){const [p2,r2]=pick(nb);addTask({type:'pest',bench:r2,plot:p2.id,due:S.t+24});toast('pest',`Pests spread to ${benchName(r2)}`);}
    }
  }
  for(let f=0;f<S.floors;f++)if(S.broken[f]){S.dmgT[f]+=dt;if(S.dmgT[f]>=6){S.dmgT[f]-=6;S.plots.filter(p=>!p.done&&p.s<=S.period&&plotF(p)===f&&prog(p)<1).forEach(p=>p.rows.forEach(r=>{if(rnd()<.6&&hurt(p,r,0,1)){p.hurt=1;float(BENCH[r],'−1','#c8402f');}}));}}
  if(S.t>=PSEC)endPeriod();
}
function simStep(dt){
  for(const w of staff)stepWorker(w,dt,slowOf(w.rec));
  stepWorker(me,dt,1);
  tick(dt);
}
function settleBooks(){
  let bill=0,int=0,od=0;
  if(S.credit>0){int=Math.round(S.credit*CREDIT_RATE);bill=S.credit;S.cash-=bill+int;S.ys.interest+=int;S.credit=0;}
  if(S.cash<0){od=Math.round(-S.cash*OVERDRAFT_RATE);S.cash-=od;S.ys.interest+=od;}
  const a=S.snap||S.ys,y=S.ys;
  S.stmt={sales:y.rev-a.rev,plugs:y.plugs-a.plugs,upkeep:y.overhead-a.overhead,crew:y.crew-a.crew,buyin:y.buy-a.buy,build:(y.build||0)-(a.build||0)-bill,credit:bill,interest:int,overdraft:od,cash:S.cash,start:a.cash??S.cash};
  if(bill)toast('cash',`Credit bill paid: ${fmt(bill)} plus ${fmt(int)} interest`);
}
function endPeriod(){
  if(ask)resolveAsk(0);

function growPlot(pl,d){

const potM=()=>1+.1*upLv('pots');

const booked=()=>Math.round(S.orders.filter(o=>o.status!=='failed').reduce((a,o)=>a+(o.status==='shipped'?(o.sent||0):o.qty)*o.price,0)*potM());
function evalPv(top){
  const pp=sel;if(!pp)return{ok:false,reason:''};

  const gone=new Set(hit),ctr=new Set(),rep=[];

  return`<div class="blk st-${o.st}${o.cls}${o.w<62?' tiny':''}"${o.id?` data-pl="${o.id}"`:''} style="background-color:${o.color};left:${o.left}px;top:${o.top}px;width:${o.w}px;height:${o.h}px">${o.fut?`<i class="fut" style="width:${o.fut}%"></i>`:''}<i class="sq"></i><span class="bx"><span class="b1">${l1}</span>${o.h>=30?`<span class="b2">${l2}</span>`:''}</span>${o.rm?`<button class="rm" type="button" data-rm="${o.id}" aria-label="Remove">×</button>`:''}</div>`;
}
function renderBoard(){
  const B=$('board');if(!B)return;const m=boardMetrics(),c=S.period,ms=minStart(),base=boardF*8;
  B.style.height=m.H+'px';B.style.width=(m.lab+8*m.cw)+'px';B.style.setProperty('--cw',m.cw+'px');B.style.setProperty('--rh',m.rh+'px');
  const live=drag&&drag.on?drag.pp:sel,nowX=m.lab+(c+(S.phase==='run'?S.t/PSEC:0))*m.cw,hand=placing&&sel&&!(drag&&drag.on),ev=hand&&pv?evalPv(pv.top):null;
  let h='';
  const fx=placing&&flexible(placing.cur)?placing.cur:null,fc=fx?crop(fx.crop).color:'',fv=fx?PSH.map((_,i)=>i>=dMin(fx)&&i<=fx.p?valAt(fx,i):0):[],fmax=Math.max(1,...fv);
  for(let i=0;i<8;i++){const due=fx&&i===fx.p,pk=fx&&seasF(fx.crop,i)>1.1;
    h+=`<div class="ch${i===c?' now':''}${i<c?' gone':''}${due?' due':''}" style="left:${m.lab+i*m.cw}px;top:0;width:${m.cw}px;height:28px">${i===c?'<b>Now</b>':due?'<span>Due</span>':PSH[i]}${pk?`<i class="pk" style="background:${fc}"></i>`:''}</div>`;
    if(fx&&fv[i])h+=`<div class="vs" style="left:${m.lab+i*m.cw+2}px;top:29px;width:${m.cw-4}px;height:19px;background:rgba(46,125,74,${(.1+.55*fv[i]/fmax).toFixed(2)})">${kfmt(fv[i])}</div>`;}
  for(let r=0;r<8;r++){const g=base+r;h+=`<div class="rh" style="left:0;top:${m.hh+r*m.rh}px;width:${m.lab}px;height:${m.rh}px">${LETTERS[g]}</div>`;
    for(let i=0;i<8;i++){
      let cls=i<c?' past':i===c?' cur':'';if(fx&&i>fx.p)cls+=' late';
      if(hand){if(i>=sel.s&&i<=sel.e&&i>=ms){const o=plotAt(g,i);cls+=!o?' ok':movable(o)&&!(placing.cid&&orderOf(o).contract===placing.cid)?' sw':' no';}}
      else if(live&&i>=live.s&&i<=live.e&&i>=ms){const o=plotAt(g,i);cls+=o&&o!==live.plot?' no':' ok';}
      h+=`<div class="cell${cls}" style="left:${m.lab+i*m.cw+1.5}px;top:${m.hh+r*m.rh+1.5}px;width:${m.cw-3}px;height:${m.rh-3}px"></div>`;}}
  for(const pl of S.plots){
    if(plotF(pl)!==boardF)continue;
    const C=crop(pl.crop),top=Math.min(...pl.rows)-base,h2=pl.rows.length,o=orderOf(pl),w=(pl.e-pl.s+1)*m.cw;
    const potted=pl.potted.some(Boolean),st=pl.fail?'fail':pl.done?'done':!potted?'plan':prog(pl)>=1?'ready':'grow';
    const mv=movable(pl),isSel=sel&&sel.plot===pl,lifted=drag&&drag.on&&drag.pp.plot===pl;
    const left=m.lab+pl.s*m.cw+2,bw=w-4,hv=potted?have(pl):pl.flats.reduce((a,b)=>a+b,0);
    const fut=(st==='grow'||st==='ready')?Math.round(clamp((left+bw-nowX)/bw,0,1)*100):0;
    const ct=o.contract?contractOf(o.contract):null,ctag=ct?`${o.k+1}/${ct.n} `:'';
    const val=ctag+(st==='done'?fmt(Math.round((o.sent||0)*o.price*(1+.1*upLv('pots')))):fmt(Math.round(o.qty*o.price*(1+.1*upLv('pots')))));
    h+=blkHTML({cls:`${mv?' mv':''}${isSel?' picked':''}${lifted?' lift':''}${ev&&ev.ok&&ev.gone.includes(pl)?' bump':''}`,color:C.color,left,top:m.hh+top*m.rh+2,w:bw,h:h2*m.rh-4,st,name:C.name,count:`${hv}/${o.qty}`,short:hv<o.qty&&!pl.done,val,fut,rm:mv,id:pl.id});
  }
  h+=`<div class="nowline" style="left:${nowX-1.5}px;top:${m.hh-6}px;height:${m.rh*8+6}px"></div>`;
  if(hand){
    if(placing.of.contract)for(let k=placing.k+1;k<placing.of.n;k++){const d=delivery(placing.of,k,placing.cid),pp=piece(d),r=firstFit(d);if(r<0||Math.floor(r/8)!==boardF)continue;h+=blkHTML({cls:' later',color:crop(d.crop).color,left:m.lab+pp.s*m.cw+2,top:m.hh+(r-base)*m.rh+2,w:(pp.e-pp.s+1)*m.cw-4,h:pp.h*m.rh-4,st:'ghost',name:'',count:`#${k+1}`,val:crop(d.crop).name,ghost:true});}
    if(pv&&Math.floor(pv.top/8)===boardF){
      h+=blkHTML({cls:' ghost'+(ev.ok?'':' bad'),color:crop(sel.crop).color,left:m.lab+sel.s*m.cw+2,top:m.hh+(pv.top-base)*m.rh+2,w:(sel.e-sel.s+1)*m.cw-4,h:sel.h*m.rh-4,st:'ghost',name:'',count:ev.ok?span(pv.top,sel.h):'Blocked',val:ev.ok?'+'+fmt(ev.gain):'',ghost:true});
    }
  }
  else if(live&&ghostRow>=0){
    const t=nearestFit(live,ghostRow),top=(t>=0?t:topFor(live,ghostRow))-base,C=crop(live.crop),w=(live.e-live.s+1)*m.cw;
    const of=live.offer,qty=of?of.qty:orderOf(live.plot).qty,price=of?of.price:orderOf(live.plot).price;
    h+=blkHTML({cls:' ghost'+(t>=0?'':' bad'),color:C.color,left:m.lab+live.s*m.cw+2,top:m.hh+top*m.rh+2,w:w-4,h:live.h*m.rh-4,st:'ghost',name:'',count:t>=0?span(t,live.h):'No room',val:fmt(Math.round(qty*price*(1+.1*upLv('pots')))),ghost:true});
  }
  B.innerHTML=h;
  B.querySelectorAll('.blk.mv').forEach(b=>b.addEventListener('pointerdown',pieceDown));
  B.querySelectorAll('[data-rm]').forEach(b=>b.onclick=e=>{e.stopPropagation();const pl=S.plots.find(p=>p.id==b.dataset.rm);if(pl)removePlot(pl);});
  B.querySelectorAll('[data-nud]').forEach(b=>b.onclick=e=>{e.stopPropagation();const pl=S.plots.find(p=>p.id==b.dataset.nud);if(pl)nudge(pl,+b.dataset.d);});
}
function rowAt(clientY){const B=$('board');if(!B)return -1;const r=B.getBoundingClientRect(),m=boardMetrics(),y=clientY-r.top-m.hh;return y<0||y>m.rh*8?-1:boardF*8+Math.floor(y/m.rh);}
function overBoard(x,y){const B=$('board');if(!B)return false;const r=B.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
function pieceDown(e){
  if(placing)return;
  if(e.target.closest('[data-dx],[data-rm]'))return;
  const el=e.currentTarget;let pp=null;
  if(e.target.closest('[data-gen]'))return;
  if(el.dataset.of){const of=S.offers.find(o=>o.id==el.dataset.of);if(of&&offerOwned(of))pp=piece(of);else if(of){toast('bad',`You don't grow ${crop(of.crop).name.toLowerCase()} yet. Unlock its genetics first`);return;}}
  else{const pl=S.plots.find(p=>p.id==el.dataset.pl);if(pl&&movable(pl))pp=piece(pl);}
  if(!pp)return;
  e.stopPropagation();
  drag={pp,x:e.clientX,y:e.clientY,on:false,id:e.pointerId,el:null,blk:!el.dataset.of};
}
addEventListener('pointermove',e=>{
  if(drag&&e.pointerId===drag.id){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.on&&Math.hypot(dx,dy)>8){
      drag.on=true;sel=drag.pp;const C=crop(drag.pp.crop),m=boardMetrics(),el=document.createElement('div');
      el.className='drag';el.style.background=C.color;el.style.width=((drag.pp.e-drag.pp.s+1)*m.cw-4)+'px';el.style.height=(drag.pp.h*m.rh-4)+'px';document.body.appendChild(el);drag.el=el;renderSheet();
    }
    if(drag.on){
      drag.el.style.left=(e.clientX-drag.el.offsetWidth/2)+'px';drag.el.style.top=(e.clientY-drag.el.offsetHeight/2)+'px';
      const r=overBoard(e.clientX,e.clientY)?rowAt(e.clientY):-1;drag.el.style.opacity=r>=0?.25:.9;
      if(r!==ghostRow){ghostRow=r;renderBoard();}
    }
    return;
  }
  if(placing){if(e.pointerType==='mouse')livePv(e);else if(slide&&e.pointerId===slide.id){if(!slide.moved&&Math.hypot(e.clientX-slide.x,e.clientY-slide.y)>8)slide.moved=true;if(slide.moved)livePv(e);}return;}
  if(sel&&!placing&&e.pointerType==='mouse'&&sheetOpen()&&tab==='orders'){const r=overBoard(e.clientX,e.clientY)?rowAt(e.clientY):-1;if(r!==ghostRow){ghostRow=r;renderBoard();}}
});
addEventListener('pointerdown',e=>{if(placing&&e.pointerType!=='mouse'&&overBoard(e.clientX,e.clientY)&&!e.target.closest('button'))slide={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};});
addEventListener('pointerup',e=>{
  if(slide&&e.pointerId===slide.id){const sl=slide;slide=null;if(sl.moved){suppressClick=true;setTimeout(()=>suppressClick=false,60);}}
  if(!drag||e.pointerId!==drag.id)return;
  const d=drag;drag=null;if(d.el)d.el.remove();
  const quiet=()=>{suppressClick=true;setTimeout(()=>suppressClick=false,60);};
  if(d.on){const r=overBoard(e.clientX,e.clientY)?rowAt(e.clientY):-1;if(r>=0)dropPiece(d.pp,r);else{ghostRow=-1;sel=null;renderSheet();}quiet();return;}
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<10){
    if(placing){quiet();boardTap(rowAt(e.clientY));return;}
    sel=samePiece(sel,d.pp)?null:d.pp;
    if(sel&&sel.offer){let f=firstFitOn(sel,boardF);if(f<0){for(let ff=0;ff<S.floors&&f<0;ff++){f=firstFitOn(sel,ff);if(f>=0){boardF=ff;viewF=lvOf(ff);renderFloors();}}}ghostRow=f<0?-1:f+Math.floor(sel.h/2);}else ghostRow=-1;
    renderSheet();quiet();
  }
});
addEventListener('pointercancel',()=>{if(drag&&drag.el)drag.el.remove();drag=null;renderBoard();});
$('sheet').addEventListener('click',e=>{
  if(suppressClick){suppressClick=false;return;}
  if(!sel||tab!=='orders')return;const B=$('board');if(!B||!B.contains(e.target))return;
  if(placing){if(e.target.closest('[data-rm]'))return;boardTap(rowAt(e.clientY),colAt(e.clientX));return;}
  if(e.target.closest('.blk.mv,[data-nud],[data-rm]'))return;
  const r=rowAt(e.clientY);if(r>=0)dropPiece(sel,r);
});

// ---------------- canvas input ----------------
let down=null;
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
cv.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>12){down=null;return;}down=null;
  if(sheetOpen()&&S.phase==='run'){closeSheet();return;}
  let best=null,bd=1e9;for(const h of iconHits){const d=Math.hypot(e.clientX-h.x,e.clientY-h.y);if(d<=h.r&&d<bd){bd=d;best=h;}}
  if(best){best.tasks.forEach(enqueue);return;}
  {const ct=CATS.filter(c=>c.f===viewF).map(c=>({c,d:Math.hypot(e.clientX-P(c.x,c.y,ZB()+14)[0],e.clientY-P(c.x,c.y,ZB()+14)[1])})).filter(o=>o.d<TW*.42*sc).sort((a,b)=>a.d-b.d)[0];if(ct){petCat(ct.c);return;}}
  if(S.phase==='run'){
    const near=(p,rx,ry)=>Math.abs(e.clientX-p[0])<rx&&Math.abs(e.clientY-p[1])<ry;
    // heater or fans on this floor
    const uh=HOUSES.slice(0,S.floors).find(H=>H.L===viewF&&near(P(unitOf(H.h).x+.5,unitOf(H.h).y+.5,24+ZB()),TW*.45*sc,TH*1.1*sc));
    if(uh){const t=S.tasks.find(t=>t.type==='fix'&&t.f===uh.h);if(t)enqueue(t);else toast('good',`${unitName(S.period)} is running fine`);return;}
    // any truck on the road, or the dock pad
    const tr=S.trucks.filter(k=>(k.state==='line'||k.state==='dock')&&k.x!=null);
    if(tr.some(k=>near(P(k.x+1.55,-2.1,20),TW*1.4*sc,TH*1.3*sc))||near(P(4.5,-.75,4),TW*.9*sc,TH*.6*sc)){const t=S.tasks.find(t=>t.type==='load');if(t)enqueue(t);else if(tr.length)toast('load','The truck is pulling in');return;}
  }
  for(const b of BENCH.slice(0,S.floors*8).filter(b=>b.lv===viewF)){const a=P(b.x,b.y,22+ZB()),c=P(b.x+3,b.y+1,22+ZB()),m=[(a[0]+c[0])/2,(a[1]+c[1])/2];if(Math.abs(e.clientX-m[0])<1.6*TW/2*sc&&Math.abs(e.clientY-m[1])<TH*.6*sc){const ts=S.phase==='run'?S.tasks.filter(t=>t.type!=='load'&&t.type!=='fix'&&(t.bench===b.i||(t.rows&&t.rows.includes(b.i)))):[];if(ts.length)ts.forEach(enqueue);else benchInfo(b);return;}}
});
function benchInfo(b){
  const pl=liveAt(b.i,S.period)||S.plots.find(p=>!p.done&&p.rows.includes(b.i)&&p.s>S.period);
  if(!pl){toast('good',`Bench ${b.L} is free`);return;}
  const k=pl.rows.indexOf(b.i),C=crop(pl.crop);
  if(pl.s>S.period){toast('pot',`${b.L}: ${C.name} pots in ${PN[pl.s].toLowerCase()}`);return;}
  toast(prog(pl)>=1?'load':'water',`${b.L}: ${C.name}, ${pl.alive[k]} of ${pl.flats[k]} alive, ${prog(pl)>=1?'ready':'ships '+PN[pl.e].toLowerCase()}`);
}
$('bBoard').onclick=()=>sheetOpen()?closeSheet():openSheet();
$('hRepB').onclick=()=>openSheet('cust');
$('bGo').onclick=()=>startPeriod();
let speed=1;
$('speed').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;speed=+b.dataset.s;$('speed').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});

// ---------------- modal, save ----------------
function modal(html){$('mbox').innerHTML=html;$('modal').hidden=false;}
function closeModal(){$('modal').hidden=true;}
function save(){try{localStorage.setItem('gy8',JSON.stringify(S));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('gy8')||'null');if(d&&d.v===3&&d.plots){d.up=d.up||{pots:0,soil:0,hose:0};d.contracts=d.contracts||[];d.credit=d.credit||0;d.negRun=d.negRun||0;d.broken=Array.from({length:12},(_,i)=>!!(d.broken&&d.broken[i]));d.dmgT=Array.from({length:12},(_,i)=>(d.dmgT&&d.dmgT[i])||0);if(!d.cust)d.cust=Object.fromEntries(CUST.map(n=>[n,{r:clamp(d.rep??50,0,100)}]));d.rep=CUST.reduce((a,n)=>a+d.cust[n].r,0)/CUST.length;d.owned=d.owned||['petunia','vinca','geranium','begonia','pothos','mum','poinsettia'];if(!Array.isArray(d.crew)){const old=d.crew||{};d.crew=[];let i=0;for(const k in old)for(let j=0;j<old[k];j++)d.crew.push({id:'s'+(d.nid++),name:NAMES[i++%NAMES.length],role:k,home:0,n:VET,wage:ROLES[k].cost});}return d;}}catch(e){}return null;}
function welcome(){
  modal(`<h2>Greenhouse Year</h2><p>One greenhouse, eight benches to start, eight periods a year.</p>
  <div class="steps">
  <div>${svgIcon('pop',40)}<span><b>Plan:</b> between periods, offers come up one at a time. Place each on the board or bin it. Bigger orders take more benches, slower crops take more periods.</span></div>
  <div>${svgIcon('pot',40)}<span><b>Work:</b> tap the big icons to queue jobs. A job's countdown stops once someone's on it.</span></div>
  <div>${svgIcon('load',40)}<span><b>Ship:</b> each order gets its own truck. They line up at one dock and only wait so long.</span></div>
  <div>${svgIcon('floor',40)}<span><b>Grow:</b> you start with three varieties. Buy genetics for more, hire crew and build up to three floors.</span></div></div>
  <button class="btn go" id="wGo" type="button">Plan early winter</button>`);
  $('wGo').onclick=()=>{S.welcomed=true;closeModal();openSheet();};
}

// ---------------- loop ----------------
let lastT=performance.now(),uiT=0;
function frame(now){
  const dt=Math.min(.1,(now-lastT)/1000);lastT=now;
  const paused=sheetOpen()||!$('modal').hidden;
  if(S.phase==='run'&&!paused){
    simStep(dt*speed*3);
    if((uiT+=dt)>.15){uiT=0;hud();}
  }
  if(S.phase==='run'&&sheetOpen())renderSheetLite();
  stepCats(dt);renderTray();draw(now);
  requestAnimationFrame(frame);
}
let lite='';
function renderSheetLite(){const sig=S.offers.map(o=>o.id).join(',');if(sig!==lite){lite=sig;if(tab==='orders')renderSheet();}}
addEventListener('resize',()=>{layout();if(sheetOpen()&&tab==='orders')renderBoard();});
function boot(){
  S=load();
  if(!S){fresh();genOffers();}
  else if(S.phase==='run'){S.phase='plan';S.t=0;S.trucks=[];}
  prepArt();syncStaff();layout();hud();
  if(S.phase==='done')yearEnd();
  else if(!S.welcomed)welcome();
  else openSheet();
  requestAnimationFrame(frame);
  setTimeout(layout,300);
}
boot();
