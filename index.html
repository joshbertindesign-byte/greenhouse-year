<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Greenhouse Year</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16231b;--mute:#5d6b62;--paper:#fbfaf5;--line:#e4e0d3;--hud:#173426;--sun:#f2c230;--go:#2e7d4a;--bad:#c8402f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#79a95b;font-family:Outfit,system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;background:var(--hud);color:#fff}
.when{min-width:0}
.when b{display:block;font-size:20px;font-weight:600;line-height:1.1;white-space:nowrap}
.yr{display:flex;gap:3px;margin-top:6px}
.yr i{display:block;width:22px;height:7px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.yr i b{display:block;height:100%;background:var(--sun)}
.stat{background:rgba(255,255,255,.09);border-radius:10px;padding:4px 10px;line-height:1.15}
.stat small{display:block;font-size:12px;opacity:.75}
.stat b{font-size:18px;font-weight:600}
.stat b.neg{color:#ffb4a6}
.sp{flex:1}
.hb{border:0;border-radius:12px;padding:10px 16px;font-size:16px;font-weight:600;background:rgba(255,255,255,.14);color:#fff;display:inline-flex;align-items:center;gap:6px}
.hb.go{background:var(--sun);color:#2b2104}
.hb .n{background:#e2552f;color:#fff;border-radius:99px;font-size:13px;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 6px}
.hb .n:empty{display:none}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:#fff;padding:7px 12px;border-radius:9px;font-weight:600}
.seg button.on{background:rgba(255,255,255,.22)}
@media (max-width:600px){.hud{gap:6px 8px;padding:8px 10px}.when{flex:1 1 100%;display:flex;align-items:center;justify-content:space-between}.when b{font-size:18px}.yr{margin:0}.yr i{width:16px}.stat b{font-size:16px}.hb{padding:9px 13px;font-size:15px}}

.toasts{position:fixed;left:50%;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(94vw,460px)}
.toast{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 14px 8px 8px;font-size:17px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:tin .25s ease-out}
.toast.tap{pointer-events:auto;cursor:pointer;border:3px solid var(--sun)}
.toast .go{margin-left:auto;padding-left:10px;color:#8a6400;font-size:15px;white-space:nowrap}
.paused{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:#2b2104;border-radius:10px;padding:4px 10px;font-size:14px;font-weight:700}
.uprow{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:10px}
.uprow .rn{flex:1;min-width:0}.uprow .rn b{display:block;font-size:17px}.uprow .rn span{font-size:14px;color:var(--mute)}
.pips3{display:flex;gap:4px;margin-top:4px}.pips3 i{width:22px;height:8px;border-radius:4px;background:#e4e0d3}.pips3 i.on{background:var(--go)}
.uprow .btn{padding:10px 14px;font-size:15px;white-space:nowrap}
.toasts.low{left:8px;transform:none;width:calc(100vw - 96px);align-items:flex-start}
.toasts.low .toast{font-size:15px;padding:6px 12px 6px 6px}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.ic{display:inline-grid;place-items:center;border-radius:50%;flex:none}
.ic svg{display:block}

.tray{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(251,250,245,.96);border-top:3px solid #dcd6c3;padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
.lane{display:flex;align-items:center;gap:10px;min-height:74px}
.lane .who{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.04em}
.cards{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px 2px 4px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;width:78px;height:74px;border-radius:14px;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-top:2px}
.card.now{border-color:var(--go)}
.card.warn{border-color:#e7a321}
.card.hot{border-color:var(--bad)}
.card .lb{font-size:14px;font-weight:600;line-height:1}
.card .bar{position:absolute;left:8px;right:8px;bottom:5px;height:5px;border-radius:3px;background:#e9e5d8;overflow:hidden}
.card .bar i{display:block;height:100%;width:0;background:var(--go)}
.card .x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:#5d6b62;color:#fff;font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
.lane.h .card{width:66px;height:62px}
.empty{color:var(--mute);font-size:15px;padding:0 6px}

.sheet{position:fixed;z-index:8;left:50%;transform:translateX(-50%);bottom:0;width:min(100vw,820px);max-height:92vh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);padding:14px 14px calc(14px + env(safe-area-inset-bottom));animation:up .28s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
@media (min-width:860px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:22px;animation:none}}
.bhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.bhead h2{margin:0;font-size:22px;font-weight:700;flex:1;min-width:180px}
.bhead h2 small{display:block;font-size:14px;font-weight:400;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--mute)}
.pill .s2{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.pill .s2 button{border:0;background:#fff;padding:6px 10px;font-weight:600;font-size:14px}
.pill .s2 button.on{background:var(--hud);color:#fff}
.xbtn{border:2px solid var(--line);background:#fff;border-radius:12px;width:40px;height:40px;font-size:20px;line-height:1}
.rail{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;touch-action:pan-x;scrollbar-width:thin}
.tk{position:relative;flex:none;width:128px;border-radius:16px;background:#fff;border:3px solid var(--line);padding:8px 10px 10px;touch-action:pan-x;cursor:grab}
.tk.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--sun)}
.tk .crop{display:inline-block;color:#fff;font-weight:700;font-size:14px;border-radius:8px;padding:2px 8px}
.tk .q{font-size:30px;font-weight:700;line-height:1;margin:6px 0 2px}
.tk .q small{font-size:14px;font-weight:500;color:var(--mute)}
.tk .row2{display:flex;align-items:center;justify-content:space-between;gap:6px}
.tk .due{font-size:14px;font-weight:600}
.tk .val{font-size:14px;color:var(--mute)}
.tk .shape{display:grid;gap:2px}
.tk .shape i{display:block;width:10px;height:10px;border-radius:2px}
.tk .tag{position:absolute;top:-10px;left:10px;background:var(--sun);color:#2b2104;font-size:12px;font-weight:700;border-radius:8px;padding:1px 7px}
.tk .dx{position:absolute;top:-10px;right:-10px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:#8a958d;color:#fff;font-size:15px;line-height:1;padding:0;display:grid;place-items:center}
.norail{color:var(--mute);font-size:15px;padding:10px 4px 14px}
.board{position:relative;touch-action:none;margin-top:2px}
.board .cell{position:absolute;border-right:1px solid #e7e3d6;border-bottom:1px solid #e7e3d6;background:#fff}
.board .cell.past{background:repeating-linear-gradient(135deg,#f1eee5 0 6px,#e8e4d8 6px 12px)}
.board .cell.now{background:#fff8dc}
.board .band{position:absolute;background:rgba(242,194,48,.16);border-left:2px dashed #d8a91c;border-right:2px dashed #d8a91c;pointer-events:none}
.board .ch,.board .rh{position:absolute;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--mute)}
.board .ch.now{color:var(--ink)}
.board .rh{font-size:16px;color:var(--ink)}
.blk{position:absolute;border-radius:9px;color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:2px;border:2px solid rgba(0,0,0,.18);overflow:hidden;white-space:nowrap;pointer-events:none}
.blk.done{opacity:.35}
.blk.mv{pointer-events:auto;cursor:grab;touch-action:none}
.blk.picked{box-shadow:0 0 0 3px var(--sun);z-index:2;overflow:visible}
.blk.lift{opacity:.25}
.blk .bi{display:grid;place-items:center;opacity:.9}
.blk .bt{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis}
.blk{padding:0 4px;justify-content:space-between}
.blk .rm{position:absolute;top:-11px;right:-11px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:#16231b;color:#fff;font-size:16px;line-height:1;padding:0;display:grid;place-items:center;pointer-events:auto}
.board .cell.ok{background:#dff3e2}
.blk .short{background:#fff;color:var(--bad);border-radius:6px;padding:0 5px}
.grow{display:inline-flex;gap:6px;margin-top:6px}.grow .btn{padding:8px 12px;font-size:15px}
.board .cell.no{background:#f8dcd6}
.board .ch b{background:var(--hud);color:#fff;border-radius:7px;padding:1px 8px;font-size:12px}
.blk.fail{background:repeating-linear-gradient(135deg,#9d958a 0 6px,#8b8378 6px 12px)!important}
.blk.ghost{border:3px dashed #fff;opacity:.85;box-shadow:0 0 0 3px var(--go)}
.blk.ghost.bad{box-shadow:0 0 0 3px var(--bad);opacity:.55}
.bfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.bfoot .hint{flex:1;min-width:200px;font-size:14px;color:var(--mute)}
.btn{border:0;border-radius:14px;padding:13px 20px;font-size:17px;font-weight:700;background:#ece8dc}
.btn.go{background:var(--go);color:#fff}
.btn.sun{background:var(--sun);color:#2b2104}
.drag{position:fixed;z-index:9;pointer-events:none;border-radius:10px;opacity:.9;border:3px solid #fff;box-shadow:0 6px 18px rgba(0,0,0,.25)}

.modal{position:fixed;inset:0;z-index:10;background:rgba(10,25,16,.45);display:grid;place-items:center;padding:16px}
.mbox{background:var(--paper);border-radius:22px;max-width:520px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.mbox h2{margin:0 0 8px;font-size:24px}
.mbox p{font-size:16px;line-height:1.5;margin:0 0 12px;color:#33433a}
.steps{display:grid;gap:10px;margin:14px 0 18px}
.steps div{display:flex;gap:12px;align-items:center;font-size:16px;line-height:1.35}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:17px;margin:12px 0 18px}
.kv b{text-align:right}
.ask{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));width:min(94vw,460px);background:#fff;border-radius:18px;border:3px solid var(--sun);box-shadow:0 8px 24px rgba(0,0,0,.25);padding:12px 14px 16px;animation:tin .2s ease-out;overflow:hidden}
.ask .aq{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ask .aq b{display:block;font-size:18px}.ask .aq span{font-size:14px;color:var(--mute)}
.ask .ab{display:flex;gap:8px}.ask .ab .btn{flex:1;padding:12px 10px;font-size:16px}
.ask .at{position:absolute;left:0;right:0;bottom:0;height:5px;background:#eee}.ask .at i{display:block;height:100%;background:var(--sun)}
.cnt{font-weight:700}
.board .cell.past{background:#e4e0d4}
.board .cell.cur{background:#fff6d2}
.board .ch.gone{color:#aaa497}
.blk.tiny .b1{font-size:12px}.blk.tiny .b2{font-size:11px}.blk.tiny{padding:0 1px}
.blk.tiny .rm{width:18px;height:18px;font-size:12px;top:1px;right:1px}
.tk.locked{background:#f3f1ea;border-style:dashed;cursor:default}
.tk.locked .crop,.tk.locked .q,.tk.locked .due,.tk.locked .shape{opacity:.55}
.tk .unl{display:block;width:100%;margin-top:6px;border:0;border-radius:10px;background:var(--sun);color:#2b2104;font-weight:700;font-size:13px;padding:7px 4px}
.gens{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:10px}
.gen{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.gen .crop{display:inline-block;color:#fff;font-weight:700;font-size:14px;border-radius:8px;padding:2px 8px;flex:none}
.gen .gi{flex:1;font-size:13px;color:var(--mute);line-height:1.3}
.gen .btn{padding:8px 10px;font-size:14px}
.gen .ok{color:var(--go);font-size:14px}
.gen.own{background:#f4fbf5}
.fsel{display:flex;gap:4px;margin-top:6px}.fsel button{border:2px solid var(--line);background:#fff;border-radius:9px;padding:3px 9px;font-weight:600;font-size:13px}.fsel button.on{background:var(--hud);border-color:var(--hud);color:#fff}
.hires{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.hire{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.hire:disabled{opacity:.5}.hire b{display:block;font-size:15px}.hire small{font-size:13px;color:var(--mute)}
.rqb{display:flex;gap:6px}.rqb .btn{padding:9px 12px;font-size:15px}
.chip .fb{display:inline-block;background:var(--hud);color:#fff;border-radius:6px;font-size:11px;padding:0 5px;margin-left:2px;vertical-align:1px}
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:10px 8px;overflow:visible;padding:8px 2px 10px;touch-action:auto}
.tk{width:auto;padding:6px 8px 8px;border-radius:14px;touch-action:none}
.tk .crop{font-size:11px;padding:1px 5px;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk .q{font-size:24px;margin:4px 0 0}.tk .q small{font-size:12px}
.tk .due{font-size:13px}.tk .val{font-size:14px;font-weight:600;color:var(--ink)}
.tk .shape i{width:8px;height:8px}
.tk .dx{width:24px;height:24px;font-size:13px;top:-9px;right:-9px}
.tk .tag{font-size:11px;top:-9px}
.tk .unl{font-size:12px;padding:6px 2px;margin-top:4px}
.av{position:relative;flex:none;width:48px;height:48px;border:0;background:none;padding:0;display:grid;place-items:center}
.av .ring{position:absolute;inset:0;width:48px;height:48px;transform:rotate(-90deg)}
.av .rt{fill:#fff;stroke:#e4e0d3;stroke-width:4}
.av .rp{fill:none;stroke:var(--go);stroke-width:4;stroke-dasharray:144.5;stroke-dashoffset:144.5;stroke-linecap:round}
.av .ai{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;position:relative}
.av.idle .ai{filter:grayscale(.85);opacity:.55}
.av.walk .rt{stroke:#bfe3c8}
.av .af{position:absolute;right:-2px;bottom:-2px;background:var(--hud);color:#fff;border:2px solid #fff;border-radius:8px;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 3px}
.av .az{position:absolute;left:50%;transform:translateX(-50%);top:-7px;background:#8a958d;color:#fff;border-radius:6px;font-size:10px;padding:0 4px;line-height:14px}
.lane.crew .cards{gap:5px;padding-top:8px}
.crewpop{position:fixed;z-index:7;width:300px;background:#fff;border-radius:16px;border:2px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.22);padding:10px 12px 12px}
.crewpop .cph{display:flex;align-items:center;gap:10px}.crewpop .cph>div{flex:1;min-width:0}
.crewpop .cph b{display:block;font-size:16px}.crewpop .cph span{font-size:13px;color:var(--mute)}
.crewpop .xbtn{width:34px;height:34px;font-size:17px}
.crewpop .cpt{font-size:14px;margin-top:8px;color:var(--mute)}.crewpop .cpt b{color:var(--ink)}
.vtog{display:flex;gap:0;margin:0 0 10px;border:2px solid var(--line);border-radius:12px;overflow:hidden;width:max-content}
.vtog button{border:0;background:#fff;padding:8px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.vtog button.on{background:var(--hud);color:#fff}
.vtog .n{background:#e2552f;color:#fff;border-radius:99px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 5px}
.tk.ct{grid-column:span 2;background:#f8f5ff;border-color:#cdbdf0}
.tk.ct .ctag{background:#6b4fc8;color:#fff}
.tk .cps{display:flex;gap:3px}.tk .cps i{display:block;width:12px;height:12px;border-radius:3px}
.tk.ct .due{font-size:13px}.tk.ct .val{font-size:14px}
.placing{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid;border-radius:16px;padding:10px 12px;margin-bottom:10px}
.placing>div{flex:1;min-width:0}.placing b{display:block;font-size:17px}.placing span{font-size:14px;color:var(--mute)}
.placing .btn{padding:10px 14px;font-size:15px}
.nowline{position:absolute;width:3px;background:#16231b;border-radius:2px;pointer-events:none;z-index:3;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.blk{flex-direction:column;justify-content:center;align-items:center;padding:0 3px}
.blk .bx{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0;max-width:100%;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.blk .b1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.blk .b2{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.blk .fut{position:absolute;right:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 5px,rgba(255,255,255,.35) 5px 10px);pointer-events:none}
.blk.st-plan{border:2px dashed rgba(255,255,255,.95);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 5px,rgba(255,255,255,.3) 5px 10px)}
.blk.st-grow,.blk.st-ready{border:2px solid rgba(0,0,0,.25)}
.blk.st-ready{box-shadow:inset 0 0 0 3px rgba(255,255,255,.85)}
.blk.st-done{background-color:#a8a294!important;opacity:.75}
.blk.st-fail{opacity:.75}
.blk .rm{top:2px;right:2px;width:22px;height:22px;font-size:14px;border:2px solid rgba(255,255,255,.9);background:rgba(22,35,27,.85);z-index:2}
.blk .short{background:#fff;color:var(--bad);border-radius:6px;padding:0 4px;text-shadow:none}
[hidden]{display:none!important}
.floors{position:fixed;right:10px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(23,52,38,.92);border-radius:18px;padding:8px;color:#fff}
.floors button{position:relative;border:0;width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:22px;font-weight:700;display:grid;place-items:center}
.floors button:disabled{opacity:.3}
.floors b{font-size:14px;font-weight:600;text-align:center;line-height:1.1}
.floors b big{display:block;font-size:24px}
.floors .n{position:absolute;top:-7px;right:-7px;background:#e2552f;color:#fff;border-radius:99px;font-size:13px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.floors .n:empty{display:none}
.floors .n.hot{background:#c8402f;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px}
.tabs button.on{background:var(--hud);border-color:var(--hud);color:#fff}
.ftabs{display:flex;gap:6px;margin:2px 0 8px}
.ftabs button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:5px 10px;font-weight:600;font-size:14px}
.ftabs button.on{border-color:var(--ink);background:#fff8dc}
.roles{display:grid;gap:10px}
.role{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.role .rn{flex:1;min-width:0}
.role .rn b{display:block;font-size:17px}
.role .rn span{font-size:14px;color:var(--mute)}
.cnt3{display:flex;align-items:center;gap:8px}

</style>

<body>
<canvas id="cv"></canvas>
<header class="hud" id="hud">
  <div class="when"><b id="hWhen">Year 1</b><div class="yr" id="hYr"></div></div>
  <div class="stat"><small>Cash</small><b id="hCash">$0</b></div>
  <div class="stat"><small>Reputation</small><b id="hRep">50</b></div>
  <div class="sp"></div>
  <button class="hb" id="bBoard" type="button">Board <span class="n" id="bN"></span></button>
  <button class="hb go" id="bGo" type="button">Start</button>
  <div class="seg" id="speed"><button type="button" data-s="1" class="on">1x</button><button type="button" data-s="1.5">1.5x</button></div>
</header>
<div class="toasts" id="toasts"></div>
<div class="floors" id="floors" hidden><button type="button" id="fUp" aria-label="Floor up">▲<span class="n"></span></button><b id="fLab">Floor<big>1</big></b><button type="button" id="fDn" aria-label="Floor down">▼<span class="n"></span></button></div>
<footer class="tray" id="tray">
  <div class="lane"><span class="who">YOU</span><div class="cards" id="qMe"></div></div>
  <div class="lane crew" id="laneC" hidden><span class="who">CREW</span><div class="cards" id="qC"></div></div>
</footer>
<div class="crewpop" id="crewPop" hidden></div>
<div class="ask" id="ask" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=Math.random,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pick=a=>a[Math.floor(rnd()*a.length)];
const fmt=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

// ---------------- rules ----------------
const PN=['Early winter','Late winter','Early spring','Late spring','Early summer','Late summer','Early fall','Late fall'];
const PSH=['E.win','L.win','E.spr','L.spr','E.sum','L.sum','E.fall','L.fall'];
const PSEC=60,CAP=10,OVERHEAD=330,FLOOR_OH=150,FLOOR_COST=[0,5000,8000],MAXF=3,POT_BY=.5,TRUCK_WAIT=30,STAFF_SLOW=1.15;
const CROPS={
  petunia:{name:'Petunia',g:1,sell:[2,3,4],price:34,loss:.05,q:[8,20],color:'#c0428a'},
  vinca:{name:'Vinca',g:1,sell:[4,5,6],price:34,loss:.05,q:[8,20],color:'#7656d2'},
  geranium:{name:'Geranium',g:2,sell:[2,3],price:50,loss:.06,q:[8,18],color:'#d8433b'},
  begonia:{name:'Begonia',g:2,sell:[3,4,5],price:44,loss:.06,q:[8,18],color:'#e9803a'},
  pothos:{name:'Pothos',g:2,sell:[0,1,2,3,4,5,6,7],price:54,loss:.04,q:[6,16],color:'#8fb72e'},
  mum:{name:'Mum',g:2,sell:[5,6],price:46,loss:.06,q:[8,18],color:'#e2a91f'},
  poinsettia:{name:'Poinsettia',g:3,sell:[7],price:94,loss:.08,q:[8,20],color:'#b3122b'},
  fern:{name:'Fern',g:2,sell:[1,2,3,4,5,6],price:48,loss:.04,q:[6,16],color:'#2e7d5b'},
  kale:{name:'Kale',g:2,sell:[0,1,6,7],price:40,loss:.05,q:[8,18],color:'#6e7f96'},
  hydrangea:{name:'Hydrangea',g:3,sell:[3,4],price:88,loss:.07,q:[6,14],color:'#3d8bd6'}};
const GEN={vinca:1200,begonia:1500,geranium:1800,fern:2000,kale:2200,hydrangea:3500,poinsettia:4500};
const STARTERS=['pothos','petunia','mum'];
const owns=k=>!S.owned||S.owned.includes(k);
for(const k in CROPS)CROPS[k].cost=Math.round(CROPS[k].price*.3);
const CUST=['Red Dirt Landscaping','Caprock Home and Garden','Sunrise Grocery','Pecan Street Market','Windmill Hardware','Hillside Garden Center','Mesa Florist','Big Country Feed'];
const LETTERS='ABCDEFGHIJKLMNOPQRSTUVWX';
const BENCH=[...LETTERS].map((L,i)=>{const k=i%8,x=k%2?5:1,y=[1,2,4,5][k>>1];return{L,i,f:Math.floor(i/8),x,y,ax:x+1,ay:y===1?0:y===5?6:3};});
const UNIT={x:8,y:3,ax:7,ay:3},DOCK={x:4,y:-1,f:0},LIFT={x:0,y:6};
const WORK={pot:1.8,water:1,pest:2,fix:3.2};
const ROLES={
  pot:{name:'Planter',does:'Pots new orders',cost:120},
  water:{name:'Waterer',does:'Waters thirsty benches',cost:90},
  pest:{name:'Applicator',does:'Sprays for pests',cost:105},
  fix:{name:'Mechanic',does:'Fixes heaters and fans',cost:80},
  load:{name:'Loader',does:'Loads trucks at the dock',cost:120}};
const SLOW0=1.6,SLOW_STEP=.06,VET=10;
const NAMES=['Ana','Luis','Mara','Dev','Rosa','Jun','Tess','Omar','Kira','Ben','Lupe','Nate','Ivy','Raj','Sol','Wren','Cruz','Tam'];
const slowOf=r=>r?Math.max(1,SLOW0-SLOW_STEP*r.n):1;
const spd=r=>Math.round(100/slowOf(r));
const UPS={
  pots:{name:'Pots',icon:'pot',lv:['Glazed pots','Decorative pots','Designer pots'],does:l=>`Sell for ${l*10}% more per flat`,cost:[1500,3000,5000]},
  soil:{name:'Soil',icon:'water',lv:['Better mix','Premium mix','Custom blend'],does:l=>`Missed watering and pests do ${l*20}% less damage`,cost:[1200,2400,4000]},
  hose:{name:'Hoses',icon:'water',lv:['Soaker hoses','Drip lines','Timed drip'],does:l=>`Thirsty plants hold out ${l*25}% longer`,cost:[1000,2000,3500]}};
const upLv=k=>(S.up&&S.up[k])||0;
const SHIRT={me:'#2f8a4e',pot:'#9a5b26',water:'#2a78d0',pest:'#cf3a2f',fix:'#56606b',load:'#2c8a47'};
const unitName=p=>(p>=4&&p<=5)?'Fans':'Heater';
const floorName=f=>`Floor ${f+1}`;
const floorSpan=f=>`${LETTERS[f*8]}–${LETTERS[f*8+7]}`;

// ---------------- icons ----------------
const IC={
  pot:{c:'#9a5b26',f:['M6 11h12l-1.7 8.6a1 1 0 0 1-1 .9H8.7a1 1 0 0 1-1-.9z'],s:['M12 11V5.5','M12 8C10.5 5.5 8.2 5.4 7 6.8','M12 8c1.5-2.5 3.8-2.6 5-1.2']},
  water:{c:'#2a78d0',f:['M12 3.5C9.2 7.6 6.5 10.8 6.5 14.2a5.5 5.5 0 0 0 11 0c0-3.4-2.7-6.6-5.5-10.7z'],s:[]},
  pest:{c:'#cf3a2f',f:['M12 7.2c2.3 0 4 1.9 4 4.3V15a4 4 0 0 1-8 0v-3.5c0-2.4 1.7-4.3 4-4.3z'],s:['M8 11.5H4.5','M16 11.5h3.5','M8 15.5H4.5','M16 15.5h3.5','M10.2 7.6 8.6 4.8','M13.8 7.6l1.6-2.8']},
  load:{c:'#2c8a47',f:['M2.5 6.5h11v10h-11z','M14.5 9.5h3.8l3.2 3.4v3.6h-7z','M5 18.2a1.9 1.9 0 1 0 3.8 0a1.9 1.9 0 1 0-3.8 0z','M15.4 18.2a1.9 1.9 0 1 0 3.8 0a1.9 1.9 0 1 0-3.8 0z'],s:[]},
  fix:{c:'#56606b',f:['M15.7 3.6a4.6 4.6 0 0 0-4.4 6.1L4.8 16.2a1.9 1.9 0 0 0 2.7 2.7l6.5-6.5a4.6 4.6 0 0 0 6.1-4.4l-2.8 2.8-2.6-.4-.4-2.6z'],s:[]},
  pop:{c:'#c98a00',f:['M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z'],s:[]},
  good:{c:'#2e7d4a',f:[],s:['M5.5 12.5l4.2 4.2L18.5 8']},
  bad:{c:'#c8402f',f:[],s:['M7 7l10 10','M17 7L7 17']},
  cash:{c:'#2e7d4a',f:[],s:['M12 4v16','M16 7.5c-.8-1.2-2.2-1.8-4-1.8-2.3 0-3.8 1.1-3.8 2.8 0 4 7.8 2.2 7.8 6.2 0 1.8-1.6 3-4 3-1.8 0-3.4-.7-4.2-2']},
  floor:{c:'#173426',f:[],s:['M4 9l8-5 8 5','M4 15l8-5 8 5','M4 20l8-5 8 5']}};
const P2D={};for(const k in IC)P2D[k]={f:IC[k].f.map(d=>new Path2D(d)),s:IC[k].s.map(d=>new Path2D(d))};
function svgIcon(k,size){const I=IC[k];return`<span class="ic" style="width:${size}px;height:${size}px;background:${I.c}"><svg viewBox="0 0 24 24" width="${Math.round(size*.62)}" height="${Math.round(size*.62)}"><g fill="#fff" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${I.f.map(d=>`<path d="${d}" stroke="none"/>`).join('')}${I.s.map(d=>`<path d="${d}" fill="none"/>`).join('')}</g></svg></span>`;}
function glyph(k,size){const I=IC[k];return`<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true"><g fill="#fff" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${I.f.map(d=>`<path d="${d}" stroke="none"/>`).join('')}${I.s.map(d=>`<path d="${d}" fill="none"/>`).join('')}</g></svg>`;}

// ---------------- state ----------------
let S=null;
function fresh(){
  S={v:3,year:1,period:0,t:0,phase:'plan',cash:2500,rep:50,buf:.1,floors:1,crew:[],
    up:{pots:0,soil:0,hose:0},owned:STARTERS.slice(),contracts:[],plots:[],orders:[],offers:[],tasks:[],queue:[],events:[],trucks:[],broken:[false,false,false],dmgT:[0,0,0],nid:1,
    ys:{rev:0,plugs:0,overhead:0,crew:0,buy:0,full:0,short:0,failed:0},welcomed:false};
}
const mkWorker=(id,role,x,y)=>({id,role,x,y,f:0,path:[],task:null,work:0,leg:null,ride:0});
let me=mkWorker('me','me',4.5,3.5),staff=[],viewF=0;
const crop=c=>CROPS[c];
const orderOf=pl=>S.orders.find(o=>o.id===pl.oid);
const have=pl=>pl.alive.reduce((a,b)=>a+b,0);
const need=of=>Math.min(3,Math.ceil(Math.round(of.qty*(1+S.buf))/CAP));
const startOf=of=>of.p-crop(of.crop).g+1;
const plotAt=(r,c)=>S.plots.find(pl=>pl.rows.includes(r)&&c>=pl.s&&c<=pl.e);
const liveAt=(r,c)=>S.plots.find(pl=>!pl.done&&pl.rows.includes(r)&&c>=pl.s&&c<=pl.e);
const plotF=pl=>BENCH[pl.rows[0]].f;
function prog(pl){const el=(S.period-pl.s)+(S.phase==='run'?S.t/PSEC:0);return el/(crop(pl.crop).g-.85);}
const minStart=()=>S.phase==='plan'?S.period:S.period+1;
const roundKey=()=>S.year*100+S.period*2+(S.phase==='plan'?0:1);
const crewCost=()=>S.crew.reduce((a,r)=>a+r.wage,0);
const upkeep=()=>OVERHEAD+FLOOR_OH*(S.floors-1);

// ---------------- placement ----------------
function piece(x){return x.oid!=null?{plot:x,crop:x.crop,h:x.rows.length,s:x.s,e:x.e}:{offer:x,crop:x.crop,h:need(x),s:startOf(x),e:x.p};}
function fitsP(pp,top){
  if(top<0||top+pp.h>S.floors*8||pp.s<minStart())return false;
  if(Math.floor(top/8)!==Math.floor((top+pp.h-1)/8))return false;
  for(let r=top;r<top+pp.h;r++)for(let c=pp.s;c<=pp.e;c++){const o=plotAt(r,c);if(o&&o!==pp.plot)return false;}
  return true;
}
const fits=(of,top)=>fitsP(piece(of),top);
function firstFit(of){const pp=piece(of);for(let r=0;r<S.floors*8;r++)if(fitsP(pp,r))return r;return -1;}
function place(of,top){
  if(!owns(of.crop)||!fits(of,top))return false;
  const h=need(of),total=Math.min(h*CAP,Math.round(of.qty*(1+S.buf)));
  const o={id:S.nid++,crop:of.crop,qty:of.qty,p:of.p,price:of.price,cust:of.cust,status:'open',contract:of.cid,k:of.k};
  const rows=[],flats=[];let left=total;
  for(let i=0;i<h;i++){rows.push(top+i);const f=Math.min(CAP,left-(h-1-i));flats.push(f);left-=f;}
  const pl={id:S.nid++,oid:o.id,crop:of.crop,s:startOf(of),e:of.p,rows,flats,alive:flats.slice(),potted:rows.map(()=>false),done:false,taken:roundKey(),of};
  o.plot=pl.id;S.orders.push(o);S.plots.push(pl);S.offers=S.offers.filter(x=>x!==of);
  return true;
}

// ---------------- offers ----------------
function candidates(c,minS,maxP,pref){
  const out=[];
  for(const k in CROPS){const C=CROPS[k];for(const p of C.sell){const s=p-C.g+1;if(s>=minS&&p<=maxP&&p<=7&&p>=c)out.push({k,p,w:pref&&pref.includes(k)?4:1});}}
  return out;
}
function mkOffer(cd,mult){const C=CROPS[cd.k];return{id:S.nid++,crop:cd.k,p:cd.p,qty:ri(C.q[0],C.q[1]),price:Math.round(C.price*(mult||1)*(.92+rnd()*.22)),cust:pick(CUST)};}
function wpick(list){const t=list.reduce((a,x)=>a+x.w,0);let r=rnd()*t;for(const x of list){r-=x.w;if(r<=0)return x;}return list[list.length-1];}
function genOffers(){
  const c=S.period;S.offers=[];genContracts();
  const cand=candidates(c,c,c+2);if(!cand.length)return;
  const mine=cand.filter(x=>owns(x.k));
  const base=clamp(2+Math.floor(S.rep/30)+(rnd()<.5?1:0),2,6),n=Math.round(base*S.floors);
  const theirs=cand.filter(x=>!owns(x.k)),sure=mine.length?Math.min(n,Math.max(2,Math.ceil(n*.5))):0;
  for(let i=0;i<sure;i++)S.offers.push(mkOffer(wpick(mine)));
  const rest=theirs.length?n-sure+1:n-sure;
  for(let i=0;i<rest;i++)S.offers.push(mkOffer(wpick(theirs.length?theirs:cand)));
  S.offers.sort((a,b)=>owns(b.crop)-owns(a.crop));
}
function genContracts(){
  const c=S.period;const n=(S.rep>=35?1:0)+(rnd()<S.rep/140?1:0)+(S.floors-1);
  for(let i=0;i<n;i++){
    const opts=[];
    for(const k in CROPS){const C=CROPS[k];for(let p0=c;p0<=c+2;p0++){if(p0-C.g+1<c)continue;let run=0;while(run<4&&p0+run<=7&&C.sell.includes(p0+run))run++;if(run>=3)opts.push({k,p0,run,w:owns(k)?3:1});}}
    if(!opts.length)return;
    const o=wpick(opts),C=CROPS[o.k];
    S.offers.push({id:S.nid++,contract:true,crop:o.k,p:o.p0,ps:Array.from({length:o.run},(_,j)=>o.p0+j),n:o.run,qty:ri(6,12),price:Math.round(C.price*1.1*(.95+rnd()*.15)),cust:pick(CUST)});
  }
}
const offerValue=o=>o.qty*o.price*(o.contract?o.n:1);
function delivery(of,k,cid){return{id:'d'+cid+'_'+k,crop:of.crop,p:of.ps[k],qty:of.qty,price:of.price,cust:of.cust,cid,k};}
function contractOf(id){return S.contracts.find(c=>c.id===id);}
function contractFail(cid){
  const c=contractOf(cid);if(!c||c.broken)return;c.broken=true;
  const rest=S.plots.filter(p=>{const o=orderOf(p);return o&&o.contract===cid&&!p.done&&!p.potted.some(Boolean);});
  rest.forEach(p=>{S.orders=S.orders.filter(o=>o.id!==p.oid);S.plots=S.plots.filter(x=>x!==p);});
  S.rep=clamp(S.rep-4,0,100);toast('bad',`${c.cust.split(' ')[0]} cancelled the rest of the contract`);
}
function contractShipped(cid){const c=contractOf(cid);if(!c||c.broken)return;c.done++;if(c.done>=c.n){S.rep=clamp(S.rep+4,0,100);toast('good',`Contract with ${c.cust.split(' ')[0]} complete`);}}
function autoAccept(of){
  if(!owns(of.crop))return false;
  if(!of.contract){const r=firstFit(of);return r>=0&&place(of,r);}
  const cid=S.nid++,c={id:cid,cust:of.cust,crop:of.crop,n:of.n,done:0,broken:false,round:roundKey(),of};S.contracts.push(c);
  const made=[];
  for(let k=0;k<of.n;k++){const d=delivery(of,k,cid),r=firstFit(d);if(r<0||!place(d,r)){made.forEach(pl=>{S.plots=S.plots.filter(x=>x!==pl);S.orders=S.orders.filter(o=>o.id!==pl.oid);});S.contracts=S.contracts.filter(x=>x!==c);return false;}made.push(S.plots[S.plots.length-1]);}
  S.offers=S.offers.filter(x=>x!==of);return true;
}
function genPopup(){
  const c=S.period,cand=candidates(c,c+1,c+3,['vinca','pothos','mum']);if(!cand.length)return;
  const of=mkOffer(wpick(cand),1.25);of.popup=true;S.offers.push(of);
  toast('pop',`Pop-up: ${of.qty} ${crop(of.crop).name.toLowerCase()} for ${PN[of.p].toLowerCase()}`,()=>{openSheet('orders');if(owns(of.crop))startPlacing(of);});
  renderSheet();
}

// ---------------- tasks ----------------
function addTask(t){t.id=S.nid++;t.born=t.born??S.t;S.tasks.push(t);return t;}
function dropTask(t){S.tasks=S.tasks.filter(x=>x!==t);S.queue=S.queue.filter(x=>x!==t);}
const taskF=t=>t.type==='load'?0:t.type==='fix'?t.f:BENCH[t.bench].f;
function workOf(t){if(t.type==='load'){const pl=S.plots.find(p=>p.id===t.plot);return 1.2+(pl?orderOf(pl).qty:10)*.09;}return t.rows?WORK[t.type]*t.rows.length:WORK[t.type];}
function taskLabel(t){
  if(t.type==='load'){const pl=S.plots.find(p=>p.id===t.plot);return'Load '+(pl?crop(pl.crop).name:'');}
  if(t.type==='fix')return'Fix '+unitName(S.period).toLowerCase()+(S.floors>1?' '+(t.f+1):'');
  const nm=({pot:'Pot',water:'Water',pest:'Spray'})[t.type];
  if(t.rows)return nm+' '+LETTERS[t.rows[0]]+(t.rows.length>1?'–'+LETTERS[t.rows[t.rows.length-1]]:'');
  return nm+' '+LETTERS[t.bench];
}
function target(t){
  if(t.type==='load')return DOCK;
  if(t.type==='fix')return{x:UNIT.ax,y:UNIT.ay,f:t.f};
  const b=BENCH[t.bench];return{x:b.ax,y:b.ay,f:b.f};
}
const engaged=t=>me.task===t||staff.some(w=>w.task===t);
function complete(t){
  const pl=t.plot!=null?S.plots.find(p=>p.id===t.plot):null;
  if(t.type==='pot'&&pl&&!pl.done){
    const late=Math.max(0,S.t-t.due)/PSEC*.8;let lost=0;
    pl.rows.forEach((r,k)=>{pl.potted[k]=true;pl.alive[k]=Math.round(pl.flats[k]*(1-late));lost+=pl.flats[k]-pl.alive[k];});
    const cost=pl.flats.reduce((a,b)=>a+b,0)*crop(pl.crop).cost;S.cash-=cost;S.ys.plugs+=cost;
    if(lost)float(BENCH[t.bench],`${lost} lost, potted late`,'#c8402f');
  }
  if(t.type==='fix'){S.broken[t.f]=false;toast('good',`${unitName(S.period)} running again${S.floors>1?' on '+floorName(t.f).toLowerCase():''}`);}
  dropTask(t);
  if(t.type==='load'&&pl&&!pl.done)ship(pl,t.truck);
}

// ---------------- trucks and shipping ----------------
let ask=null;
const truckById=id=>S.trucks.find(k=>k.id===id);
function dockNext(){
  if(S.trucks.some(k=>k.state==='dock'))return;
  const k=S.trucks.filter(k=>k.state==='line').sort((a,b)=>a.arrived-b.arrived)[0];if(!k)return;
  k.state='dock';
  const pl=S.plots.find(p=>p.id===k.plot);
  if(!pl||pl.done){k.state='gone';dockNext();return;}
  addTask({type:'load',plot:pl.id,truck:k.id,born:k.arrived,due:k.deadline});
}
function truckLeaves(k,missed){
  k.state='gone';k.leftAt=performance.now();
  if(missed){
    const pl=S.plots.find(p=>p.id===k.plot);
    if(pl&&!pl.done){pl.done=true;pl.fail=true;orderOf(pl).status='failed';S.rep=clamp(S.rep-6,0,100);S.ys.failed++;const cid=orderOf(pl).contract;if(cid)contractFail(cid);
      S.tasks.filter(t=>t.plot===pl.id).forEach(dropTask);toast('bad',`${orderOf(pl).cust.split(' ')[0]}'s truck gave up waiting`);}
  }
  dockNext();
}
function ship(pl,truckId){
  const o=orderOf(pl);
  let short=o.qty-have(pl),borrowed=0;
  if(short>0)for(const q of S.plots){
    if(short<=0)break;if(q===pl||q.done||q.crop!==pl.crop||!q.potted.some(Boolean)||prog(q)<1)continue;
    let sur=have(q)-orderOf(q).qty;
    for(let k=q.rows.length-1;k>=0&&sur>0&&short>0;k--){const n=Math.min(sur,short,q.alive[k]);q.alive[k]-=n;sur-=n;short-=n;borrowed+=n;}
  }
  if(borrowed){pl.alive[0]+=borrowed;float(BENCH[pl.rows[0]],`+${borrowed} from other benches`,'#2e7d4a');}
  pl.done=true;
  S.tasks.filter(t=>t.plot===pl.id).forEach(dropTask);
  if(short>0&&!window.__quiet){askBuy(pl,short,truckId);return;}
  finishShip(pl,window.__buyIn?short:0,truckId);
}
function finishShip(pl,bought,truckId){
  const o=orderOf(pl),C=crop(pl.crop),alive=have(pl)+bought,sent=Math.min(alive,o.qty),extra=alive-sent;
  const pm=1+.1*upLv('pots'),buyCost=bought*Math.round(C.price*1.2),rev=Math.round(sent*o.price*pm),clear=extra*Math.round(o.price*.35*pm);
  S.cash+=rev+clear-buyCost;S.ys.rev+=rev+clear;S.ys.buy+=buyCost;o.status='shipped';o.sent=sent;if(o.contract)contractShipped(o.contract);
  if(sent>=o.qty){S.rep=clamp(S.rep+(bought?1:3),0,100);S.ys.full++;toast('cash',`${sent} ${C.name.toLowerCase()} shipped, +${fmt(rev+clear-buyCost)}`);}
  else{S.rep=clamp(S.rep-(1+5*(1-sent/o.qty)),0,100);S.ys.short++;toast('bad',`Short: ${sent} of ${o.qty} ${C.name.toLowerCase()}, +${fmt(rev+clear)}`);}
  const k=truckById(truckId);if(k&&k.state!=='gone')truckLeaves(k,false);
}
function askBuy(pl,short,truckId){
  const o=orderOf(pl),C=crop(pl.crop),cost=short*Math.round(C.price*1.2);
  if(ask)resolveAsk(0);
  ask={pl,short,truckId,t0:performance.now()};
  const el=$('ask');el.hidden=false;
  el.innerHTML=`<div class="aq">${svgIcon('load',44)}<div><b>${short} short for ${esc(o.cust)}</b><span>${have(pl)} of ${o.qty} ${C.name.toLowerCase()} on the truck</span></div></div>
    <div class="ab"><button class="btn sun" type="button" id="askBuy">Buy in ${short} · ${fmt(cost)}</button><button class="btn" type="button" id="askShort">Ship short</button></div><i class="at"><i id="askT"></i></i>`;
  $('askBuy').onclick=()=>resolveAsk(short);$('askShort').onclick=()=>resolveAsk(0);
}
function resolveAsk(bought){if(!ask)return;const a=ask;ask=null;$('ask').hidden=true;finishShip(a.pl,bought,a.truckId);}

// ---------------- crew ----------------
function syncStaff(){
  staff=staff.filter(w=>S.crew.some(r=>r.id===w.id));
  for(const r of S.crew){let w=staff.find(x=>x.id===r.id);if(!w){w=mkWorker(r.id,r.role,1.5+staff.length%7,6.5);w.f=r.role==='load'?0:Math.min(r.home,S.floors-1);staff.push(w);}w.rec=r;if(r.home>=S.floors)r.home=0;}
}
function hire(role){
  const used=S.crew.map(r=>r.name),name=NAMES.find(n=>!used.includes(n))||('Hand '+(S.crew.length+1));
  S.crew.push({id:'s'+S.nid++,name,role,home:role==='load'?0:clamp(viewF,0,S.floors-1),n:0,wage:ROLES[role].cost});syncStaff();
}
function fire(id){const r=S.crew.find(x=>x.id===id);S.crew=S.crew.filter(x=>x.id!==id);const w=staff.find(x=>x.id===id);if(w&&w.task)w.task=null;syncStaff();return r;}
function setHome(id,f){const r=S.crew.find(x=>x.id===id),w=staff.find(x=>x.id===id);if(!r||r.role==='load')return;r.home=clamp(f,0,S.floors-1);if(w&&w.task&&!(w.work>0)){w.task=null;w.path=[];w.leg=null;}}
function staffPick(w){
  if(w.task)return;
  const home=w.rec?w.rec.home:0;
  const t=S.tasks.filter(t=>t.type===w.role&&(t.type==='load'||taskF(t)===home)&&!S.queue.includes(t)&&!engaged(t)&&(t.type!=='load'||truckById(t.truck)?.state==='dock'))
    .sort((a,b)=>(a.due??999)-(b.due??999))[0];
  if(t)assign(w,t);
}

// ---------------- workers ----------------
const walkable=(x,y)=>{if(y===-1)return x>=3&&x<=5;if(x<0||x>8||y<0||y>6)return false;if(x===UNIT.x&&y===UNIT.y)return false;return!BENCH.slice(0,8).some(b=>y===b.y&&x>=b.x&&x<b.x+3);};
function route(fx,fy,tx,ty){
  const k=(x,y)=>x+','+y,prev={},q=[[fx,fy]];prev[k(fx,fy)]=null;
  while(q.length){const [x,y]=q.shift();if(x===tx&&y===ty)break;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(!walkable(nx,ny)||k(nx,ny) in prev)continue;if((y===-1)!==(ny===-1)&&!(x===4&&nx===4))continue;prev[k(nx,ny)]=[x,y];q.push([nx,ny]);}}
  if(!(k(tx,ty) in prev))return[];
  const out=[];let c=[tx,ty];while(c){out.unshift({x:c[0]+.5,y:c[1]+.5});c=prev[k(c[0],c[1])];}
  out.shift();return out;
}
function plan(w){
  const tg=target(w.task);
  if(w.f!==tg.f){w.leg='lift';w.path=route(Math.floor(w.x),Math.floor(w.y),LIFT.x,LIFT.y);}
  else{w.leg=null;w.path=route(Math.floor(w.x),Math.floor(w.y),tg.x,tg.y);}
}
function assign(w,t){w.task=t;w.work=0;w.ride=0;plan(w);}
function stepWorker(w,dt,slow){
  if(w.task&&!S.tasks.includes(w.task)){w.task=null;w.work=0;w.path=[];w.leg=null;}
  if(!w.task){
    if(w===me){while(S.queue.length&&!S.tasks.includes(S.queue[0]))S.queue.shift();if(!S.queue.length)return;assign(w,S.queue[0]);}
    else{
      staffPick(w);
      if(!w.task){
        const home=w.rec&&w.role!=='load'?w.rec.home:0;
        if(w.f!==home){
          if(w.leg!=='home'){w.leg='home';w.ride=0;w.path=route(Math.floor(w.x),Math.floor(w.y),LIFT.x,LIFT.y);}
          if(w.path.length){const n=w.path[0],dx=n.x-w.x,dy=n.y-w.y,d=Math.hypot(dx,dy),sp=4/slow*dt;if(d<=sp){w.x=n.x;w.y=n.y;w.path.shift();}else{w.x+=dx/d*sp;w.y+=dy/d*sp;}}
          else{w.ride+=dt;if(w.ride>=1.1){w.f=home;w.ride=0;w.leg=null;}}
        }
        return;
      }
    }
  }
  if(w.path.length){
    const n=w.path[0],dx=n.x-w.x,dy=n.y-w.y,d=Math.hypot(dx,dy),sp=4/slow*dt;
    if(d<=sp){w.x=n.x;w.y=n.y;w.path.shift();}else{w.x+=dx/d*sp;w.y+=dy/d*sp;}
    return;
  }
  if(w.leg==='lift'){w.ride+=dt;if(w.ride>=1.1){w.f=target(w.task).f;w.ride=0;plan(w);}return;}
  if(w.task.type==='load'&&truckById(w.task.truck)?.state!=='dock')return;
  w.work+=dt;
  if(w.work>=workOf(w.task)*slow){const t=w.task;w.task=null;w.work=0;complete(t);}
}
function enqueue(t){
  const holder=staff.find(w=>w.task===t);
  if(holder){if(holder.work>0){toast('good',`${ROLES[holder.role].name} is already on it`);return;}holder.task=null;holder.path=[];}
  if(S.queue.includes(t)){S.queue=[t,...S.queue.filter(x=>x!==t)];if(me.task&&me.task!==t){me.task=null;me.path=[];me.work=0;}return;}
  if(t.type==='load'){const i=me.task&&S.queue[0]===me.task?1:0;let j=i;while(j<S.queue.length&&S.queue[j].type==='load')j++;S.queue.splice(j,0,t);return;}
  S.queue.push(t);
}

// ---------------- period flow ----------------
function startPeriod(){
  const c=S.period;S.phase='run';S.t=0;S.events=[];S.tasks=[];S.queue=[];S.trucks=[];
  S.broken=[false,false,false];S.dmgT=[0,0,0];me.task=null;me.path=[];
  syncStaff();staff.forEach(w=>{w.task=null;w.path=[];});
  S.offers=S.offers.filter(o=>o.popup&&startOf(o)>c);
  const cc=crewCost();S.cash-=upkeep()+cc;S.ys.overhead+=upkeep();S.ys.crew+=cc;
  S.plots.filter(pl=>pl.s===c&&!pl.done).forEach(pl=>addTask({type:'pot',plot:pl.id,bench:pl.rows[Math.floor((pl.rows.length-1)/2)],rows:pl.rows.slice(),born:0,due:PSEC*POT_BY}));
  S.plots.filter(pl=>pl.e===c&&!pl.done).forEach(pl=>{const at=PSEC*(.14+rnd()*.36);S.trucks.push({id:S.nid++,plot:pl.id,at,state:'coming'});S.events.push({at,k:'truck',plot:pl.id});});
  const thirst=[.5,.55,.75,.85,1,1,.75,.55][c];
  S.plots.filter(pl=>!pl.done&&pl.s<=c&&pl.e>=c).forEach(pl=>{if(rnd()<thirst)S.events.push({at:PSEC*(.12+rnd()*.7),k:'thirst',plot:pl.id});});
  const pest=[.3,.35,.5,.6,.7,.7,.5,.35][c];
  for(let f=0;f<S.floors;f++){
    if(rnd()<pest)S.events.push({at:PSEC*(.1+rnd()*.6),k:'pest',f});
    if(rnd()<pest*.45)S.events.push({at:PSEC*(.3+rnd()*.5),k:'pest',f});
    if(rnd()<.35)S.events.push({at:PSEC*(.08+rnd()*.6),k:'break',f});
  }
  if(c>=2&&c<=5&&rnd()<.6)S.events.push({at:PSEC*(.15+rnd()*.3),k:'popup'});
  S.events.sort((a,b)=>a.at-b.at);
  closeSheet();hud();
}
function fire(e){
  const c=S.period;
  if(e.k==='truck'){
    const k=S.trucks.find(k=>k.plot===e.plot);if(!k)return;
    k.state='line';k.arrived=S.t;k.deadline=S.t+TRUCK_WAIT;k.x=-14;
    const waiting=S.trucks.filter(k=>k.state==='line'||k.state==='dock').length;
    toast('load',waiting>1?`Truck arrived, ${waiting} in line`:'Truck at the dock');
    dockNext();
  }
  if(e.k==='thirst'){const pl=S.plots.find(p=>p.id===e.plot);if(pl&&!pl.done&&pl.potted.some(Boolean)&&!S.tasks.some(t=>t.type==='water'&&t.plot===pl.id))addTask({type:'water',plot:pl.id,bench:pl.rows[Math.floor((pl.rows.length-1)/2)],rows:pl.rows.slice(),due:S.t+18*(1+.25*upLv('hose'))});}
  if(e.k==='pest'){
    const opts=[];S.plots.filter(pl=>!pl.done&&pl.s<=c&&plotF(pl)===e.f).forEach(pl=>pl.rows.forEach((r,k)=>{if(pl.potted[k]&&!S.tasks.some(t=>t.type==='pest'&&t.bench===r))opts.push([pl,r]);}));
    if(opts.length){const [pl,r]=pick(opts);addTask({type:'pest',bench:r,plot:pl.id,due:S.t+24});toast('pest',`Pests on bench ${LETTERS[r]}`);}
  }
  if(e.k==='break'&&!S.broken[e.f]){S.broken[e.f]=true;S.dmgT[e.f]=0;addTask({type:'fix',f:e.f,due:S.t+20});toast('fix',`${unitName(c)} down${S.floors>1?' on '+floorName(e.f).toLowerCase():''}`);}
  if(e.k==='popup')genPopup();
}
function hurt(pl,r,frac,min){const k=pl.rows.indexOf(r);if(k<0||!pl.potted[k])return 0;const n=Math.min(pl.alive[k],Math.max(min||0,Math.round(pl.alive[k]*frac)));pl.alive[k]-=n;return n;}
function tick(dt){
  // engaged jobs stop counting down
  for(const w of [me,...staff])if(w.task&&w.task.due!=null){w.task.due+=dt;w.task.born+=dt;if(w.task.type==='load'){const k=truckById(w.task.truck);if(k)k.deadline=w.task.due;}}
  S.t+=dt;
  while(S.events.length&&S.events[0].at<=S.t)fire(S.events.shift());
  for(const k of S.trucks)if((k.state==='line'||k.state==='dock')&&S.t>=k.deadline&&!(ask&&ask.truckId===k.id))truckLeaves(k,true);
  for(const t of S.tasks.slice()){
    if(t.type==='water'&&S.t>=t.due){const pl=S.plots.find(p=>p.id===t.plot);if(pl){let n=0;pl.rows.forEach(r=>n+=hurt(pl,r,.25*(1-.2*upLv('soil')),1));if(n)float(BENCH[t.bench],`${n} wilted`,'#c8402f');}dropTask(t);}
    if(t.type==='pest'&&S.t>=t.due){
      const pl=S.plots.find(p=>p.id===t.plot);if(pl){const n=hurt(pl,t.bench,.25*(1-.2*upLv('soil')),1);if(n)float(BENCH[t.bench],`${n} lost to pests`,'#c8402f');}
      t.born=S.t;t.due=S.t+24;
      const f=BENCH[t.bench].f;
      const nb=S.plots.filter(p=>!p.done&&plotF(p)===f).flatMap(p=>p.rows.filter((r,k)=>p.potted[k]&&Math.abs(r-t.bench)<=2&&r!==t.bench&&!S.tasks.some(x=>x.type==='pest'&&x.bench===r)).map(r=>[p,r]));
      if(nb.length){const [p2,r2]=pick(nb);addTask({type:'pest',bench:r2,plot:p2.id,due:S.t+24});toast('pest',`Pests spread to ${LETTERS[r2]}`);}
    }
  }
  for(let f=0;f<S.floors;f++)if(S.broken[f]){S.dmgT[f]+=dt;if(S.dmgT[f]>=6){S.dmgT[f]-=6;S.plots.filter(p=>!p.done&&p.s<=S.period&&plotF(p)===f&&prog(p)<1).forEach(p=>p.rows.forEach(r=>{if(rnd()<.6&&hurt(p,r,0,1))float(BENCH[r],'−1','#c8402f');}));}}
  if(S.t>=PSEC)endPeriod();
}
function simStep(dt){
  for(const w of staff)stepWorker(w,dt,slowOf(w.rec));
  stepWorker(me,dt,1);
  tick(dt);
}
function endPeriod(){
  if(ask)resolveAsk(0);
  const c=S.period;
  S.trucks.filter(k=>k.state==='line'||k.state==='dock'||k.state==='coming').forEach(k=>truckLeaves(k,true));
  let fails=0;
  S.plots.filter(pl=>pl.s===c&&!pl.done).forEach(pl=>{
    if(!pl.potted.some(Boolean)){pl.done=true;pl.fail=true;pl.e=c;orderOf(pl).status='failed';fails++;if(orderOf(pl).contract)contractFail(orderOf(pl).contract);}
    else pl.potted.forEach((v,k)=>{if(!v){pl.alive[k]=0;pl.flats[k]=0;}});
  });
  S.tasks.filter(t=>t.type==='pest').forEach(t=>{const pl=S.plots.find(p=>p.id===t.plot);if(pl&&!pl.done)hurt(pl,t.bench,.2,1);});
  S.plots.filter(pl=>!pl.done&&pl.s<=c).forEach(pl=>pl.rows.forEach(r=>hurt(pl,r,crop(pl.crop).loss*(.5+rnd()))));
  if(fails){S.rep=clamp(S.rep-6*fails,0,100);S.ys.failed+=fails;toast('bad',fails>1?`${fails} orders never got potted`:'An order never got potted');}
  S.tasks=[];S.queue=[];me.task=null;me.path=[];staff.forEach(w=>{w.task=null;w.path=[];});
  S.crew.forEach(r=>{if(r.n<VET)r.n++;});
  S.period++;
  if(S.period>7){yearEnd();return;}
  beginPlan();
}
function beginPlan(){S.phase='plan';S.t=0;genOffers();save();hud();openSheet();askRaises();}
function askRaises(){
  const reqs=S.crew.filter(r=>r.n>0&&r.n<VET&&rnd()<.25).map(r=>({r,to:Math.round(r.wage*(1.08+rnd()*.07)/5)*5}));
  if(!reqs.length)return;
  if(window.__quiet){reqs.forEach(q=>{if(window.__noRaise)fire(q.r.id);else q.r.wage=q.to;});return;}
  let left=reqs.length;
  modal(`<h2>${reqs.length>1?'Raise requests':'A raise request'}</h2><p>Say no and they quit. They stop asking once they're up to full speed.</p>
    <div class="roles">${reqs.map((q,i)=>`<div class="role" id="rq${i}">${svgIcon(q.r.role,44)}<div class="rn"><b>${esc(q.r.name)} · ${ROLES[q.r.role].name}</b><span>Speed ${spd(q.r)}% · wants ${fmt(q.to)}/period (now ${fmt(q.r.wage)})</span></div><span class="rqb"><button class="btn sun" type="button" data-ok="${i}">Pay</button><button class="btn" type="button" data-no="${i}">Let go</button></span></div>`).join('')}</div>`);
  const done=(i,ok)=>{const q=reqs[i],el=$('rq'+i);if(!el||el.dataset.done)return;el.dataset.done=1;
    if(ok){q.r.wage=q.to;el.querySelector('.rqb').innerHTML='<b class="ok" style="color:var(--go)">Raised</b>';}
    else{fire(q.r.id);el.querySelector('.rqb').innerHTML='<b style="color:var(--bad)">Quit</b>';}
    if(--left<=0)setTimeout(()=>{closeModal();traySig='';renderSheet();renderTray();},500);};
  $('mbox').querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>done(+b.dataset.ok,true));
  $('mbox').querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>done(+b.dataset.no,false));
}
function yearEnd(){
  S.phase='done';S.period=7;S.t=PSEC;save();hud();if(window.__quiet)return;
  const y=S.ys,cost=y.plugs+y.overhead+y.crew+y.buy+(y.build||0),prof=y.rev-cost;
  modal(`<h2>Year ${S.year} is in the books</h2>
  <div class="kv"><span>Sales</span><b>${fmt(y.rev)}</b><span>Plugs and pots</span><b>${fmt(-y.plugs)}</b>${y.buy?`<span>Bought in</span><b>${fmt(-y.buy)}</b>`:''}<span>Upkeep</span><b>${fmt(-y.overhead)}</b>${y.build?`<span>Building and upgrades</span><b>${fmt(-y.build)}</b>`:''}${y.crew?`<span>Crew</span><b>${fmt(-y.crew)}</b>`:''}<span style="font-weight:700">Profit</span><b style="color:${prof<0?'var(--bad)':'var(--go)'}">${fmt(prof)}</b>
  <span>Orders shipped full</span><b>${y.full}</b><span>Shipped short</span><b>${y.short}</b><span>Missed</span><b>${y.failed}</b><span>Reputation</span><b>${Math.round(S.rep)}</b></div>
  <button class="btn go" id="nyBtn" type="button">Start year ${S.year+1}</button>`);
  $('nyBtn').onclick=()=>{nextYear();closeModal();beginPlan();};
}
function nextYear(){S.year++;S.period=0;S.plots=[];S.orders=[];S.offers=[];S.contracts=[];S.trucks=[];S.ys={rev:0,plugs:0,overhead:0,crew:0,buy:0,full:0,short:0,failed:0};}

// ---------------- drawing ----------------
const cv=$('cv'),cx=cv.getContext('2d');
let DPR=1,VW=0,VH=0,sc=1,ox=0,oy=0,iconR=26,TW=64,TH=32;
const FH=72;let camZ=0,viewTop=0,viewBot=0;
const P=(x,y,z=0)=>[ox+(x-y)*TW/2*sc,oy+(x+y)*TH/2*sc-(z-camZ)*sc];
function layout(){
  DPR=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  const top=$('hud').offsetHeight+8,bot=$('tray').offsetHeight+8,tall=VH>VW*1.2,side=S&&S.floors>1&&!tall?84:0;
  TW=tall?54:64;TH=tall?34:32;
  const pts=[[-.4,7.4,0],[9.4,-.4,0],[9.4,7.4,0],[0,0,64],[2.5,-2.7,40],[7.5,-2.7,40]];

  if(S.floors>1)L.push({d:LIFT.x+LIFT.y+1.2,f:drawLift});
  for(const w of [me,...staff]){if(w.y>=0&&w.f===viewF&&!((w.leg==='lift'||w.leg==='home')&&w.ride>0))L.push({d:w.x+w.y,f:()=>drawPerson(w,SHIRT[w.role],now)});}
  L.sort((a,b)=>a.d-b.d).forEach(o=>o.f());
  drawFront();drawLabels();drawCounts();drawFloats(now);drawIcons();
}

function hud(){
  const c=Math.min(S.period,7);

  $('hYr').innerHTML=PN.map((_,i)=>`<i><b style="width:${i<c?100:i===c?(S.phase==='run'?S.t/PSEC*100:0):0}%"></b></i>`).join('');
  $('hCash').textContent=fmt(S.cash);$('hCash').classList.toggle('neg',S.cash<0);
  $('hRep').textContent=Math.round(S.rep);

  $('bBoard').hidden=S.phase==='plan'&&!sheetOpen();

function renderFloors(){

  const up=cnt(viewF+1,9),dn=cnt(0,viewF-1);

function setFloor(f){f=clamp(f,0,S.floors-1);if(f===viewF)return;viewF=f;renderFloors();if(sheetOpen()){boardF=viewF;renderBoard();}}
$('fUp').onclick=()=>setFloor(viewF+1);$('fDn').onclick=()=>setFloor(viewF-1);
addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='PageUp')setFloor(viewF+1);if(e.key==='ArrowDown'||e.key==='PageDown')setFloor(viewF-1);});

});

addEventListener('pointerdown',e=>{if(crewPop&&!e.target.closest('#crewPop,#qC .av')){crewPop=null;renderCrewPop();}});
function toast(k,text,onTap){
  if(window.__quiet)return;
  const box=$('toasts'),tall=innerHeight>innerWidth*1.2;
  if(tall){box.classList.add('low');box.style.top='auto';box.style.bottom=($('tray').offsetHeight+8)+'px';}
  else{box.classList.remove('low');box.style.bottom='auto';box.style.top=($('hud').offsetHeight+8)+'px';}
  const el=document.createElement('div');el.className='toast'+(onTap?' tap':'');el.innerHTML=svgIcon(k,34)+`<span>${text}</span>`+(onTap?'<b class="go">Open ›</b>':'');box.prepend(el);
  if(onTap)el.addEventListener('click',()=>{el.remove();onTap();});
  while(box.children.length>(tall?2:3))box.lastChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320);},onTap?4500:2600);
}

// ---------------- sheet: orders, crew, build ----------------
let sel=null,ghostRow=-1,drag=null,tab='orders',boardF=0,suppressClick=false,placing=null,ordersView='offers';
const sheetOpen=()=>!$('sheet').hidden;
function openSheet(t){if(window.__quiet)return;$('sheet').hidden=false;if(placing)cancelPlacing(true);sel=null;ghostRow=-1;tab=t||'orders';ordersView='offers';boardF=viewF;renderSheet();hud();}
function closeSheet(){if(placing)cancelPlacing(true);$('sheet').hidden=true;sel=null;hud();}
const samePiece=(a,b)=>a&&b&&(a.plot?a.plot===b.plot:a.offer===b.offer);
const movable=pl=>!pl.done&&!pl.potted.some(Boolean)&&pl.s>=minStart();
const topFor=(pp,row)=>{const base=Math.floor(row/8)*8;return clamp(row-Math.floor(pp.h/2),base,base+8-pp.h);};
function nearestFit(pp,row){const top=topFor(pp,row),base=Math.floor(row/8)*8;if(fitsP(pp,top))return top;for(let d=1;d<8;d++){if(top-d>=base&&fitsP(pp,top-d))return top-d;if(top+d+pp.h<=base+8&&fitsP(pp,top+d))return top+d;}return -1;}
function firstFitOn(pp,f){for(let r=f*8;r<f*8+8;r++)if(fitsP(pp,r))return r;return -1;}
const span=(t,h)=>LETTERS[t]+(h>1?'–'+LETTERS[t+h-1]:'');
function aimGhost(){
  if(!sel){ghostRow=-1;return;}
  let f=firstFitOn(sel,boardF);
  if(f<0)for(let ff=0;ff<S.floors&&f<0;ff++){f=firstFitOn(sel,ff);if(f>=0){boardF=ff;viewF=ff;renderFloors();}}
  ghostRow=f<0?-1:f+Math.floor(sel.h/2);
}
function startPlacing(of){
  if(!owns(of.crop)){toast('bad',`You don't grow ${crop(of.crop).name.toLowerCase()} yet`);return;}
  placing={of,k:0,placed:[],cid:null};
  if(of.contract){const cid=S.nid++;placing.cid=cid;S.contracts.push({id:cid,cust:of.cust,crop:of.crop,n:of.n,done:0,broken:false,round:roundKey(),of});S.offers=S.offers.filter(x=>x!==of);placing.cur=delivery(of,0,cid);}
  else placing.cur=of;
  sel=piece(placing.cur);aimGhost();renderSheet();
}
function cancelPlacing(quiet){
  if(!placing)return;const P0=placing;placing=null;sel=null;ghostRow=-1;
  if(P0.of.contract){P0.placed.forEach(pl=>{S.plots=S.plots.filter(x=>x!==pl);S.orders=S.orders.filter(o=>o.id!==pl.oid);});S.contracts=S.contracts.filter(c=>c.id!==P0.cid);S.offers.push(P0.of);}
  if(!quiet){renderSheet();hud();}
}
function advancePlacing(){
  const P0=placing;P0.placed.push(S.plots[S.plots.length-1]);
  if(P0.of.contract&&P0.k<P0.of.n-1){P0.k++;P0.cur=delivery(P0.of,P0.k,P0.cid);sel=piece(P0.cur);aimGhost();return;}
  placing=null;sel=null;ghostRow=-1;
  toast('good',P0.of.contract?`Contract signed: ${P0.of.n} deliveries for ${P0.of.cust.split(' ')[0]}`:`${crop(P0.of.crop).name} placed`);
  ordersView='offers';
}
function removeContract(cid){
  const c=contractOf(cid);if(!c)return;
  const mine=S.plots.filter(p=>{const o=orderOf(p);return o&&o.contract===cid&&!p.done&&!p.potted.some(Boolean);});
  mine.forEach(p=>{S.plots=S.plots.filter(x=>x!==p);S.orders=S.orders.filter(o=>o.id!==p.oid);});
  if(c.round===roundKey()&&!S.plots.some(p=>orderOf(p)?.contract===cid)){S.contracts=S.contracts.filter(x=>x!==c);S.offers.push(c.of);toast('good','Contract back on the offers list');}
  else{c.broken=true;S.rep=clamp(S.rep-6,0,100);toast('bad','Contract cancelled, reputation −6');}
  sel=null;ghostRow=-1;renderSheet();hud();
}
function dropPiece(pp,row){
  const t=nearestFit(pp,row);
  if(t<0){toast('bad','No room for that block in those periods');return false;}
  if(pp.offer){place(pp.offer,t);if(placing)advancePlacing();else{sel=null;ghostRow=-1;}}
  else{pp.plot.rows=pp.plot.rows.map((_,i)=>t+i);sel=null;ghostRow=-1;}
  renderSheet();hud();return true;
}
function growPlot(pl,d){
  const o=orderOf(pl),h=pl.rows.length,nh=h+d,top=Math.min(...pl.rows);
  if(nh<Math.ceil(o.qty/CAP)){toast('bad','That would leave too few flats for the order');return;}
  if(nh>4){toast('bad','Four benches is the most for one order');return;}
  let nt=-1;const pp={plot:pl,crop:pl.crop,h:nh,s:pl.s,e:pl.e};
  if(d<0)nt=top;else if(fitsP(pp,top))nt=top;else if(fitsP(pp,top-1))nt=top-1;
  if(nt<0){toast('bad','No free bench next to it in those periods');return;}
  if(d>0){pl.flats.push(CAP);pl.alive.push(CAP);pl.potted.push(false);}else{pl.flats.pop();pl.alive.pop();pl.potted.pop();}
  pl.rows=Array.from({length:nh},(_,i)=>nt+i);sel=piece(pl);renderSheet();
}
function removePlot(pl){
  const o=orderOf(pl);if(o&&o.contract){removeContract(o.contract);return;}
  S.plots=S.plots.filter(p=>p!==pl);S.orders=S.orders.filter(x=>x!==o);
  if(pl.taken===roundKey()&&pl.of){S.offers.push(pl.of);toast('good','Back on the rail');}
  else{S.rep=clamp(S.rep-3,0,100);toast('bad','Order cancelled, reputation −3');}
  sel=null;ghostRow=-1;renderSheet();hud();
}
function tkHTML(of){

let sortBy='start';

    simStep(dt*speed*3);

  if(!S){fresh();genOffers();}
  else if(S.phase==='run'){S.phase='plan';S.t=0;S.trucks=[];}
  syncStaff();layout();hud();
  if(S.phase==='done')yearEnd();
  else if(!S.welcomed)welcome();
  else openSheet();
  requestAnimationFrame(frame);
  setTimeout(layout,300);
}
boot();
</script>
