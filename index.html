<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Greenhouse Year</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday game: a cozy live greenhouse sim with real stakes
   IDEA a nursery yard seen from above at an angle: office, glass houses, lots for sale, a loading dock
   PICTURE the isometric yard itself, full screen, with your grower walking between stations
   COLOUR seasonal grass and gravel, pale glass, terracotta pots, deep greenhouse green HUD, sun yellow for actions
   TYPE Outfit display + Inter text
   LAYOUT slim HUD bar on top, the yard fills the rest; menus open as sheets over the yard; bottom sheet on phone */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1913);--ink:light-dark(#14211a,#e4eee6);--mute:light-dark(#5b6a60,#9db0a3);--line:light-dark(#dfe6df,#26352c);--panel:light-dark(#f4f8f3,#15211a);--band:#143326;--leaf:light-dark(#2f7d3e,#62bd71);--terra:light-dark(#c4542a,#ec7d4e);--amber:light-dark(#a86e05,#e6ad3e);--sun:#e9b824;--sky:light-dark(#e7f1ea,#16241c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.hud{flex:none;background:var(--band);color:#eef5ee;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px max(2vw,12px);z-index:10}
.brand b{display:block;font:600 19px/1.05 Outfit,sans-serif;white-space:nowrap}
.brand small{color:#a9c4b0;font-size:13px;white-space:nowrap}
.date b{display:block;font:600 19px/1.1 Outfit,sans-serif;white-space:nowrap}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:16px;height:5px;border-radius:3px;background:#2c4d3c;overflow:hidden;display:block}
.pips i b{display:block;height:100%;background:var(--sun)}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:#1e4634;border-radius:10px;padding:3px 10px}
.stat span{display:block;font-size:12px;color:#a9c4b0;white-space:nowrap}
.stat b{font:600 17px/1.15 Outfit,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b.neg{color:#ff9d77}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.hb{min-height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid #3d6650;background:transparent;color:#eef5ee;font-weight:600;font-size:14px}
.hb.on,.hb.play{background:var(--sun);color:#1f1a05;border-color:var(--sun)}
.seg2{display:inline-flex;border:1px solid #3d6650;border-radius:10px;overflow:hidden}
.seg2 button{min-height:40px;min-width:40px;border:0;background:transparent;color:#cfe0d3;font-size:14px}
.seg2 button.on{background:#2c4d3c;color:#fff}
.fcchip{font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;background:#24503b;color:#d8eadf}
.fcchip.warn{background:#7a2e16;color:#ffd9c9}
.stage{flex:1;position:relative;overflow:hidden;background:var(--sky)}
canvas{display:block;touch-action:none;cursor:pointer}
.toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:15;pointer-events:none;width:min(92%,560px)}
.toast{background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-size:14px;box-shadow:0 4px 0 rgba(0,0,0,.12);text-align:center}
.toast.alert{border-color:var(--terra)}
.toast.good{border-color:var(--leaf)}
.holding{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:14;background:var(--bg);border:2px solid var(--sun);border-radius:16px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;width:min(94%,640px);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.holding p{margin:0;font-size:14px;flex:1;min-width:14em}
.alerts{position:absolute;left:12px;bottom:12px;z-index:12;display:flex;flex-direction:column;gap:6px;max-width:min(70%,340px)}
.alerts button{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:13px;text-align:left;display:flex;gap:8px;align-items:center}
.alerts button.alert{border-color:var(--terra)}
.alerts i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;font-style:normal;font-weight:700;font-size:13px;color:#fff;flex:none}
.zoom{position:absolute;right:12px;bottom:12px;z-index:12;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:20px;font-weight:600}
.modal{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(8,20,14,.32)}
.sheet{background:var(--bg);border:2px solid var(--line);border-radius:18px;width:min(100%,900px);max-height:100%;overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.shead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 18px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.shead h2{font:600 24px/1.1 Outfit,sans-serif;margin:0;flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-top:4px}
.tabs button{min-height:38px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);font-weight:600;font-size:14px;position:relative}
.tabs button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.tabs button .n{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--terra);color:#fff;font-size:12px;margin-left:6px;padding:0 5px}
.sbody{padding:16px 18px 20px}
.btn{font-weight:600;min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--sun);color:#1f1a05;white-space:nowrap;box-shadow:0 3px 0 #b48c10}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b48c10}
.btn.go{background:var(--leaf);color:#fff;box-shadow:0 3px 0 #1f5a2b}
.btn.line{background:var(--bg);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.red{background:var(--terra);color:#fff;box-shadow:0 3px 0 #8a3417}
.btn:disabled{opacity:.45;cursor:default}
.mini{min-height:36px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-size:14px;font-weight:600;white-space:nowrap}
.hint{color:var(--mute);margin:0 0 12px;font-size:15px}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--mute) 14%,transparent);color:var(--mute)}
.chip.ok{color:var(--leaf);background:color-mix(in srgb,var(--leaf) 14%,transparent)}
.chip.tight{color:var(--amber);background:color-mix(in srgb,var(--amber) 15%,transparent)}
.chip.short{color:var(--terra);background:color-mix(in srgb,var(--terra) 13%,transparent)}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));gap:12px}
.ticket{border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--bg);box-shadow:0 3px 0 var(--line);align-content:start}
.tk1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cb{color:#fff;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.tkwk{font-size:14px;font-weight:600;white-space:nowrap}
.tk2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tk2 b{font:600 32px/1 Outfit,sans-serif}
.tk2 span{color:var(--mute);font-size:14px}
.tk3{font-size:14px;line-height:1.35}
.tk3 small{display:block;color:var(--mute);font-size:13px}
.tkb{display:flex;gap:8px}
.tkb .btn,.tkb .mini{flex:1}
.cfg{display:grid;gap:10px;background:var(--panel);border-radius:12px;padding:10px}
.cfg label{font-size:13px;font-weight:600;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.opts{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.opts button{min-height:36px;min-width:48px;padding:0 10px;border:0;background:transparent;font-size:14px;color:var(--mute);font-weight:600;white-space:nowrap}
.opts button.on{background:var(--leaf);color:#fff}
.opts button:disabled{cursor:default;opacity:.7}
.cfg p{margin:0;font-size:13px;color:var(--mute)}
.cfg p.wn{color:var(--terra)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--mute);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.off td{opacity:.45}
.scroll{overflow-x:auto}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.sc{display:flex;align-items:center;gap:8px;white-space:nowrap}
.sc i{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.sc i i{display:block;height:100%}
.up{color:var(--leaf)}.dn{color:var(--terra)}
.empty{color:var(--mute);font-size:15px}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(15em,1fr));gap:10px;margin:8px 0 16px}
.gcard{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.gcard.wide{grid-column:1/-1}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.gh b{font:600 18px/1.2 Outfit,sans-serif}
.gh span{font-weight:600;white-space:nowrap}
.gstats{display:grid;gap:4px}
.gs{display:grid;grid-template-columns:8.5em minmax(0,1fr) 1.6em;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.gs i{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.gs i i{height:100%;background:var(--leaf)}
.gs b{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.gback{font-size:13px;color:var(--leaf)}
.gm td,.gm th{text-align:center}
.gm td:first-child,.gm th:first-child{text-align:left}
.gm input{width:22px;height:22px;accent-color:var(--leaf)}
.grow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.grow label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mute)}
.grow input{width:6.5em;font:16px Inter,sans-serif;min-height:40px;padding:0 8px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.gcost{font-size:14px;color:var(--mute);margin:0}
.err{color:var(--terra);font-size:13px;margin:0}
.sh{display:block;font-weight:600;margin:6px 0}
.tasks{font-size:14px;color:var(--mute);margin:0 0 10px;padding-left:18px}
.pnl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px}
.sw{display:grid;gap:8px}
.swr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.swr>span{font-size:14px;font-weight:600}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.gauge{background:var(--panel);border-radius:12px;padding:8px 10px}
.gauge span{display:block;font-size:12px;color:var(--mute)}
.gauge b{display:block;font:600 22px/1.15 Outfit,sans-serif;white-space:nowrap}
.gauge.bad b{color:var(--terra)}
.pm{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.pm>i{display:block;height:100%}
.fchart{position:relative;height:170px;border-radius:12px;background:var(--panel);overflow:hidden}
.fchart svg{position:absolute;inset:0;width:100%;height:100%}
.fy{position:absolute;left:6px;font-size:12px;color:var(--mute)}
.fdays{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--mute);text-align:center;margin-top:4px}
.flegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mute);margin:6px 0 10px}
.flegend span{display:inline-flex;align-items:center;gap:5px}
.flegend i{display:inline-block;width:14px;height:8px;border-radius:2px}
.warnlist{list-style:none;padding:0;margin:10px 0 0;font-size:14px}
.warnlist li{padding:6px 0;border-top:1px solid var(--line);color:var(--terra)}
.crewl{font-size:14px;margin:0 0 10px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(8em,1fr));gap:10px;margin:12px 0}
.figs b{display:block;font:600 clamp(22px,3vw,32px)/1.1 Outfit,sans-serif;white-space:nowrap}
.figs span{font-size:13px;color:var(--mute)}
.rgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.log{list-style:none;padding:0;margin:0;font-size:14px}
.log li{padding:6px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:3.6em 1fr;gap:8px}
.log li b{font-weight:500;color:var(--mute)}
.log li.alert,.log li.warn{color:var(--terra)}
.log li.good{color:var(--leaf)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:10px;margin:12px 0 16px;padding:0;list-style:none}
.how li{background:var(--panel);border-radius:12px;padding:10px 12px;font-size:14px}
.how b{display:block;font:600 16px/1.2 Outfit,sans-serif;margin-bottom:2px}
@media(max-width:760px){.pnl,.rgrid{grid-template-columns:minmax(0,1fr)}.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.alerts{flex-direction:row;flex-wrap:wrap;max-width:70%}.alerts button{padding:6px}.alerts .at{display:none}.alerts i{width:26px;height:26px}.toast{font-size:13px;padding:6px 10px}.hud{gap:6px 10px;padding:6px 10px}.brand{display:none}.stat{padding:2px 8px}.stat b{font-size:15px}.date b{font-size:16px}.pips i{width:11px}.ctl{margin-left:0}.hb{min-height:38px}.modal{align-items:flex-end;padding:0}.sheet{border-radius:18px 18px 0 0;max-height:88%}.alerts{max-width:62%}.holding{bottom:10px;left:10px;transform:none;width:calc(100% - 76px)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="brand"><b>Greenhouse Year</b><small id="hYear">Year 1</small></div>
    <div class="date"><b id="hDate">Week 1</b><div class="pips" id="pips"></div></div>
    <span class="fcchip" id="hFc"></span>
    <div class="stats">
      <div class="stat"><span>Cash</span><b id="hCash">$0</b></div>
      <div class="stat"><span>Year profit</span><b id="hProfit">$0</b></div>
      <div class="stat"><span>Goodwill</span><b id="hGw">0</b></div>
    </div>
    <div class="ctl">
      <button class="hb play" id="bPlay" type="button">Play</button>
      <div class="seg2" id="speed"><button type="button" data-sp="1">1x</button><button type="button" data-sp="2">2x</button><button type="button" data-sp="4">4x</button></div>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Your nursery yard. Click or tap to walk."></canvas>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="alerts" id="alerts"></div>
    <div class="zoom"><button type="button" id="zIn" aria-label="Zoom in">+</button><button type="button" id="zOut" aria-label="Zoom out">&minus;</button></div>
    <div class="holding" id="holding" hidden></div>
    <div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="shead"><h2 id="mTitle"></h2><button class="mini" type="button" id="mClose">Close</button><nav class="tabs" id="mTabs"></nav></div><div class="sbody" id="mBody"></div></div></div>
  </div>
</div>
<script>
{
/* ================= constants ================= */
const K=3,VER=6,WEEKS=52,DAYS=7,AGE=.12,AGELOSS=.03,HOUSE_COST=9000,BUILD_WEEKS=2,FPC=2,WEEK_SEC=15;
const CROPS={
  petunia:{name:'Petunia',grow:8,loss:.08,lo:58,hi:80,cost:30,price:180,season:[10,20],shelf:3,color:'#b8417f'},
  geranium:{name:'Geranium',grow:12,loss:.10,lo:55,hi:78,cost:42,price:255,season:[14,22],shelf:4,color:'#cf3d32'},
  begonia:{name:'Begonia',grow:10,loss:.09,lo:62,hi:82,cost:36,price:216,season:[14,24],shelf:3,color:'#d9772f'},
  pothos:{name:'Pothos',grow:14,loss:.05,lo:65,hi:88,cost:48,price:285,season:[18,50],shelf:6,color:'#2f8a45'},
  mum:{name:'Mum',grow:11,loss:.10,lo:58,hi:78,cost:39,price:234,season:[34,42],shelf:2,color:'#c99a12'},
  poinsettia:{name:'Poinsettia',grow:16,loss:.12,lo:65,hi:80,cost:60,price:390,season:[46,50],shelf:2,color:'#a3223b'}
};
const NAMES=['Hillside Garden Center','Cedar Creek Nursery','Prairie Bloom Market','Mesquite Feed & Garden','Lakeview Florist','Red Dirt Landscaping','Sunrise Grocery','Caprock Home & Garden','Old Mill Farm Stand','Bluebonnet Greenery','Windmill Hardware','Clear Fork Florist','Big Sky Plant Co.','Pecan Street Market'];
const MAIN={name:'Main house',dT:0,gain:1,heatMul:1,pestIn:0,desc:'Your original house. No surprises.'};
const TRAITS=[
  {name:'North house',dT:-3,gain:1,heatMul:1.15,pestIn:0,desc:'Shaded by the windbreak: runs about 3°F cooler and costs more to heat.'},
  {name:'Low house',dT:0,gain:1,heatMul:1,pestIn:1.5,desc:'Sits low by the ditch, so more pests drift in.'},
  {name:'Old glass house',dT:0,gain:1.3,heatMul:1.3,pestIn:0,desc:'Older glazing: hotter in the sun and costlier to heat.'},
  {name:'Gutter house',dT:1.5,gain:1,heatMul:.9,pestIn:.5,desc:'Built tight to the main house: a little warmer and cheaper to heat.'}
];
const MONTHL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const SW=[['heat','Heater',['Off','Low','High']],['vent','Roof vents',['Closed','Open']],['cool','Fans + wet wall',['Off','On']],['shade','Shade cloth',['Off','On']],['water','Irrigation',['Low','Normal','High']],['bugs','Beneficial insects',['Off','On']]];
const TASKS=[['mgmt','Greenhouse management','Greenhouse'],['crop','Crop management','Crops'],['maint','Maintenance','Maintenance']];
const THOURS={mgmt:1,crop:2,maint:1},TSTAT={mgmt:'exp',crop:'hort',maint:'eth'};
const STATS=[['exp','Experience'],['eth','Work ethic'],['hort','Hort knowledge']];
const GNAMES=['Alex','Sam','Jordan','Casey','Riley','Morgan','Jamie','Avery','Taylor','Quinn','Drew','Robin','Reese','Skyler','Emerson','Rowan'];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fl=n=>n===1?'flat':'flats';
const qual=a=>a<=0?1:Math.max(.4,1-AGE*a);
const keep=h=>{let k=1;for(let a=1;a<=h;a++)k*=1-AGELOSS*a;return k;};
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let S;

/* ================= world ================= */
const MW=32,MH=24,T={GRASS:0,PATH:1,ROAD:2,FLOOR:3,BENCH:4,WALL:5,DOOR:6,OFFICE:7,TREE:8,LOT:9};
const LOTS=[{key:'main',x:5,y:2,w:13,h:9,door:'s'},{key:'a',x:20,y:2,w:11,h:9,door:'s'},{key:'b',x:5,y:13,w:11,h:9,door:'n'}];
const OFFICE={x:1,y:17,w:3,h:3,st:{x:4,y:18}};
const TREES=[[0,7],[0,9],[2,4],[1,1],[3,2],[2,14],[0,21],[17,15],[17,19],[23,15],[27,17],[30,14],[26,19],[13,0],[8,0],[30,0],[0,15]];
const GEO={};
LOTS.forEach(L=>{
  const dx=L.x+Math.floor(L.w/2),s=L.door==='s';
  const door={x:dx,y:s?L.y+L.h-1:L.y},appr={x:dx,y:s?L.y+L.h:L.y-1};

const BCOL={cold:'#3d7fd6',hot:'#d8502a',water:'#2f9bd0',bug:'#6b5530',age:'#c99a12',block:'#c4542a',offer:'#e9b824'};
function bubble(x,y,k){
  const r=15;cx.fillStyle='#fff';cx.strokeStyle=BCOL[k];cx.lineWidth=3;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();cx.stroke();
  cx.beginPath();cx.moveTo(x-5,y+r-2);cx.lineTo(x,y+r+7);cx.lineTo(x+5,y+r-2);cx.fill();
  cx.strokeStyle=BCOL[k];cx.fillStyle=BCOL[k];cx.lineWidth=2.4;cx.lineCap='round';
  if(k==='cold'){for(let a=0;a<3;a++){const c=Math.cos(a*Math.PI/3),s=Math.sin(a*Math.PI/3);cx.beginPath();cx.moveTo(x-c*8,y-s*8);cx.lineTo(x+c*8,y+s*8);cx.stroke();}}
  else if(k==='hot'){cx.beginPath();cx.arc(x,y,5,0,7);cx.fill();for(let a=0;a<8;a++){const c=Math.cos(a*Math.PI/4),s=Math.sin(a*Math.PI/4);cx.beginPath();cx.moveTo(x+c*7.5,y+s*7.5);cx.lineTo(x+c*10,y+s*10);cx.stroke();}}
  else if(k==='water'){cx.beginPath();cx.moveTo(x,y-9);cx.quadraticCurveTo(x+8,y+2,x,y+7);cx.quadraticCurveTo(x-8,y+2,x,y-9);cx.fill();}
  else if(k==='bug'){cx.beginPath();cx.ellipse(x,y+1,5,7,0,0,7);cx.fill();cx.beginPath();cx.arc(x,y-7,3.5,0,7);cx.fill();for(const s of [-1,1]){cx.beginPath();cx.moveTo(x+s*4,y-1);cx.lineTo(x+s*9,y-4);cx.moveTo(x+s*4,y+4);cx.lineTo(x+s*9,y+7);cx.stroke();}}
  else if(k==='age'){cx.beginPath();cx.moveTo(x-6,y-8);cx.lineTo(x+6,y-8);cx.lineTo(x-6,y+8);cx.lineTo(x+6,y+8);cx.closePath();cx.stroke();cx.beginPath();cx.moveTo(x-3,y+6);cx.lineTo(x+3,y+6);cx.lineTo(x,y+1);cx.fill();}
  else{cx.font='800 18px Inter,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('!',x,y+1);}
  cx.lineCap='butt';
}

/* ================= player, NPCs, camera ================= */
let path=[],pending=null,moving=false;
function walkTo(tx,ty,then){
  const sx=Math.floor(S.player.x),sy=Math.floor(S.player.y),p=findPath(sx,sy,tx,ty);
  if(p==null){toast(`Can't get there from here.`,'alert');return;}
  path=p;pending=then||null;camFollow=true;if(!p.length&&then){pending=null;then();}
}
function movePlayer(dt){
  moving=false;if(!path.length)return;
  let rem=dt*4.4;
  while(rem>0&&path.length){
    const [tx,ty]=path[0],gx=tx+.5,gy=ty+.5,dx=gx-S.player.x,dy=gy-S.player.y,dist=Math.hypot(dx,dy);
    if(dist<=rem){S.player.x=gx;S.player.y=gy;rem-=dist;path.shift();}else{S.player.x+=dx/dist*rem;S.player.y+=dy/dist*rem;rem=0;}
  }
  moving=true;
  if(!path.length&&pending){const f=pending;pending=null;f();}
}
let npcs=[];
function syncNPCs(){
  const w=Math.min(S.week,WEEKS),act=S.phase==='run'?S.growers.filter(g=>g.from<=w&&w<=g.to&&gHours(g)>0):[];
  npcs=npcs.filter(n=>act.some(g=>g.id===n.id));
  act.forEach(g=>{if(!npcs.some(n=>n.id===g.id))npcs.push({id:g.id,name:g.name,x:OFFICE.st.x+.5,y:OFFICE.st.y+.5,path:[],wait:0,moving:false});});
}
function moveNPCs(dt){
  npcs.forEach(n=>{
    n.moving=false;
    if(!n.path.length){n.wait-=dt;if(n.wait>0)return;
      const g=S.growers.find(x=>x.id===n.id);if(!g)return;
      const hs=Object.keys(g.assign).map(Number).map(houseOf).filter(h=>h&&!h.building&&TASKS.some(([k])=>g.assign[h.id][k]));
      if(!hs.length)return;const h=hs[Math.floor(Math.random()*hs.length)],G=GEO[h.lot];
      const aisles=[];for(let y=G.y+1;y<G.y+G.h-1;y++)for(let x=G.x+1;x<G.x+G.w-1;x++)if(MAP[y][x]===T.FLOOR)aisles.push([x,y]);
      const t=aisles[Math.floor(Math.random()*aisles.length)];const p=findPath(Math.floor(n.x),Math.floor(n.y),t[0],t[1]);n.path=p||[];n.wait=1+Math.random()*3;return;}
    let rem=dt*2.6;
    while(rem>0&&n.path.length){const [tx,ty]=n.path[0],gx=tx+.5,gy=ty+.5,dx=gx-n.x,dy=gy-n.y,d=Math.hypot(dx,dy);if(d<=rem){n.x=gx;n.y=gy;rem-=d;n.path.shift();}else{n.x+=dx/d*rem;n.y+=dy/d*rem;rem=0;}}
    n.moving=true;
  });
}
function updateCam(dt){
  const k=Math.min(1,dt*4.5);
  if(camTarget){cam.x+=(camTarget.x-cam.x)*k;cam.y+=(camTarget.y-cam.y)*k;zoom+=(camTarget.z-zoom)*k;return;}
  if(zoomGoal!=null){zoom+=(zoomGoal-zoom)*k;if(Math.abs(zoomGoal-zoom)<.004){zoom=zoomGoal;zoomGoal=null;}}
  if(!camFollow)return;
  const tx=wx(S.player.x,S.player.y),ty=wy(S.player.x,S.player.y,0)-40;
  cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
}
function frameHouses(){
  const hs=activeH();if(!hs.length)return;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  hs.forEach(h=>{const g=GEO[h.lot];[[g.x,g.y],[g.x+g.w,g.y],[g.x,g.y+g.h],[g.x+g.w,g.y+g.h]].forEach(([x,y])=>{const X=wx(x,y);x0=Math.min(x0,X);x1=Math.max(x1,X);y0=Math.min(y0,wy(x,y,WH+RH));y1=Math.max(y1,wy(x,y,0));});});
  const band=VW<600?170:120,availH=Math.max(160,VH-band-30),z=clamp(Math.min((VW-40)/(x1-x0),availH/(y1-y0)),.4,1.3);
  if(zoomBefore==null)zoomBefore=zoom;
  camTarget={x:(x0+x1)/2,y:(y0+y1)/2+band/2/z,z};camFollow=false;
}
function endFraming(){camTarget=null;camFollow=true;if(zoomBefore!=null){zoomGoal=zoomBefore;zoomBefore=null;}}

/* ================= warnings ================= */
function houseWarn(h){
  if(!h||h.building||S.phase!=='run')return[];
  const w=S.week,fc=S.fc,out=[],cf=comfort(houseCrops(h,w));
  if(fc&&cf){
    const lo=climate(w,fc.fOut-5,h.sw,h),hi=climate(w,fc.fOut+5,h.sw,h);
    if(lo<cf.lo-1)out.push({k:'cold',t:`${h.name}: could drop to ${Math.round(lo)}°F this week; crops need ${Math.round(cf.lo)}°F or warmer.`});
    if(hi>cf.hi+1)out.push({k:'hot',t:`${h.name}: could reach ${Math.round(hi)}°F this week; crops want ${Math.round(cf.hi)}°F or cooler.`});
    if(fc.warn){const sh=climate(w,fc.fOut+(fc.warnKind==='cold'?-16:9),h.sw,h);if(sh<cf.lo||sh>cf.hi)out.push({k:fc.warnKind==='cold'?'cold':'hot',t:`${h.name}: if the ${fc.warnKind==='cold'?'cold front':'heat wave'} hits, it could reach ${Math.round(sh)}°F.`});}
    if(h.tin!=null&&(h.tin<cf.lo||h.tin>cf.hi))out.push({k:h.tin<cf.lo?'cold':'hot',t:`${h.name} is ${Math.round(h.tin)}°F right now, outside what its crops like.`});
    const m=moisture(climate(w,fc.fOut,h.sw,h),h.sw);if(m.label!=='Good')out.push({k:'water',t:`${h.name}: watering looks ${m.label.toLowerCase()} at these settings.`});
  }
  if(h.pest>=35)out.push({k:'bug',t:`${h.name}: pest pressure is ${h.pest>=60?'severe':'high'}.`});
  const aged=S.batches.filter(b=>b.house===h.id&&b.status==='ready'&&w-b.readyWeek>=1);
  if(aged.length)out.push({k:'age',t:`${h.name}: ${aged.reduce((a,b)=>a+b.units,0)} flats are past prime and losing value.`});
  if(S.batches.some(b=>b.house===h.id&&b.blocked))out.push({k:'block',t:`${h.name}: a plot can't be potted because old plants are in the way.`});
  return out;
}

let hold=null,selPlot=null,drag=null;
function benchAt(mx,my){
  const [x,y]=toTile(mx,my,14);
  if(tileAt(x,y)===T.BENCH){const h=houseAtTile(x,y);if(h){const i=GEO[h.lot].cells.findIndex(c=>c.x===x&&c.y===y);if(i>=0)return{h,i};}}
  return null;
}
function hoverUpdate(mx,my){
  const b=benchAt(mx,my);
  if(hold&&b){const f=plotFit(b.h,b.i,hold.plan);hover={h:b.h.id,cells:f.cells,ok:f.ok};}else hover=null;
  const [x,y]=toTile(mx,my,0);hoverTile=[x,y];
}
function clickAt(mx,my){
  for(const bb of bubbles)if(Math.hypot(mx-bb.x,my-bb.y)<=bb.r+4){bb.act();return;}
  const b=benchAt(mx,my);
  if(hold){
    if(!b){toast('Click a bench inside a greenhouse to place this plot.','info');return;}
    const f=plotFit(b.h,b.i,hold.plan);
    if(!f.ok){hover={h:b.h.id,cells:f.cells,ok:false};toast(f.why,'alert');return;}
    const c=cellOf(b.h,b.i),ay=MAP[c.y+1]&&MAP[c.y+1][c.x]===T.FLOOR?c.y+1:c.y-1;
    const inside=houseAtTile(Math.floor(S.player.x),Math.floor(S.player.y))===b.h;
    if(inside)placePlot(b.h,b.i);else walkTo(c.x,ay,()=>{if(hold)placePlot(b.h,b.i);});
    return;
  }
  if(b){const pb=cellNow(b.h.id,b.i)||S.batches.find(z=>z.house===b.h.id&&z.status==='planned'&&z.cells.includes(b.i));
    if(pb){selPlot=pb.id;openPlot(pb);return;}
    const c=cellOf(b.h,b.i);walkTo(c.x,MAP[c.y+1][c.x]===T.FLOOR?c.y+1:c.y-1);return;}
  const [x,y]=toTile(mx,my,0),t=tileAt(x,y);
  if(t===T.OFFICE||(x===OFFICE.st.x&&y===OFFICE.st.y)){goComputer();return;}
  const h=houseAtTile(x,y);
  if(h&&!h.building){const g=GEO[h.lot];
    if((x===g.pwall.x&&y===g.pwall.y)||(x===g.pst.x&&y===g.pst.y)){goPanel(h);return;}
    if(t===T.WALL){walkTo(g.door.x,g.door.y);return;}}
  const lot=lotAtTile(x,y);
  if(lot&&(!h||h.building)){goLot(lot);return;}
  if(walk(x,y))walkTo(x,y);
}
function goComputer(tab){walkTo(OFFICE.st.x,OFFICE.st.y,()=>openComputer(tab));}
function goPanel(h){const g=GEO[h.lot];walkTo(g.pst.x,g.pst.y,()=>openPanel(h));}
function goLot(L){const g=GEO[L.key];walkTo(g.appr.x,g.appr.y,()=>openLot(L));}

function toast(t,k){
  const el=document.createElement('div');el.className='toast '+(k||'');el.textContent=t;
  const box=$('toasts');box.prepend(el);while(box.children.length>(VW<600?2:3))box.lastChild.remove();
  if(!still)el.animate([{opacity:0,transform:'translateY(-16px) scale(.9)'},{opacity:1,transform:'none'}],{duration:260,easing:'cubic-bezier(.2,1.4,.4,1)'});
  setTimeout(()=>{const a=el.animate([{opacity:1},{opacity:0,transform:'translateY(-10px)'}],{duration:still?1:300});a.onfinish=()=>el.remove();},k==='alert'?6500:4200);
}
let alertsKey='';
function renderAlerts(){
  const list=[];activeH().forEach(h=>houseWarn(h).forEach(x=>list.push({...x,h})));
  const key=list.map(x=>x.k+x.h.id).join(',');if(key===alertsKey)return;alertsKey=key;
  $('alerts').innerHTML=list.slice(0,VW<600?5:3).map((x,i)=>`<button type="button" data-al="${i}" title="${esc(x.t)}" aria-label="${esc(x.t)}" class="${['cold','hot','bug','block'].includes(x.k)?'alert':''}"><i style="background:${BCOL[x.k]}">!</i><span class="at">${esc(x.t)}</span></button>`).join('');
  $('alerts').onclick=e=>{const b=e.target.closest('[data-al]');if(b)goPanel(list[+b.dataset.al].h);};

/* ---- computer ---- */
let cfg={};
function openComputer(tab){mTab=tab||(S.orders.some(o=>o.status==='offer')?'offers':'orders');openModal('computer','Office computer');renderComputer();}
function renderComputer(){
  const nOff=S.orders.filter(o=>o.status==='offer').length,nNeed=S.orders.filter(o=>o.status==='open'&&!S.batches.some(b=>b.orderId===o.id&&b.status!=='done')).length;

  else if(mTab==='crew'){B.innerHTML=`<ul class="tasks"><li><b>Greenhouse management</b> runs on experience: they set the house's switches each week, and the most experienced read the forecast perfectly.</li><li><b>Crop management</b> runs on horticultural knowledge: lower pest pressure and fewer losses on crops waiting past prime.</li><li><b>Maintenance</b> runs on work ethic: when the weather breaks out of the forecast range, the house holds closer to good temperatures.</li></ul><div id="growers"></div>`;renderGrowers();}
  else B.innerHTML=booksHTML();
}
function cfgOf(o){return cfg[o.id]||(cfg[o.id]={buf:10,early:0});}
function offersHTML(){
  const os=S.orders.filter(o=>o.status==='offer').sort((a,b)=>a.ship-b.ship);
  if(!os.length)return`<p class="empty">No open offers right now. New customers send offers at the start of each year.</p>`;
  return`<p class="hint">Pick an offer and plan its plot, then place it on a greenhouse bench. Placing the plot accepts the order. Declining costs a little goodwill; offers expire once it's too late to pot them.</p><div class="tickets">${os.map(o=>{
    const C=CROPS[o.crop],c=cust(o.custId),k=cfgOf(o),p=plotPlan(o,k.buf,k.early),exp=o.ship-C.grow-1;
    return`<div class="ticket" data-o="${o.id}"><div class="tk1"><span class="cb" style="background:${C.color}">${C.name}</span><span class="tkwk">Pickup wk ${o.ship}</span></div>
      <div class="tk2"><b>${o.qty}</b><span>flats at $${o.price} · ${fmt(o.qty*o.price)}</span></div>
      <div class="tk3">${esc(o.cust)}<small>goodwill ${Math.round(c?c.score:0)} · offer expires after week ${exp}</small></div>
      <div class="cfg">
        <label>Extra flats for losses<span class="opts">${[0,10,20].map(v=>`<button type="button" data-buf="${o.id}|${v}" class="${k.buf===v?'on':''}">${v}%</button>`).join('')}</span></label>
        <label>Pot early<span class="opts">${[0,1,2].map(v=>`<button type="button" data-early="${o.id}|${v}" class="${k.early===v?'on':''}">${v?v+' wk':'No'}</button>`).join('')}</span></label>

        ${p.late?`<p class="wn">Ready ${p.late} week${p.late>1?'s':''} after pickup: this order would ship short.</p>`:''}
        ${k.early?`<p>Ready ${k.early} wk before pickup: safer against delays, but plants lose value while they wait.</p>`:''}
      </div>
      <div class="tkb"><button class="btn" type="button" data-take="${o.id}">Plan plot</button><button class="mini" type="button" data-decline="${o.id}">Decline</button></div></div>`;}).join('')}</div>`;

function ordersHTML(){
  const os=S.orders.filter(live).sort((a,b)=>dueW(a)-dueW(b));

    const C=CROPS[o.crop],b=S.batches.find(z=>z.orderId===o.id&&z.status!=='done'),h=b&&houseOf(b.house);

    if(o.status==='shipped'){st=`Shipped ${o.filled}/${o.qty}${o.filled&&o.value<.995?` at ${Math.round(o.value*100)}%`:''}`;k=o.filled>=o.qty?'ok':'short';}
    else if(!b){st='Needs a plot';k='short';}
    else{const e=projUnits(b),r=readyAt(b);st=b.status==='planned'?`Pots wk ${b.start}${b.blocked?', blocked':''}`:b.status==='growing'?`Growing, ready ~wk ${r}`:`Ready, ${b.units} flats`;k=b.blocked||r>dueW(o)?'short':e>=o.qty-.01?'ok':'tight';}

  <table><tbody>${[['Plants',S.cost.plants],['Heating',S.cost.heat],['Cooling',S.cost.cool],['Pest control',S.cost.pest],['Overhead',S.cost.overhead],['Growers',S.cost.labor],['Building',S.cost.build]].map(([l,v])=>`<tr><td>${l}</td><td class="n">${fmt(v||0)}</td></tr>`).join('')}</tbody></table></div>
  <details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600">Grower's log</summary><ul class="log">${S.log.slice(0,80).map(l=>`<li class="${l.k}"><b>Wk ${l.w}</b><span>${esc(l.t)}</span></li>`).join('')}</ul></details>`;

function takeOrder(id){
  const o=order(id);if(!o)return;const k=cfgOf(o),p=plotPlan(o,k.buf,k.early);
  hold={orderId:id,plan:p};
  if(activeH().every(h=>!GEO[h.lot].cells.some((c,i)=>plotFit(h,i,p).ok))){toast('No bench has room for this plot during those weeks. Build space, or decline.','alert');}
  closeModal();renderHold();frameHouses();
}
function renderHold(){
  const el=$('holding');

  const o=order(hold.orderId),p=hold.plan,C=CROPS[o.crop];

/* ---- growers (crew tab) ---- */
let draft=null;
function statBars(g){return STATS.map(([k,l])=>`<div class="gs"><span>${l}</span><i><i style="width:${g[k]*10}%"></i></i><b>${g[k]}</b></div>`).join('');}
function matrix(assign,tag,lock){
  return`<div class="scroll"><table class="gm"><thead><tr><th>House</th>${TASKS.map(t=>`<th>${t[2]}</th>`).join('')}<th class="n">Hours/wk</th></tr></thead><tbody>${S.houses.map(h=>{
    const a=assign[h.id]||{},hrs=TASKS.reduce((x,[k])=>x+(a[k]?THOURS[k]:0),0);
    return`<tr><td>${esc(h.name)}${h.building?' (building)':''}</td>${TASKS.map(([k,l])=>`<td><input type="checkbox" data-gt="${tag}|${h.id}|${k}" ${a[k]?'checked':''} ${lock?'disabled':''} aria-label="${esc(h.name)}: ${l}"></td>`).join('')}<td class="n">${hrs}</td></tr>`;}).join('')}</tbody></table></div>`;
}
function renderGrowers(){
  const el=$('growers');if(!el)return;const ae=document.activeElement;
  if(el.contains(ae)&&ae.tagName==='INPUT'&&ae.type==='number')return;
  const done=S.phase==='done',w=Math.min(S.week,WEEKS);let h='';
  if(S.growers.length){
    h+=`<b class="sh">On contract</b><div class="gcards">${S.growers.map(g=>{
      const over=done||g.to<w,on=!over&&g.from<=w,hrs=gHours(g),wc=hrs*g.rate,left=over?0:g.to-Math.max(g.from,w)+1;
      const st=over?'Contract finished':g.from>w?`Starts week ${g.from}`:'On the job';
      return`<div class="gcard wide"><div class="gh"><b>${esc(g.name)}</b><span class="chip ${on?'ok':''}">${st}</span></div><div class="gstats">${statBars(g)}</div>${matrix(g.assign,'g'+g.id,over)}
      <div class="grow"><label>Weeks ${g.from} through<input type="number" min="${w}" max="52" value="${g.to}" data-gto="${g.id}" ${over?'disabled':''}></label><p class="gcost">${hrs} h/wk at $${g.rate}/hr = ${fmt(wc)}/wk${left?` · ${fmt(wc*left)} still to pay`:''}</p>${over?'':`<button class="mini" type="button" data-gend="${g.id}">${g.from>w?'Cancel contract':'End contract now'}</button>`}</div></div>`;}).join('')}</div>`;
  }
  h+=`<b class="sh">Available this year</b>`;
  if(!S.pool.length)h+=`<p class="empty">Nobody else is looking for work right now. New growers come around next year.</p>`;
  else h+=`<div class="gcards">${S.pool.map(p=>{
    if(draft&&draft.pid===p.id)return`<div class="gcard wide"><div class="gh"><b>${esc(p.name)}</b><span>$${p.rate}/hr</span></div><div class="gstats">${statBars(p)}</div>
      <div class="grow"><label>From week<input type="number" min="${w}" max="52" value="${draft.from}" data-df="1"></label><label>Through week<input type="number" min="${w}" max="52" value="${draft.to}" data-dt="1"></label></div>
      ${matrix(draft.assign,'d',false)}<p class="gcost" id="dprev"></p><p class="err" id="dErr"></p>
      <div class="grow"><button class="btn" type="button" data-hireok="1">Sign contract</button><button class="mini" type="button" data-hirex="1">Cancel</button></div></div>`;
    return`<div class="gcard"><div class="gh"><b>${esc(p.name)}</b><span>$${p.rate}/hr</span></div>${p.back?'<small class="gback">Worked for you last year</small>':''}<div class="gstats">${statBars(p)}</div><button class="mini" type="button" data-hire="${p.id}" ${done?'disabled':''}>Hire</button></div>`;}).join('')}</div>`;
  el.innerHTML=h;if(draft)draftPreview();
}
function draftPreview(){
  const p=S.pool.find(x=>x.id===draft.pid);if(!p||!$('dprev'))return;
  const hrs=gHours(draft),n=Math.max(0,draft.to-draft.from+1);
  $('dprev').textContent=`${hrs} h/wk at $${p.rate}/hr = ${fmt(hrs*p.rate)}/wk, about ${fmt(hrs*p.rate*n)} over ${n} week${n===1?'':'s'}. Each house and task adds paid hours.`;
}

/* ---- control panel ---- */
function openPanel(h){mHouse=h.id;mTab=null;$('mTabs').innerHTML='';openModal('panel',`${h.name} control panel`);renderPanel();}
function renderPanel(){
  const h=houseOf(mHouse);if(!h){closeModal();return;}
  const w=Math.min(S.week,WEEKS),fc=S.fc,run=S.phase==='run';
  const mg=run?skill(h.id,'mgmt',w):0,crew=run?S.growers.filter(g=>g.from<=w&&w<=g.to&&g.assign[h.id]&&TASKS.some(([k])=>g.assign[h.id][k])):[];
  const cf=comfort(houseCrops(h,w)),P=h.pest,pc=P<15?'var(--leaf)':P<35?'var(--amber)':'var(--terra)';
  const tin=h.tin!=null?h.tin:(fc?climate(w,fc.fOut,h.sw,h):70),bad=cf&&(tin<cf.lo||tin>cf.hi),m=fc?moisture(climate(w,fc.fOut,h.sw,h),h.sw):{label:'Good'};
  const warns=houseWarn(h);
  $('mBody').innerHTML=`<p class="hint">${esc(h.desc)} Changes take effect right away and through the rest of the week.</p>
  <p class="crewl">${crew.length?`Crew today: ${crew.map(g=>`${esc(g.name)} (${TASKS.filter(([k])=>g.assign[h.id][k]).map(t=>t[1].toLowerCase()).join(', ')})`).join('; ')}.${mg?` <b>${esc(crewName(h.id,'mgmt',w))} runs these switches</b>; beneficial insects stay your call.`:''}`:'No grower on this house this week.'}</p>
  <div class="gauges">
    <div class="gauge"><span>Outside now</span><b>${S.outDays.length?Math.round(S.outDays[S.outDays.length-1]):Math.round(fc?fc.fOut:60)}°F</b></div>
    <div class="gauge ${bad?'bad':''}"><span>Inside now</span><b>${Math.round(tin)}°F</b></div>
    <div class="gauge ${m.label==='Good'?'':'bad'}"><span>Watering</span><b>${m.label}</b></div>
    <div class="gauge ${P>=35?'bad':''}"><span>Pests</span><b>${P<15?'Low':P<35?'Moderate':P<60?'High':'Severe'}</b><i class="pm"><i style="width:${P.toFixed(0)}%;background:${pc}"></i></i></div>
  </div>
  <div class="pnl">
    <div>
      <div class="sw">${SW.map(([k,l,opts])=>{const lock=mg&&k!=='bugs';return`<div class="swr"><span>${l}</span><div class="opts">${opts.map((o,i)=>`<button type="button" data-sw="${k}" data-v="${i}" class="${h.sw[k]===i?'on':''}" aria-pressed="${h.sw[k]===i}" ${lock||!run?'disabled':''}>${o}</button>`).join('')}</div></div>`;}).join('')}</div>
      <p class="gcost" style="margin-top:10px">Running cost at these settings: about ${fmt(weekCost(h,fc?fc.fOut:60))}/wk</p>
      <p style="margin:10px 0 0"><button class="btn red" type="button" id="sprayBtn" ${run?'':'disabled'}>Spray now (${fmt(75*K)})</button> <span class="gcost">Spray resistance ${Math.round(h.resist*100)}%</span></p>
    </div>
    <div>${forecastChart(h)}${warns.length?`<ul class="warnlist">${warns.map(x=>`<li>${esc(x.t)}</li>`).join('')}</ul>`:'<p class="gcost" style="margin-top:8px">No warnings for this house.</p>'}</div>
  </div>`;
  $('sprayBtn').onclick=()=>{spray(h);renderPanel();toast(`Sprayed the ${h.name.toLowerCase()}.`,'good');};
}
function forecastChart(h){
  const fc=S.fc;if(!fc||S.phase!=='run')return'';
  const w=S.week,cf=comfort(houseCrops(h,w)),Y0=20,Y1=110,y=t=>clamp((Y1-t)/(Y1-Y0)*100,0,100),X=d=>d/DAYS*700;
  const now=(S.day+S.clock/(WEEK_SEC/DAYS));
  const pLo=climate(w,fc.fOut-5,h.sw,h),pHi=climate(w,fc.fOut+5,h.sw,h);
  let s=`<svg viewBox="0 0 700 100" preserveAspectRatio="none" aria-hidden="true">`;
  if(cf)s+=`<rect x="0" y="${y(cf.hi)}" width="700" height="${y(cf.lo)-y(cf.hi)}" fill="rgba(80,180,90,.22)"/>`;
  s+=`<rect x="0" y="${y(fc.fOut+5)}" width="700" height="${y(fc.fOut-5)-y(fc.fOut+5)}" fill="rgba(120,130,140,.22)"/>`;
  s+=`<rect x="${X(now)}" y="${y(Math.max(pLo,pHi))}" width="${Math.max(0,700-X(now))}" height="${Math.abs(y(pLo)-y(pHi))+.8}" fill="rgba(233,140,40,.35)"/>`;
  if(fc.warn){const sh=climate(w,fc.fOut+(fc.warnKind==='cold'?-16:9),h.sw,h);s+=`<line x1="${X(now)}" x2="700" y1="${y(sh)}" y2="${y(sh)}" stroke="#c4542a" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`;}
  const op=S.outDays.map((t,i)=>`${X(i+.5)},${y(t)}`).join(' ');if(S.outDays.length>1)s+=`<polyline points="${op}" fill="none" stroke="#56636b" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  const ip=(h.tday||[]).map((t,i)=>t==null?'':`${X(i+.5)},${y(t)}`).filter(Boolean).join(' ');if((h.tday||[]).length>1)s+=`<polyline points="${ip}" fill="none" stroke="#c4542a" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
  s+=`<line id="nowLine" x1="${X(now)}" x2="${X(now)}" y1="0" y2="100" stroke="#e9b824" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`;
  return`<div class="fchart">${s}<span class="fy" style="top:4px">${Y1}°F</span><span class="fy" style="bottom:4px">${Y0}°F</span></div>
  <div class="fdays">${[...Array(DAYS)].map((_,i)=>`<span>Day ${i+1}</span>`).join('')}</div>
  <div class="flegend"><span><i style="background:rgba(80,180,90,.4)"></i>What crops like</span><span><i style="background:rgba(120,130,140,.4)"></i>Outside forecast</span><span><i style="background:rgba(233,140,40,.55)"></i>Inside ahead, at these settings</span><span><i style="background:#c4542a"></i>Inside so far</span><span><i style="background:#56636b"></i>Outside so far</span>${fc.warn?`<span><i style="background:repeating-linear-gradient(90deg,#c4542a 0 4px,transparent 4px 7px)"></i>If the ${fc.warnKind==='cold'?'front':'heat wave'} hits</span>`:''}</div>`;
}

/* ---- plot info ---- */
function openPlot(b){mPlot=b.id;mTab=null;$('mTabs').innerHTML='';openModal('plot',`${CROPS[b.crop].name} plot`);renderPlot();}
function renderPlot(){
  const b=S.batches.find(z=>z.id===mPlot);if(!b||b.status==='done'){closeModal();return;}
  const C=CROPS[b.crop],o=b.orderId!=null?order(b.orderId):null,h=houseOf(b.house),w=Math.min(S.week,WEEKS);
  const age=b.status==='ready'?w-b.readyWeek:0;
  let st=b.status==='planned'?(b.blocked?'Blocked: old plants are still on these benches.':`Pots in week ${b.start}.`):b.status==='growing'?`Growing: ${Math.round(clamp(b.progress/C.grow,0,1)*100)}% grown, ready about week ${readyAt(b)}.`:age<=0?'Ready and in prime condition.':`Ready, ${age} wk past prime: selling at ${Math.round(qual(age)*100)}% value. Too big after week ${b.readyWeek+C.shelf}.`;
  $('mBody').innerHTML=`<div class="figs"><div><b>${b.status==='planned'?b.qty:b.units}</b><span>flats ${b.status==='planned'?'planned':'on the bench'}</span></div><div><b>${b.lost||0}</b><span>flats lost</span></div><div><b>${C.lo}–${C.hi}°F</b><span>what it likes</span></div></div>
  <p>${esc(st)}</p>
  <p class="hint">${o?`For ${esc(o.cust)}: ${o.qty} flats, pickup week ${dueW(o)}${o.status==='shipped'?' (already shipped; these are leftovers)':''}.`:'No order attached.'} In the ${esc(h.name.toLowerCase())}.</p>
  <div class="grow">${b.status==='planned'?`<button class="btn line" type="button" id="plotCancel">Cancel this plot</button>`:''}${b.status==='ready'||(b.status==='growing'&&o&&o.status!=='open')?`<button class="btn red" type="button" id="plotToss">Toss remaining flats</button>`:''}</div>`;
  const pc=$('plotCancel');if(pc)pc.onclick=()=>{b.status='done';b.cancelled=true;say(`Cancelled the ${C.name.toLowerCase()} plot${o?` for ${o.cust}; the order needs a new plot`:''}.`,'warn');closeModal();dirty=true;};
  const pt=$('plotToss');if(pt)pt.onclick=()=>{cs(b.crop).wasted+=b.units;b.wasted=(b.wasted||0)+b.units;say(`Tossed ${b.units} ${C.name.toLowerCase()} ${fl(b.units)} to free the bench.`,'warn');b.units=0;b.status='done';b.endW=w;closeModal();dirty=true;};
}

/* ---- lots ---- */
function openLot(L){mTab=null;$('mTabs').innerHTML='';const h=S.houses.find(z=>z.lot===L.key);openModal('lot',h?`${h.name}: under construction`:'Lot for sale');
  const g=GEO[L.key];
  $('mBody').innerHTML=h?`<p>${esc(h.desc)}</p><p class="hint">Ready in ${h.building} week${h.building>1?'s':''}.</p>`:`<p class="hint">Build a ${g.cap}-flat greenhouse here for ${fmt(HOUSE_COST)}. It takes ${BUILD_WEEKS} weeks. Every house comes with its own quirks, switches, pests and weekly costs, and you'll learn its quirk when you build.</p><p><button class="btn go" type="button" id="buildBtn" ${S.phase==='run'?'':'disabled'}>Build for ${fmt(HOUSE_COST)}</button></p>`;
  const bb=$('buildBtn');if(bb)bb.onclick=()=>{if(build(L.key))closeModal();};
}

/* ---- welcome and report ---- */
function openWelcome(){
  mTab=null;$('mTabs').innerHTML='';openModal('welcome',`Year ${S.year}: welcome to your nursery`);
  $('mBody').innerHTML=`<p class="hint">Click or tap anywhere to walk. Drag to look around. Time runs about 15 seconds a week; pause any time with the space bar.</p>
  <ul class="how"><li><b>Office computer</b>Take orders, plan their plots, hire growers, check customers and the books.</li><li><b>Benches</b>Place each order's plot on a bench. It only fits if the spots are free for those weeks.</li><li><b>Control panels</b>Set heat, vents, shade, fans, water and pest control. Watch the live forecast.</li><li><b>For sale lots</b>Build another greenhouse when you're ready for more space.</li></ul>
  <p><button class="btn go" type="button" id="wGo">Head to the office</button></p>`;
  $('wGo').onclick=()=>{closeModal();goComputer('offers');};
}
function openReport(){
  mTab=null;$('mTabs').innerHTML='';
  const acc=S.orders.filter(live),ordered=acc.reduce((a,o)=>a+o.qty,0),filled=acc.reduce((a,o)=>a+o.filled,0);
  const costs=Object.values(S.cost).reduce((a,b)=>a+b,0),pr=S.rev-costs;
  openModal('report',`Year ${S.year} closed with ${fmt(pr)} profit`);
  const rows=Object.entries(S.crop).map(([c,v])=>{const C=CROPS[c],act=v.planted?v.lost/v.planted:0,exp=estLoss(c);
    return`<tr><td><i class="dot" style="background:${C.color}"></i>${C.name}</td><td class="n">${v.planted}</td><td class="n">${Math.round(exp*100)}%</td><td class="n" style="color:${act>exp+.02?'var(--terra)':'var(--leaf)'}">${Math.round(act*100)}%</td><td class="n">${v.wasted}</td><td class="n">${v.shipped}</td></tr>`;}).join('');
  const moves=S.customers.filter(c=>c.active).map(c=>({c,d:Math.round(c.score-c.start)})).sort((a,b)=>a.d-b.d),leaving=S.customers.filter(c=>c.active&&c.score<25).map(c=>c.name);
  $('mBody').innerHTML=`<p class="hint">You filled ${filled} of ${ordered} flats you accepted.${leaving.length?` ${esc(leaving.join(', '))} ${leaving.length>1?'are':'is'} not coming back.`:''} Next year's offers follow each customer's goodwill, and plot sizes use this year's loss rates.</p>
  <div class="figs"><div><b>${fmt(S.rev)}</b><span>Revenue</span></div><div><b>${fmt(costs)}</b><span>Costs</span></div><div><b>${ordered?Math.round(filled/ordered*100):0}%</b><span>Accepted flats filled</span></div><div><b>${fmt(S.aging)}</b><span>Lost to aging stock</span></div></div>
  <div class="rgrid"><div class="scroll"><table><thead><tr><th>Crop</th><th class="n">Planted</th><th class="n">Planned loss</th><th class="n">Actual loss</th><th class="n">Too big</th><th class="n">Shipped</th></tr></thead><tbody>${rows||'<tr><td colspan="6">Nothing was planted this year.</td></tr>'}</tbody></table></div>
  <table><thead><tr><th>Goodwill moves</th><th class="n">Change</th></tr></thead><tbody>${moves.slice(0,3).concat(moves.length>3?moves.slice(-2):[]).map(x=>`<tr><td>${esc(x.c.name)}</td><td class="n"><span class="${x.d>0?'up':x.d<0?'dn':''}">${x.d>0?'+':''}${x.d}</span></td></tr>`).join('')}</tbody></table></div>
  <p style="margin-top:16px"><button class="btn go" type="button" id="nyBtn">Start year ${S.year+1}</button></p>`;
  $('nyBtn').onclick=()=>{nextYear();closeModal();hud();openWelcome();};
}

/* ---- modal events ---- */
$('mTabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){mTab=b.dataset.tab;renderComputer();}});
$('mBody').addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.buf){const [id,v]=t.dataset.buf.split('|');cfgOf(order(+id)).buf=+v;renderComputer();}
  else if(t.dataset.early){const [id,v]=t.dataset.early.split('|');cfgOf(order(+id)).early=+v;renderComputer();}
  else if(t.dataset.take){const card=t.closest('.ticket');if(card&&!still){card.animate([{transform:'none'},{transform:'scale(1.04) rotate(-2deg)'},{transform:'translateY(40px) scale(.6)',opacity:0}],{duration:320,easing:'ease-in'}).onfinish=()=>takeOrder(+t.dataset.take);}else takeOrder(+t.dataset.take);}
  else if(t.dataset.decline){const o=order(+t.dataset.decline),card=t.closest('.ticket');
    const fin=()=>{o.status='declined';bump(o.custId,-2);say(`Declined ${o.cust}'s ${CROPS[o.crop].name.toLowerCase()} offer. Goodwill −2.`,'warn');renderComputer();};
    if(card&&!still){const dir=Math.random()<.5?-1:1;card.animate([{transform:'none',opacity:1},{transform:`translate(${dir*50}px,-30px) rotate(${dir*8}deg)`,offset:.3},{transform:`translate(${dir*700}px,-300px) rotate(${dir*70}deg)`,opacity:0}],{duration:650,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'}).onfinish=fin;}else fin();}
  else if(t.dataset.sw){const h=houseOf(mHouse);h.sw[t.dataset.sw]=+t.dataset.v;renderPanel();dirty=true;}
  else if(t.dataset.hire){if(S.phase==='done')return;const w=Math.min(S.week,WEEKS);draft={pid:+t.dataset.hire,from:w,to:Math.min(WEEKS,w+11),assign:{[S.houses[0].id]:{mgmt:true,crop:true,maint:true}}};renderGrowers();}
  else if(t.dataset.hirex){draft=null;renderGrowers();}
  else if(t.dataset.hireok){
    const p=S.pool.find(x=>x.id===draft.pid),w=Math.min(S.week,WEEKS);let err='';
    if(!Number.isInteger(draft.from)||!Number.isInteger(draft.to)||draft.from<w||draft.to<draft.from||draft.to>WEEKS)err=`Pick weeks from ${w} to ${WEEKS}, with the end on or after the start.`;
    else if(!gHours(draft))err='Give them at least one task in one house.';
    if(err){$('dErr').textContent=err;return;}
    S.growers.push({id:p.id,name:p.name,exp:p.exp,eth:p.eth,hort:p.hort,rate:p.rate,from:draft.from,to:draft.to,assign:JSON.parse(JSON.stringify(draft.assign))});
    S.pool=S.pool.filter(x=>x!==p);draft=null;
    say(`Contracted ${p.name} for weeks ${S.growers[S.growers.length-1].from}–${S.growers[S.growers.length-1].to}.`,'good');
    growerSet();syncNPCs();renderGrowers();
  }
  else if(t.dataset.gend){
    const g=S.growers.find(x=>x.id===+t.dataset.gend),w=Math.min(S.week,WEEKS);if(!g)return;
    if(g.from>=w){S.growers=S.growers.filter(x=>x!==g);S.pool.push({id:g.id,name:g.name,exp:g.exp,eth:g.eth,hort:g.hort,rate:g.rate});say(`Cancelled ${g.name}'s contract before it started.`,'info');}
    else{g.to=w-1;say(`Ended ${g.name}'s contract.`,'info');}
    syncNPCs();renderGrowers();
  }
});
$('mBody').addEventListener('input',e=>{const t=e.target;if(!draft)return;if(t.dataset.df){draft.from=+t.value;draftPreview();}if(t.dataset.dt){draft.to=+t.value;draftPreview();}});
$('mBody').addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.gt){const [tag,hid,k]=t.dataset.gt.split('|');const assign=tag==='d'?draft&&draft.assign:(S.growers.find(g=>'g'+g.id===tag)||{}).assign;if(!assign)return;(assign[hid]||(assign[hid]={}))[k]=t.checked;if(tag!=='d'){growerSet();syncNPCs();}renderGrowers();}
  if(t.dataset.gto){const g=S.growers.find(x=>x.id===+t.dataset.gto),w=Math.min(S.week,WEEKS),v=+t.value;if(g&&Number.isInteger(v)&&v>=Math.max(w,g.from)&&v<=WEEKS)g.to=v;t.blur();renderGrowers();}
});

/* ================= loop ================= */
let last=performance.now(),hudT=0,lastWeekSeen=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!S.paused&&S.phase==='run'){
    S.clock+=dt*S.speed;const dl=WEEK_SEC/DAYS;
    while(S.clock>=dl&&S.phase==='run'&&!S.paused){S.clock-=dl;dayTick();refreshModal();hud();}
    if(S.paused)S.clock=Math.min(S.clock,dl*.999);
  }
  if(S.week!==lastWeekSeen){lastWeekSeen=S.week;syncNPCs();}
  movePlayer(dt);moveNPCs(dt);updateCam(dt);
  draw(now);pips();
  if(mKind==='panel'&&!$('modal').hidden){const nl=document.getElementById('nowLine');if(nl){const x=(S.day+S.clock/(WEEK_SEC/DAYS))/DAYS*700;nl.setAttribute('x1',x);nl.setAttribute('x2',x);}}
  hudT+=dt;if(hudT>.5){hudT=0;hud();}
  requestAnimationFrame(frame);
}
function start(d){
  if(d&&d.v===VER&&Array.isArray(d.orders)){S=d;S.paused=true;buildMap();}
  else freshGame();
  resize();zoom=clamp(VW/1150,.55,1);
  cam.x=wx(S.player.x,S.player.y);cam.y=wy(S.player.x,S.player.y,0)-40;
  syncNPCs();hud();
  if(S.phase==='done')openReport();else if(!S.welcomed)openWelcome();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
}
</script>
